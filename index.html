// ---------------------------------------------------------------- clock-in flow
async function startClockIn() {
  const cs = S.settings;
  const sheet = openSheet({ title: 'Clock in', onClose: () => route() });
  let saving = false;
  const reqId = uuid();
  const show = (...n) => put(sheet.body, ...n);

  async function save(method, extra) {
    if (saving) return;
    saving = true;
    show(h('div', { class: 'center-block' }, h('div', { class: 'spinner' }), h('p', {}, 'Saving your clock-in…')));
    try {
      const r = await safeRequest('clock_in', 'clock_in', { p_request_id: reqId, p_method: method, ...extra });
      await refreshDash();
      show(h('div', { class: 'done-block' }, h('div', { class: 'done-icon' }, icon('check', 34)),
        h('h3', {}, `Clocked in at ${fmtTime(r.clock_in_at)}`),
        h('p', { class: 'muted' }, `${r.worksite_label}, work group cycle ${r.cycle_number}`),
        h('button', { class: 'btn btn-primary btn-block', onclick: () => sheet.close() }, 'Done')));
    } catch (e) {
      saving = false;
      const msg = friendlyError(e);
      show(h('div', { class: 'notice bad' }, `Not clocked in. ${msg}`),
        h('div', { class: 'sheet-actions' },
          h('button', { class: 'btn', onclick: () => sheet.close() }, 'Close'),
          /already clocked in/i.test(msg) ? null : h('button', { class: 'btn btn-primary', onclick: () => save(method, extra) }, 'Try again')));
    }
  }

  function intro() {
    const allowDevice = cs.location_mode !== 'manual_only';
    const allowManual = cs.location_mode !== 'device_only';
    show(h('div', { class: 'stack' },
      allowDevice ? h('div', { class: 'explain' }, icon('map', 28),
        h('div', {}, h('h3', {}, 'Confirm where you’re working'),
          h('p', { class: 'muted' }, 'Your phone will be asked for your location once, to look up the street you’re on. It’s saved with this clock-in only. The app does not track you.'))) : null,
      !allowDevice ? h('p', { class: 'muted' }, 'Choose the worksite you’re at.') : null,
      allowDevice ? h('button', { class: 'btn btn-primary btn-block btn-lg', onclick: locate }, icon('map'), 'Use my location') : null,
      allowManual ? h('button', { class: `btn btn-block${allowDevice ? '' : ' btn-primary btn-lg'}`, onclick: manual }, 'Choose a site from the list') : null));
  }

  function locate() {
    if (!window.isSecureContext) return failLocation('Location only works over a secure (https) connection.');
    if (!navigator.geolocation) return failLocation('This browser can’t share location.');
    show(h('div', { class: 'center-block' }, h('div', { class: 'spinner' }), h('p', {}, 'Getting your location…'),
      h('p', { class: 'muted small' }, 'If your phone asks, choose “Allow”.')));
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      show(h('div', { class: 'center-block' }, h('div', { class: 'spinner' }), h('p', {}, 'Finding the street…')));
      try {
        const place = await reverseGeocode(latitude, longitude);
        if (!place.street) return failLocation('The street couldn’t be determined from your location.');
        confirmPlace({ latitude, longitude, accuracy, ...place });
      } catch (e) {
        failLocation('The street lookup service didn’t respond.');
      }
    }, (err) => {
      failLocation({ 1: 'Location permission was denied. You can allow it in your browser settings.',
                     2: 'Your location isn’t available right now.', 3: 'Finding your location took too long.' }[err.code] || 'Location failed.');
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function failLocation(reason) {
    const allowManual = cs.location_mode !== 'device_only';
    show(h('div', { class: 'stack' }, h('div', { class: 'notice warn' }, reason),
      allowManual ? h('p', { class: 'muted' }, 'You can choose a site instead. It will be marked as manually selected (unverified).')
        : h('p', { class: 'muted' }, 'Your company requires location to clock in. Please try again or contact your administrator.'),
      h('div', { class: 'sheet-actions' },
        h('button', { class: 'btn', onclick: locate }, 'Try location again'),
        allowManual ? h('button', { class: 'btn btn-primary', onclick: manual }, 'Choose a site') : null)));
  }

  function confirmPlace(loc) {
    show(h('div', { class: 'stack' },
      h('div', { class: 'place' }, icon('pin', 26), h('div', {},
        h('div', { class: 'place-street' }, loc.street),

async function reverseGeocode(lat, lon) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 12000);
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=en&lat=${lat.toFixed(6)}&lon=${lon.toFixed(6)}`;
    const r = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(`lookup ${r.status}`);
    const j = await r.json();
    const a = j.address || {};
    return {
      street: a.road || a.pedestrian || a.footway || a.street || a.residential || a.path || a.cycleway || '',
      locality: a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || a.county || '',
      region: a.state || a.province || a.region || '',
      postal_code: a.postcode || '',
      country: a.country || '',
    };
  } finally { clearTimeout(t); }
}

// ---------------------------------------------------------------- clock-out flow
function startClockOut() {
  const a = S.dash.active_shift;
  if (!a) return;
  const cs = S.settings;
  const reqId = uuid();
  const sheet = openSheet({ title: 'Clock out', onClose: () => route() });
  const show = (...n) => put(sheet.body, ...n);
  const elapsedMin = () => (nowServer() - new Date(a.clock_in_at)) / 60000;
  let lunch = 0, saving = false;

  const summary = () => h('div', { class: 'out-summary' },
    h('div', {}, h('div', { class: 'muted small' }, 'Worksite'), h('div', { class: 'strong' }, a.worksite_label)),
    h('div', {}, h('div', { class: 'muted small' }, 'Clocked in'), h('div', { class: 'strong' }, fmtTime(a.clock_in_at))),
    h('div', {}, h('div', { class: 'muted small' }, 'Elapsed'), h('div', { class: 'strong' }, elapsedNode(a.clock_in_at, 'mono'))));

  function ask() {
    show(summary(),
      h('h3', { class: 'question' }, 'Did you take a lunch break today?'),
      h('div', { class: 'yes-no' },
        h('button', { class: 'btn btn-lg', onclick: () => { lunch = Math.min(cs.default_lunch_minutes, cs.max_lunch_minutes); lunchStep(); } }, 'Yes'),
        h('button', { class: 'btn btn-lg', onclick: () => { lunch = 0; confirmStep(); } }, 'No')));
  }

  function lunchStep() {
    const input = h('input', { type: 'number', inputmode: 'numeric', min: 0, max: cs.max_lunch_minutes, step: 1, value: lunch, class: 'lunch-input', 'aria-label': 'Lunch minutes' });
    const err = h('div', { class: 'field-error', role: 'alert' });
    const set = (v) => { lunch = Math.max(0, Math.min(cs.max_lunch_minutes, Math.round(Number(v) || 0))); input.value = lunch; validate(); };
    const validate = () => {
      let m = '';
      if (lunch > cs.max_lunch_minutes) m = `Lunch can be at most ${cs.max_lunch_minutes} minutes.`;
      else if (lunch > 0 && lunch >= elapsedMin()) m = 'Lunch can’t be as long as the whole shift.';
      err.textContent = m; next.disabled = !!m; return !m;
    };
    input.addEventListener('input', () => { lunch = Math.round(Number(input.value) || 0); validate(); });
    const next = h('button', { class: 'btn btn-primary btn-block btn-lg', onclick: () => { if (validate()) confirmStep(); } }, 'Continue');
    show(summary(), h('h3', { class: 'question' }, 'How long was your lunch?'),
      h('div', { class: 'stepper' },
        h('button', { class: 'btn step', 'aria-label': 'Five minutes less', onclick: () => set(lunch - 5) }, '−5'),
        h('div', { class: 'stepper-mid' }, input, h('span', { class: 'muted' }, 'minutes')),
        h('button', { class: 'btn step', 'aria-label': 'Five minutes more', onclick: () => set(lunch + 5) }, '+5')),
      err, next, h('button', { class: 'btn btn-ghost btn-block', onclick: ask }, 'Back'));
    validate();
  }

  function confirmStep() {
    const net = h('span');
    const u = () => { net.textContent = minutesText(Math.max(0, elapsedMin() - lunch)); };
    u(); every(1000, u);
    show(summary(),
      kv([['Lunch deduction', lunch ? `${lunch} minutes` : 'None'], ['Net hours (so far)', net]]),
      h('button', { class: 'btn btn-out btn-block btn-lg', onclick: save }, 'Clock out now'),
      h('button', { class: 'btn btn-ghost btn-block', onclick: ask }, 'Change lunch answer'));
  }

  async function save() {
    if (saving) return;
    saving = true;
    show(h('div', { class: 'center-block' }, h('div', { class: 'spinner' }), h('p', {}, 'Saving your clock-out…')));
    try {
      const r = await safeRequest('clock_out', 'clock_out', { p_request_id: reqId, p_lunch_minutes: lunch });
      await refreshDash();
      const g = S.dash.current_group;
      show(h('div', { class: 'done-block' }, h('div', { class: 'done-icon' }, icon('check', 34)),
        h('h3', {}, `Clocked out at ${fmtTime(r.clock_out_at)}`),
        kv([['Worksite', r.worksite_label], ['In', fmtDateTime(r.clock_in_at)], ['Out', fmtDateTime(r.clock_out_at)],
            ['Total time', minutesText(r.gross_minutes)], ['Lunch', `${r.lunch_minutes} min`],
            ['Net hours', h('strong', {}, `${minutesText(r.net_minutes)} (${hoursDec(r.net_minutes)} h)`)],
            g && g.work_group_id === r.work_group_id ? ['Group total so far', minutesText(g.net_minutes)] : null]),
        r.needs_review ? h('div', { class: 'notice warn' }, `${r.review_reason}. Your administrator will review it.`) : null,
        h('button', { class: 'btn btn-primary btn-block', onclick: () => sheet.close() }, 'Done')));
    } catch (e) {
      saving = false;
      show(h('div', { class: 'notice bad' }, `Not clocked out. ${friendlyError(e)}`),
        h('div', { class: 'sheet-actions' }, h('button', { class: 'btn', onclick: () => sheet.close() }, 'Close'),
          h('button', { class: 'btn btn-primary', onclick: save }, 'Try again')));
    }
  }
  ask();
}

// date range presets based on company pay periods
async function rangePresets() {
  const t = S.dash?.today || todayYMD();
  const pp = await rpc('pay_periods', { p_from: addDays(t, -40), p_to: t }).catch(() => []);
  const cur = pp.find((p) => p.period_start <= t && p.period_end >= t);
  const prev = cur ? pp.find((p) => p.period_end === addDays(cur.period_start, -1)) : null;
  const dow = new Date(`${t}T12:00:00Z`).getUTCDay();
  const wkStart = addDays(t, -((dow - (S.settings?.week_starts_on ?? 0) + 7) % 7));
  return [
    cur ? ['This pay period', cur.period_start, cur.period_end] : null,
    prev ? ['Last pay period', prev.period_start, prev.period_end] : null,
    ['This week', wkStart, addDays(wkStart, 6)],
    ['Last 30 days', addDays(t, -29), t],
    ['This year', `${t.slice(0, 4)}-01-01`, `${t.slice(0, 4)}-12-31`],
    ['All time', '2000-01-01', '2100-12-31'],
  ].filter(Boolean);
}

function rangeControl(state, presets, onChange) {
  const sel = h('select', { 'aria-label': 'Date range' },
    presets.map(([l]) => h('option', { value: l }, l)), h('option', { value: 'custom' }, 'Custom dates'));
  const from = h('input', { type: 'date', value: state.from, 'aria-label': 'From' });
  const to = h('input', { type: 'date', value: state.to, 'aria-label': 'To' });
  const custom = h('div', { class: 'row gap-sm', hidden: state.preset !== 'custom' }, from, h('span', { class: 'muted' }, 'to'), to);
  sel.value = state.preset;
  sel.addEventListener('change', () => {
    state.preset = sel.value;
    const p = presets.find((x) => x[0] === sel.value);
    if (p) { state.from = p[1]; state.to = p[2]; from.value = p[1]; to.value = p[2]; }
    custom.hidden = sel.value !== 'custom';
    onChange();
  });
  const upd = () => { if (from.value && to.value) { state.from = from.value; state.to = to.value; onChange(); } };
  from.addEventListener('change', upd); to.addEventListener('change', upd);
  return h('div', { class: 'filter-range' }, sel, custom);
}

// ---------------------------------------------------------------- my hours
PAGES.hours = async () => {
  const presets = await rangePresets();
  const st = { preset: presets[0][0], from: presets[0][1], to: presets[0][2], site: '', status: '' };
  const sites = await db(S.sb.from('group_summaries').select('worksite_id,worksite_label').eq('employee_id', S.me.employee_id));
  const siteOpts = [...new Map(sites.map((x) => [x.worksite_id, x.worksite_label])).entries()];
  const out = h('div', { class: 'stack' });
  const siteSel = h('select', { 'aria-label': 'Worksite' }, h('option', { value: '' }, 'All worksites'), siteOpts.map(([id, l]) => h('option', { value: id }, l)));
  const statusSel = h('select', { 'aria-label': 'Status' }, [['', 'All statuses'], ['active', 'On the clock'], ['open', 'Draft (not submitted)'],
    ['submitted', 'Submitted'], ['under_review', 'Under review'], ['returned', 'Returned'], ['approved', 'Approved']].map(([v, l]) => h('option', { value: v }, l)));
  siteSel.addEventListener('change', () => { st.site = siteSel.value; load(); });
  statusSel.addEventListener('change', () => { st.status = statusSel.value; load(); });

  async function load() {
    put(out, h('div', { class: 'spinner' }));
    let q = S.sb.from('shift_details').select('*').eq('employee_id', S.me.employee_id).gte('work_date', st.from).lte('work_date', st.to);
    if (st.site) q = q.eq('worksite_id', st.site);
    if (st.status === 'active') q = q.eq('is_active', true);
    else if (st.status === 'open') q = q.eq('group_status', 'open');
    else if (st.status) q = q.eq('report_status', st.status);
    const rows = await db(q.order('clock_in_at', { ascending: false }).limit(1000));
    const done = rows.filter((r) => !r.is_active);
    const total = done.reduce((a, r) => a + Number(r.net_minutes), 0);
    const est = done.reduce((a, r) => a + Number(r.estimated_amount || 0), 0);
    const byDay = new Map();
    rows.forEach((r) => { if (!byDay.has(r.work_date)) byDay.set(r.work_date, []); byDay.get(r.work_date).push(r); });
    put(out, 
      h('div', { class: 'stat-grid three' }, stat('Net hours', minutesText(total), `${hoursDec(total)} h`),
        stat('Shifts', String(rows.length), `${byDay.size} day${byDay.size === 1 ? '' : 's'}`),
        stat('Estimated earnings', money(est), 'estimate, not payroll')),
      rows.length ? [...byDay.entries()].map(([day, list]) => h('div', { class: 'day-group' },
        h('div', { class: 'day-head' }, h('span', {}, `${weekday(day)} ${fmtYMD(day)}`),
          h('span', { class: 'muted' }, `${minutesText(list.filter((r) => !r.is_active).reduce((a, r) => a + Number(r.net_minutes), 0))} net`)),
        h('div', { class: 'list' }, list.map((r) => shiftRow(r)))))
        : empty('No shifts in this range.'));
  }
  load();
  return [pageHead('My hours', 'Your official shift records. Tap a shift for details or to request a correction.',
    h('button', { class: 'btn', onclick: () => exportMyTimesheet(st) }, icon('download'), 'Export')),
  h('div', { class: 'filters' }, rangeControl(st, presets, load), siteSel, statusSel), out];
};

async function submitSheet(g) {
  const sheet = openSheet({ title: g.status === 'returned' ? 'Resubmit report' : 'Submit report', wide: true, onClose: () => route() });
  const rows = await db(S.sb.from('shift_details').select('*').eq('work_group_id', g.work_group_id).eq('is_active', false).order('clock_in_at'));
  const notes = await db(S.sb.from('notes').select('title,body').eq('employee_id', S.me.employee_id).eq('work_group_id', g.work_group_id).eq('archived', false));
  const rates = [...new Set(rows.map((r) => r.hourly_rate).filter(Boolean))];
  const total = rows.reduce((a, r) => a + Number(r.net_minutes), 0);
  const lunch = rows.reduce((a, r) => a + Number(r.lunch_minutes), 0);
  const est = rows.reduce((a, r) => a + Number(r.estimated_amount || 0), 0);
  const note = h('textarea', { rows: 3, maxlength: 2000, placeholder: 'Anything your administrator should know (optional)' });
  const agree = h('input', { type: 'checkbox' });
  const reqId = uuid();
  const btn = h('button', { class: 'btn btn-primary btn-lg', onclick: async () => {
    if (!agree.checked) return toast('Tick the box to confirm the hours are correct.', 'bad');
    btn.disabled = true;
    try {
      const r = await safeRequest('submit', 'submit_report', { p_work_group_id: g.work_group_id, p_request_id: reqId, p_note: note.value || null });
      put(sheet.body, h('div', { class: 'done-block' }, h('div', { class: 'done-icon' }, icon('check', 34)),
        h('h3', {}, 'Report submitted'),
        h('p', { class: 'muted' }, `${minutesText(r.net_minutes)} at ${g.worksite_label}. These hours are now locked. Your next shift there starts a new cycle.`),
        h('button', { class: 'btn btn-primary btn-block', onclick: () => sheet.close() }, 'Done')));
    } catch (e) { btn.disabled = false; toast(`Not submitted. ${friendlyError(e)}`, 'bad'); }
  } }, 'Submit report');
  add(sheet.body, 
    kv([['Employee', S.dash.profile.full_name], ['Worksite', g.worksite_label], ['Cycle', String(g.cycle_number)],
        ['Dates', rows.length ? `${fmtYMD(rows[0].work_date)} – ${fmtYMD(rows[rows.length - 1].work_date)}` : '—'],
        ['Status', STATUS_LABEL[g.report_status || g.status]]]),
    h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, h('th', {}, 'Date'), h('th', {}, 'In – out'), h('th', {}, 'Lunch'), h('th', {}, 'Net'), h('th', { class: 'hide-sm' }, 'Rate'), h('th', {}, 'Est.'))),
      h('tbody', {}, rows.map((r) => h('tr', {}, h('td', { class: 'nowrap' }, shortDay(r.work_date)), h('td', { class: 'inout' }, h('span', {}, `${fmtTime(r.clock_in_at)} –`), ' ', h('span', {}, fmtTime(r.clock_out_at))),
        h('td', {}, `${r.lunch_minutes}m`), h('td', { class: 'nowrap' }, minutesText(r.net_minutes)), h('td', { class: 'hide-sm' }, r.hourly_rate ? money(r.hourly_rate) : '—'),
        h('td', {}, r.estimated_amount ? money(r.estimated_amount) : '—')))),
      h('tfoot', {}, h('tr', {}, h('td', { colspan: 2 }, 'Total'), h('td', {}, `${lunch}m`), h('td', { class: 'nowrap' }, minutesText(total)),
        h('td', { class: 'hide-sm' }, rates.length ? rates.map(money).join(', ') : '—'), h('td', {}, money(est)))))),
    rates.length ? h('p', { class: 'muted small' }, `Hourly rate: ${rates.map(money).join(', ')}.`) : null,
    h('p', { class: 'muted small' }, 'Estimated earnings are net hours × your hourly rate. They are not an official payroll result.'),
    notes.length ? h('div', { class: 'stack' }, h('h3', {}, 'Notes included'), notes.map((n) => h('div', { class: 'rev' }, h('strong', {}, n.title), h('div', { class: 'muted pre' }, n.body)))) : null,
    h('label', { class: 'field' }, h('span', {}, 'Note for your administrator'), note),
    h('label', { class: 'check-row' }, agree, h('span', {}, 'I confirm these hours are correct. After submitting, I can’t edit them — only request corrections.')),
    h('div', { class: 'sheet-actions' }, h('button', { class: 'btn', onclick: () => sheet.close() }, 'Cancel'), btn));
}

      h('div', { class: 'row-sub' }, `Cycle ${r.cycle_number}, ${fmtYMD(r.period_start)} – ${fmtYMD(r.period_end)}, submitted ${fmtYMD(localYMD(r.submitted_at))}`)),

        r.changed_after_submission ? h('span', { class: 'tag warn' }, 'Changed') : null, admin && r.flagged ? h('span', { class: 'tag bad' }, 'Flagged') : null)));

async function reportSheet(id, admin) {
  const sheet = openSheet({ title: 'Report', wide: true, onClose: () => route() });
  const [r] = await db(S.sb.from('report_details').select('*').eq('id', id));
  const snaps = await db(S.sb.from('report_snapshots').select('*').eq('report_id', id).order('version', { ascending: false }));
  const pays = await db(S.sb.from('payments').select('*').eq('report_id', id).order('paid_on'));
  const snap = snaps[0]?.snapshot;
  const body = sheet.body;
  add(body, 
    h('div', { class: 'row gap-sm wrap-row' }, chip(r.status), r.status === 'approved' ? chip(r.payment_status) : null,
      r.flagged && admin ? h('span', { class: 'tag bad' }, `Flagged: ${r.flag_note}`) : null),
    r.status === 'returned' ? h('div', { class: 'notice warn' }, `Returned for review: ${r.review_note || ''}`) : null,
    r.changed_after_submission ? h('div', { class: 'notice warn' }, `Hours were corrected after submission. Submitted: ${minutesText(r.snapshot_net_minutes)}; current: ${minutesText(r.current_net_minutes)}.`) : null,
    kv([['Employee', `${r.full_name} (#${r.employee_number})`], ['Worksite', r.worksite_label], ['Cycle', String(r.cycle_number)],
        ['Dates', `${fmtYMD(r.period_start)} – ${fmtYMD(r.period_end)}`], ['Submitted', `${fmtDateTime(r.submitted_at)}${r.submission_count > 1 ? ` (submission ${r.submission_count})` : ''}`],
        ['Net hours (submitted)', minutesText(r.snapshot_net_minutes)], ['Estimate (submitted)', money(r.snapshot_estimated_amount)],
        r.approved_amount !== null ? ['Approved', `${minutesText(r.approved_net_minutes)}, ${money(r.approved_amount)}`] : null,
        r.status === 'approved' ? ['Paid', money(r.amount_paid)] : null,
        r.status === 'approved' ? ['Outstanding', money(r.outstanding_amount)] : null,
        r.review_note && r.status !== 'returned' ? ['Admin note', r.review_note] : null,
        r.employee_note ? ['Employee note', r.employee_note] : null]),
    snap ? snapshotTable(snap) : null,
    pays.length ? h('div', { class: 'stack' }, h('h3', {}, 'Payments'), pays.map((p) => h('div', { class: `rev${p.voided_at ? ' voided' : ''}` },
      h('strong', {}, `${money(p.amount)} on ${fmtYMD(p.paid_on)}`), ` ${[p.method, p.reference].filter(Boolean).join(', ')}`,
      p.voided_at ? h('div', { class: 'muted' }, `Voided: ${p.void_reason}`) : null))) : null,
    snaps.length > 1 ? h('p', { class: 'muted small' }, `${snaps.length} submitted versions are kept. Showing the latest.`) : null,
    h('div', { class: 'sheet-actions wrap-row' },
      h('button', { class: 'btn', onclick: () => printReport(r, snap, pays) }, icon('download'), 'PDF'),
      !admin && r.status === 'returned' ? h('a', { class: 'btn btn-primary', href: '#/groups', onclick: () => sheet.close() }, 'Resubmit from Work groups') : null,
      !admin ? h('button', { class: 'btn btn-ghost', onclick: () => { sheet.close(); correctionSheet({ report: r }); } }, 'Request correction') : null,
      admin ? adminReportActions(r, sheet) : null));
}

// ---------------------------------------------------------------- notes
PAGES.notes = async () => {
  const st = { q: '', sort: 'updated', show: 'active' };
  const list = h('div', { class: 'cards' });
  const search = h('input', { type: 'search', placeholder: 'Search notes', 'aria-label': 'Search notes' });
  const sortSel = h('select', { 'aria-label': 'Sort' }, [['updated', 'Recently updated'], ['created', 'Recently created'], ['date', 'Note date'], ['title', 'Title A–Z']].map(([v, l]) => h('option', { value: v }, l)));
  const showSel = h('select', { 'aria-label': 'Show' }, [['active', 'Notes'], ['pinned', 'Pinned'], ['archived', 'Archived'], ['all', 'All']].map(([v, l]) => h('option', { value: v }, l)));
  let all = [];
  const render = () => {
    const q = st.q.toLowerCase();
    let rows = all.filter((n) => (st.show === 'all' || (st.show === 'archived' ? n.archived : st.show === 'pinned' ? n.pinned && !n.archived : !n.archived))
      && (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q)));
    const key = { updated: (n) => n.updated_at, created: (n) => n.created_at, date: (n) => n.note_date || '', title: (n) => n.title.toLowerCase() }[st.sort];
    rows = rows.sort((a, b) => (st.sort === 'title' ? key(a).localeCompare(key(b)) : String(key(b)).localeCompare(String(key(a)))));
    if (st.sort !== 'title') rows.sort((a, b) => Number(b.pinned) - Number(a.pinned));
    put(list, ...(rows.length ? rows.map(noteCard) : [empty(all.length ? 'No notes match.' : 'No notes yet. Add one to keep track of materials, site details or anything else.')]));
  };
  const reload = async () => { all = await db(S.sb.from('notes').select('*').eq('employee_id', S.me.employee_id)); render(); };
  search.addEventListener('input', () => { st.q = search.value; render(); });
  sortSel.addEventListener('change', () => { st.sort = sortSel.value; render(); });
  showSel.addEventListener('change', () => { st.show = showSel.value; render(); });
  await reload();
  PAGES.notes._reload = reload;
  return [pageHead('Notes', null, h('button', { class: 'btn btn-primary', onclick: () => noteEditor(null, reload) }, icon('plus'), 'New note')),
    notesDisclosure(),
    h('div', { class: 'filters' }, search, sortSel, showSel), list];
};

const notesDisclosure = () => h('div', { class: 'notice info disclosure' }, icon('shield'),
  h('span', {}, 'Notes may be viewed by authorized administrators of your company. Other employees can’t see them.'));

function noteCard(n) {
  return h('button', { class: `note-card${n.archived ? ' archived' : ''}`, type: 'button', onclick: () => noteEditor(n, PAGES.notes._reload) },
    h('div', { class: 'note-top' }, h('h3', {}, n.title), n.pinned ? h('span', { class: 'tag' }, 'Pinned') : null, n.archived ? h('span', { class: 'tag' }, 'Archived') : null),
    h('p', { class: 'note-snippet' }, n.body.slice(0, 180) || h('span', { class: 'muted' }, 'No text')),
    h('div', { class: 'muted small' }, [n.note_date ? `For ${fmtYMD(n.note_date)}` : null, n.work_group_id ? 'Linked to a work group' : null,
      n.shift_id ? 'Linked to a shift' : null, `Updated ${fmtDateTime(n.updated_at)}`].filter(Boolean).join('. ')));
}

async function noteEditor(n, reload) {
  const groups = await db(S.sb.from('group_summaries').select('work_group_id,worksite_label,cycle_number').eq('employee_id', S.me.employee_id).order('opened_at', { ascending: false }).limit(50));
  const shifts = await db(S.sb.from('shift_details').select('shift_id,worksite_label,clock_in_at,work_date').eq('employee_id', S.me.employee_id).order('clock_in_at', { ascending: false }).limit(40));
  const days = S.settings?.notes_employee_can_edit_days;
  const locked = n && days !== null && days !== undefined && (Date.now() - new Date(n.created_at)) / 86400000 > days;
  const sheet = openSheet({ title: n ? 'Edit note' : 'New note', wide: true });
  const title = h('input', { type: 'text', maxlength: 150, required: true, value: n?.title || '', disabled: locked });
  const body = h('textarea', { rows: 9, maxlength: 20000, value: n?.body || '', disabled: locked });
  const date = h('input', { type: 'date', value: n?.note_date || '', disabled: locked });
  const grp = h('select', { disabled: locked }, h('option', { value: '' }, 'None'), groups.map((g) => h('option', { value: g.work_group_id }, `${g.worksite_label}, cycle ${g.cycle_number}`)));
  grp.value = n?.work_group_id || '';
  const sh = h('select', { disabled: locked }, h('option', { value: '' }, 'None'), shifts.map((x) => h('option', { value: x.shift_id }, `${fmtYMD(x.work_date)} ${fmtTime(x.clock_in_at)}, ${x.worksite_label}`)));
  sh.value = n?.shift_id || '';
  const pin = h('input', { type: 'checkbox', disabled: locked }); pin.checked = !!n?.pinned;
  const arch = h('input', { type: 'checkbox', disabled: locked }); arch.checked = !!n?.archived;
  const reqId = uuid();
  const save = h('button', { class: 'btn btn-primary', disabled: locked, onclick: async () => {
    if (!title.value.trim()) return toast('Give the note a title.', 'bad');
    const r = await act(save, () => rpc('save_note', { p_note_id: n?.id || null, p_request_id: reqId, p_title: title.value, p_body: body.value,
      p_note_date: date.value || null, p_shift_id: sh.value || null, p_work_group_id: grp.value || null, p_pinned: pin.checked, p_archived: arch.checked }), 'Note saved');
    if (r !== undefined) { sheet.close(); reload && reload(); }
  } }, 'Save note');
  add(sheet.body, notesDisclosure(),
    locked ? h('div', { class: 'notice warn' }, `Notes can be edited for ${days} days after they’re created (company policy). This one is now read-only.`) : null,
    h('label', { class: 'field' }, h('span', {}, 'Title'), title),
    h('label', { class: 'field' }, h('span', {}, 'Note'), body),
    h('div', { class: 'grid-2' }, h('label', { class: 'field' }, h('span', {}, 'Date (optional)'), date),
      h('label', { class: 'field' }, h('span', {}, 'Work group (optional)'), grp)),
    h('label', { class: 'field' }, h('span', {}, 'Shift (optional)'), sh),
    h('div', { class: 'row gap' }, h('label', { class: 'check-row' }, pin, h('span', {}, 'Pin to top')), h('label', { class: 'check-row' }, arch, h('span', {}, 'Archive'))),
    n ? h('p', { class: 'muted small' }, `Created ${fmtDateTime(n.created_at)}. Updated ${fmtDateTime(n.updated_at)}. Notes are kept for company records; archiving hides a note from your list.`) : null,
    h('div', { class: 'sheet-actions' }, h('button', { class: 'btn', onclick: () => sheet.close() }, 'Cancel'), save));
}

// ---------------------------------------------------------------- earnings & payments
PAGES.earnings = async () => {
  const presets = (await rangePresets()).filter((p) => p[0] !== 'All time');
  const st = { preset: presets[0][0], from: presets[0][1], to: presets[0][2] };
  const rates = await db(S.sb.from('wage_rates').select('*').eq('employee_id', S.me.employee_id).order('effective_from', { ascending: false }));
  const reps = await db(S.sb.from('report_details').select('*').eq('employee_id', S.me.employee_id).order('submitted_at', { ascending: false }));
  const pays = await db(S.sb.from('payments').select('*').eq('employee_id', S.me.employee_id).order('paid_on', { ascending: false }));
  const periodOut = h('div');
  const ot = S.settings?.overtime_enabled;
  async function loadPeriod() {
    const days = await rpc('daily_hours', { p_from: st.from, p_to: st.to, p_employee_id: S.me.employee_id });
    const sum = (k) => days.reduce((a, d) => a + Number(d[k] || 0), 0);
    put(periodOut, 
      h('div', { class: 'stat-grid three' }, stat('Net hours', minutesText(sum('net_minutes'))),
        ot ? stat('Overtime', minutesText(sum('overtime_minutes') + sum('double_time_minutes')), 'as configured by your company') : stat('Days worked', String(days.length)),
        stat('Estimated earnings', money(sum('estimated_amount')), days.some((d) => d.missing_rate) ? 'some days have no rate set' : 'estimate only')),
      days.length ? h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
        h('thead', {}, h('tr', {}, ['Date', 'Net', ot ? 'Regular' : null, ot ? 'Overtime' : null, ot ? 'Double' : null, 'Rate', 'Estimate'].filter(Boolean).map((x) => h('th', {}, x)))),
        h('tbody', {}, days.map((d) => h('tr', {}, h('td', { class: 'nowrap' }, shortDay(d.work_date)), h('td', {}, minutesText(d.net_minutes)),
          ot ? h('td', {}, minutesText(d.regular_minutes)) : null, ot ? h('td', {}, minutesText(d.overtime_minutes)) : null, ot ? h('td', {}, minutesText(d.double_time_minutes)) : null,
          h('td', {}, d.hourly_rate ? money(d.hourly_rate) : '—'), h('td', {}, money(d.estimated_amount))))))) : empty('No completed shifts in this period.'));
  }
  loadPeriod();
  const approved = reps.filter((r) => r.status === 'approved');
  const outstanding = approved.reduce((a, r) => a + Number(r.outstanding_amount), 0);
  return [
    pageHead('Earnings & payments'),
    h('div', { class: 'notice info' }, 'Estimated earnings are net hours × your hourly rate. They’re not official payroll results and don’t include deductions. Approved amounts and payments come from your administrator.'),
    h('div', { class: 'stat-grid three' },
      stat('Current hourly rate', S.dash.current_rate ? `${money(S.dash.current_rate)}/h` : 'Not set', rates[0] ? `since ${fmtYMD(rates.find((x) => x.effective_from <= S.dash.today)?.effective_from || rates[0].effective_from)}` : 'ask your administrator'),
      stat('Approved, not yet paid', money(outstanding), `${approved.filter((r) => r.payment_status !== 'paid').length} report(s)`),
      stat('Last payment', pays.find((p) => !p.voided_at) ? money(pays.find((p) => !p.voided_at).amount) : '—', pays.find((p) => !p.voided_at) ? fmtYMD(pays.find((p) => !p.voided_at).paid_on) : 'no payments yet')),
    card({}, cardHead('Pay period estimate', 'Your daily hours in the selected range'), h('div', { class: 'filters' }, rangeControl(st, presets, loadPeriod)), periodOut),
    card({}, cardHead('Reports and payment status'),
      reps.length ? h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
        h('thead', {}, h('tr', {}, ['Worksite', 'Dates', 'Report', 'Approved', 'Paid', 'Payment'].map((x) => h('th', {}, x)))),
        h('tbody', {}, reps.map((r) => h('tr', {}, h('td', {}, r.worksite_label), h('td', { class: 'nowrap' }, dayRange(r.period_start, r.period_end)),
          h('td', {}, chip(r.status)), h('td', {}, r.approved_amount !== null ? money(r.approved_amount) : '—'), h('td', {}, money(r.amount_paid)),
          h('td', {}, r.status === 'approved' ? chip(r.payment_status) : '—')))))) : empty('No reports yet.')),
    card({}, cardHead('Payments received'),
      pays.length ? h('div', { class: 'list' }, pays.map((p) => h('div', { class: `rev${p.voided_at ? ' voided' : ''}` },
        h('div', { class: 'row' }, h('strong', {}, money(p.amount)), h('span', { class: 'spacer' }), h('span', { class: 'muted' }, fmtYMD(p.paid_on))),
        h('div', { class: 'muted small' }, [p.method, p.reference ? `ref ${p.reference}` : null].filter(Boolean).join(', ') || 'No method recorded'),
        p.voided_at ? h('div', { class: 'small' }, `Voided by administrator: ${p.void_reason}`) : null))) : empty('No payments recorded yet.')),
    card({}, cardHead('Rate history'), rates.length ? kv(rates.map((r) => [`From ${fmtYMD(r.effective_from)}`, `${money(r.hourly_rate)}/h${r.note ? ` (${r.note})` : ''}`])) : empty('No rate set yet.')),
  ];
};

// ---------------------------------------------------------------- employee settings
PAGES.settings = async () => {
  await refreshDash();
  const p = S.dash.profile, pr = S.prefs, cs = S.settings;
  const dn = h('input', { type: 'text', maxlength: 60, value: p.display_name || '', placeholder: p.full_name });
  const pn = h('input', { type: 'text', maxlength: 60, value: p.preferred_name || '', placeholder: 'Used in your greeting' });
  const saveName = h('button', { class: 'btn btn-primary', onclick: async () => {
    const r = await act(saveName, () => rpc('update_my_profile_v2', { p_display_name: dn.value, p_preferred_name: pn.value }), 'Name saved');
    if (r !== undefined) { await refreshDash(); route(); }
  } }, 'Save names');
  const theme = h('select', {}, [['system', 'Match my phone'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => h('option', { value: v }, l)));
  theme.value = pr.theme;
  const fmt = h('select', {}, [['company', `Company default (${cs.time_format === '24h' ? '24-hour' : '12-hour'})`], ['12h', '12-hour'], ['24h', '24-hour']].map(([v, l]) => h('option', { value: v }, l)));
  fmt.value = pr.clock_format;
  const secs = h('input', { type: 'checkbox' }); secs.checked = pr.show_seconds;
  const motion = h('input', { type: 'checkbox' }); motion.checked = pr.reduce_motion;
  const savePrefs = h('button', { class: 'btn btn-primary', onclick: async () => {
    const r = await act(savePrefs, () => rpc('update_my_preferences', { p_theme: theme.value, p_clock_format: fmt.value, p_show_seconds: secs.checked, p_reduce_motion: motion.checked }), 'Preferences saved');
    if (r !== undefined) {
      S.prefs = { ...S.prefs, theme: theme.value, clock_format: fmt.value, show_seconds: secs.checked, reduce_motion: motion.checked };
      applyPrefs();
      await refreshDash(); route();
    }

async function setStatus(e, status) {

  const v = await formSheet({ title: `${label} ${e.full_name}?`, text, danger: status !== 'active', confirm: label,
    fields: status === 'active' ? [] : [{ name: 'reason', label: 'Reason (visible to admins)', max: 300 }] });

PAGES['admin/hours'] = async () => {
  const emps = await employeeList();
  const sites = await db(S.sb.from('worksites').select('id,label,source,is_active').order('label'));
  const presets = await rangePresets();
  const st = { preset: presets[0][0], from: presets[0][1], to: presets[0][2] };
  const empSel = h('select', { 'aria-label': 'Employee' }, empOptions(emps)); empSel.value = AF.employee || ''; AF.employee = '';
  const street = h('input', { type: 'search', placeholder: 'Street or site', 'aria-label': 'Street' });
  const stSel = h('select', { 'aria-label': 'Status' }, [['', 'All shifts'], ['active', 'On the clock'], ['review', 'Needs review'], ['corrected', 'Corrected'],
    ['manual', 'Manual / unverified site'], ['open', 'Draft (not submitted)'], ['submitted', 'Submitted'], ['under_review', 'Under review'], ['returned', 'Returned'], ['approved', 'Approved']]
    .map(([v, l]) => h('option', { value: v }, l)));
  const out = h('div', { class: 'stack' });
  const corrBox = h('div');
  let rows = [];
  async function loadAll() {
    put(out, h('div', { class: 'spinner' }));
    let q = S.sb.from('shift_details').select('*').gte('work_date', st.from).lte('work_date', st.to);
    if (empSel.value) q = q.eq('employee_id', empSel.value);
    if (street.value.trim()) q = q.ilike('worksite_label', `%${street.value.trim()}%`);
    const sv = stSel.value;
    if (sv === 'active') q = q.eq('is_active', true);
    else if (sv === 'review') q = q.eq('needs_review', true);
    else if (sv === 'corrected') q = q.gt('revision_count', 0);
    else if (sv === 'manual') q = q.neq('clock_in_method', 'device');
    else if (sv === 'open') q = q.eq('group_status', 'open');
    else if (sv) q = q.eq('report_status', sv);
    rows = await db(q.order('clock_in_at', { ascending: false }).limit(2000));
    const total = rows.filter((r) => !r.is_active).reduce((a, r) => a + Number(r.net_minutes), 0);
    put(out, h('div', { class: 'stat-grid three' }, stat('Shifts', String(rows.length)), stat('Net hours', minutesText(total), `${hoursDec(total)} h`),
      stat('Employees', String(new Set(rows.map((r) => r.employee_id)).size))),
      rows.length ? h('div', { class: 'list' }, rows.map((r) => shiftRow(r, { admin: true }))) : empty('No shifts match these filters.'));

    put(corrBox, corr.length ? card({ class: 'attn-card' }, cardHead(`Correction requests (${corr.length})`, 'Kept as separate records. Fix the shift (with a reason), then resolve the request.'),
      h('div', { class: 'list' }, corr.map((c) => h('div', { class: 'rev' },
        h('div', { class: 'row' }, h('strong', {}, names[c.employee_id] || 'Employee'), h('span', { class: 'spacer' }), h('span', { class: 'muted small' }, fmtDateTime(c.created_at))),
        h('div', { class: 'pre' }, c.message),
        c.proposed_clock_in_at || c.proposed_clock_out_at || c.proposed_lunch_minutes !== null
          ? h('div', { class: 'muted small' }, `Proposed: ${c.proposed_clock_in_at ? `in ${fmtDateTime(c.proposed_clock_in_at)}` : ''} ${c.proposed_clock_out_at ? `out ${fmtDateTime(c.proposed_clock_out_at)}` : ''} ${c.proposed_lunch_minutes !== null ? `lunch ${c.proposed_lunch_minutes} min` : ''}`) : null,

function adminReportActions(r, sheet) {
  const after = () => { sheet.close(); };
  const b = [];
  if (r.status === 'submitted') b.push(h('button', { class: 'btn', onclick: async () => {
    if (await act(null, () => rpc('admin_review_report', { p_report_id: r.id, p_action: 'under_review' }), 'Marked under review') !== undefined) after();
  } }, 'Mark under review'));
  if (['submitted', 'under_review'].includes(r.status)) b.push(h('button', { class: 'btn btn-primary', onclick: async () => {
    const est = Number(r.current_estimated_amount);
    const v = await formSheet({ title: 'Approve report', confirm: 'Approve',
      notice: kv([['Net hours now', minutesText(r.current_net_minutes)], ['Calculated amount', money(est)],
        r.changed_after_submission ? ['Note', 'Hours were changed after submission'] : null]),
      fields: [{ name: 'amount', label: `Approved amount (${r.currency_code})`, type: 'number', step: '0.01', min: 0, value: est.toFixed(2), required: true },
               { name: 'note', label: 'Note (required if you change the amount)', type: 'textarea', rows: 2, max: 2000 }] });
    if (v && await act(null, () => rpc('admin_review_report', { p_report_id: r.id, p_action: 'approve', p_note: v.note || null,
      p_approved_amount: Number(v.amount) === Number(est.toFixed(2)) ? null : Number(v.amount) }), 'Report approved') !== undefined) after();
  } }, 'Approve'));
  if (['submitted', 'under_review', 'approved'].includes(r.status) && Number(r.amount_paid) === 0) b.push(h('button', { class: 'btn', onclick: async () => {
    const v = await formSheet({ title: 'Return for review', confirm: 'Return report', danger: true, text: 'The employee sees your note and can resubmit. Their hours stay locked; corrections go through you.',
      fields: [{ name: 'note', label: 'What needs to change?', type: 'textarea', required: true, max: 2000 }] });
    if (v && await act(null, () => rpc('admin_review_report', { p_report_id: r.id, p_action: 'return', p_note: v.note }), 'Report returned') !== undefined) after();
  } }, 'Return'));
  b.push(r.flagged
    ? h('button', { class: 'btn btn-ghost', onclick: async () => { if (await act(null, () => rpc('admin_review_report', { p_report_id: r.id, p_action: 'unflag' }), 'Flag removed') !== undefined) after(); } }, 'Remove flag')
    : h('button', { class: 'btn btn-ghost', onclick: async () => {
      const v = await formSheet({ title: 'Flag report', confirm: 'Flag', fields: [{ name: 'note', label: 'Why?', type: 'textarea', required: true }] });
      if (v && await act(null, () => rpc('admin_review_report', { p_report_id: r.id, p_action: 'flag', p_note: v.note }), 'Flagged') !== undefined) after();
    } }, 'Flag'));
  if (r.status === 'approved' && Number(r.outstanding_amount) > 0) b.push(h('button', { class: 'btn btn-primary', onclick: () => { sheet.close(); paymentSheet(r); } }, 'Record payment'));
  b.push(h('button', { class: 'btn btn-ghost', onclick: async () => {
    const g = (await db(S.sb.from('group_summaries').select('*').eq('work_group_id', r.work_group_id)))[0];
    groupShiftsSheet(g, true);
  } }, 'Current shifts'));
  return b;
}

PAGES['admin/audit'] = async () => {
  const emps = await employeeList();
  const names = Object.fromEntries(emps.map((e) => [e.employee_id, e.display_name || e.full_name]));
  const tables = ['', 'shifts', 'shift_revisions', 'reports', 'payments', 'wage_rates', 'employees', 'employee_access', 'employee_google_accounts',
    'notes', 'correction_requests', 'work_groups', 'worksites', 'company_settings', 'restore_runs', 'access_requests'];
  const tSel = h('select', { 'aria-label': 'Table' }, tables.map((t) => h('option', { value: t }, t ? t.replace(/_/g, ' ') : 'All records')));
  const actor = h('select', { 'aria-label': 'Who' }, empOptions(emps, 'Anyone'));
  const action = h('input', { type: 'search', placeholder: 'Action contains…' });
  const out = h('div', { class: 'list' });
  let page = 0;
  const more = h('button', { class: 'btn', onclick: () => { page++; load(true); } }, 'Load older');
  async function load(append = false) {
    if (!append) { page = 0; put(out, h('div', { class: 'spinner' })); }
    let q = S.sb.from('audit_log').select('*');
    if (tSel.value) q = q.eq('target_table', tSel.value);
    if (actor.value) q = q.eq('actor_employee_id', actor.value);
    if (action.value.trim()) q = q.ilike('action', `%${action.value.trim()}%`);
    const rows = await db(q.order('id', { ascending: false }).range(page * 100, page * 100 + 99));
    if (!append) put(out, );
    rows.forEach((l) => {
      const changed = l.operation === 'UPDATE' ? Object.keys(l.new_data || {}).filter((k) => JSON.stringify(l.old_data?.[k]) !== JSON.stringify(l.new_data?.[k]) && k !== 'updated_at') : [];
      const det = h('pre', { class: 'audit-json', hidden: true }, JSON.stringify(l.operation === 'UPDATE'
        ? Object.fromEntries(changed.map((k) => [k, { from: l.old_data[k], to: l.new_data[k] }])) : (l.new_data || l.old_data), null, 2));
      add(out, h('button', { class: 'row-item', type: 'button', onclick: () => { det.hidden = !det.hidden; } },
        h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, `${l.action.replace(/_/g, ' ')}`),
          h('div', { class: 'row-sub' }, `${fmtDateTime(l.occurred_at)}, ${l.actor_kind === 'database' ? 'project owner (database)' : names[l.actor_employee_id] || (l.action === 'access_request' ? 'unapproved user' : '—')}, ${l.target_table} ${l.operation.toLowerCase()}${changed.length ? `: ${changed.join(', ')}` : ''}`),
          det)));
    });
    more.hidden = rows.length < 100;
  }
  [tSel, actor].forEach((x) => x.addEventListener('change', () => load()));
  let t; action.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => load(), 350); });
  load();
  return [pageHead('Audit log', 'Every change to the records, who made it and when. This log can’t be edited or deleted — not even by you. Tap an entry for details.'),
    h('div', { class: 'filters' }, tSel, actor, action), out, more];
};

PAGES['admin/settings'] = async () => {

  if (!zones.includes(cs.time_zone)) zones.unshift(cs.time_zone);

  const field = (key, label, type = 'text', opts = {}) => {
    let el;
    if (type === 'select') el = h('select', {}, opts.options.map(([v, l]) => h('option', { value: String(v) }, l)));
    else if (type === 'checkbox') el = h('input', { type: 'checkbox' });
    else el = h('input', { type, step: opts.step || null, min: opts.min ?? null, max: opts.max ?? null, maxlength: opts.maxlength || null, inputmode: opts.inputmode || null });
    const v = cs[key];
    if (type === 'checkbox') el.checked = !!v; else el.value = v === null || v === undefined ? '' : String(v);
    F[key] = { el, type, nullable: !!opts.nullable };
    if (type === 'checkbox') return h('label', { class: 'check-row' }, el, h('span', {}, label));
    return h('label', { class: 'field' }, h('span', {}, label), el, opts.help ? h('small', { class: 'muted' }, opts.help) : null);

        field('contact_phone', 'Contact phone', 'tel'), field('company_address', 'Business address', 'text', { maxlength: 300 })),
      section('Time and format', 'Official times are stored exactly and shown in this time zone',
        field('time_zone', 'Company time zone', 'select', { options: zones.map((z) => [z, z.replace(/_/g, ' ')]) }),
        field('date_format', 'Date format', 'select', { options: [['MMM d, yyyy', 'Oct 18, 2026'], ['yyyy-MM-dd', '2026-10-18'], ['dd/MM/yyyy', '18/10/2026'], ['MM/dd/yyyy', '10/18/2026']] }),
        field('time_format', 'Time format', 'select', { options: [['12h', '12-hour (4:30 PM)'], ['24h', '24-hour (16:30)']] }),
        field('week_starts_on', 'Week starts on', 'select', { options: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map((d, i) => [i, d]) }))),
    h('div', { class: 'grid-2' },

// ---------------------------------------------------------------- printable documents ("Save as PDF")
function printDoc(title, subtitle, ...nodes) {
  const root = document.getElementById('print-root');
  const cs = S.settings || {};
  const close = () => { document.body.classList.remove('printing'); put(root, ); window.removeEventListener('afterprint', close); };
  put(root, 
    h('div', { class: 'print-bar no-print' },
      h('span', { class: 'strong' }, title), h('span', { class: 'spacer' }),
      h('button', { class: 'btn btn-primary', onclick: () => window.print() }, icon('download'), 'Print / Save as PDF'),
      h('button', { class: 'btn', onclick: close }, 'Close')),
    h('article', { class: 'print-doc' },
      h('header', { class: 'pd-head' },
        h('div', {}, h('div', { class: 'pd-company' }, cs.company_name || ''),
          h('div', { class: 'pd-small' }, [cs.company_address, cs.contact_phone, cs.contact_email].filter(Boolean).join('  |  '))),
        h('div', { class: 'pd-right' }, h('div', { class: 'pd-title' }, title), subtitle ? h('div', { class: 'pd-small' }, subtitle) : null)),
      ...nodes,
      h('footer', { class: 'pd-foot' },
        `Generated ${fmtDateTime(new Date().toISOString())}. Times in ${tz()}. Amounts in ${cs.currency_code}. `,
        'Estimated amounts are net hours × hourly rate and are not official payroll results.')));
  document.body.classList.add('printing');
  window.addEventListener('afterprint', close);
  setTimeout(() => { try { window.print(); } catch { /* user can tap the button */ } }, 120);
}
const pdTable = (head, rows, foot) => h('table', { class: 'pd-table' },
  h('thead', {}, h('tr', {}, head.map((x) => h('th', {}, x)))),
  h('tbody', {}, rows.map((r) => h('tr', {}, r.map((c) => h('td', {}, c ?? ''))))),
  foot ? h('tfoot', {}, h('tr', {}, foot.map((c) => h('td', {}, c ?? '')))) : null);
const pdSection = (title, ...kids) => h('section', { class: 'pd-section' }, title ? h('h3', {}, title) : null, ...kids);
const pdKV = (rows) => h('dl', { class: 'pd-kv' }, rows.filter(Boolean).map(([k, v]) => [h('dt', {}, k), h('dd', {}, v ?? '—')]));

  printDoc('Submitted hours report', `${snap.employee.full_name}, ${snap.worksite.label}`,
    pdKV([['Employee', `${snap.employee.full_name} (#${snap.employee.employee_number})`], ['Email', snap.employee.email],
      ['Worksite', `${snap.worksite.label}${snap.worksite.source === 'employee_manual' ? ' (manual, unverified)' : ''}`],
      ['Work group', `Cycle ${snap.work_group.cycle_number}`], ['Period', `${fmtYMD(snap.period.start)} – ${fmtYMD(snap.period.end)}`],
      ['Submitted', `${fmtDateTime(snap.submitted_at)} (version ${snap.version})`], ['Report status', STATUS_LABEL[r.status]],
      ['Payment status', r.status === 'approved' ? STATUS_LABEL[r.payment_status] : '—'], ['Report ID', r.id]]),
    pdSection('Shifts', pdTable(['Date', 'Clock in', 'Clock out', 'Lunch', 'Net hours', 'Rate', 'Estimate'],
      snap.shifts.map((x) => [fmtYMD(x.work_date), fmtTime(x.clock_in_at), fmtTime(x.clock_out_at), `${x.lunch_minutes} min`, hoursDec(x.net_minutes),
        x.hourly_rate ? money(x.hourly_rate) : '—', x.estimated_amount !== null ? money(x.estimated_amount) : '—']),
      ['Total', '', '', `${snap.totals.lunch_minutes} min`, hoursDec(snap.totals.net_minutes), '', money(snap.totals.estimated_amount)])),
    r.approved_amount !== null ? pdSection('Approval', pdKV([['Approved hours', hoursDec(r.approved_net_minutes)], ['Approved amount', money(r.approved_amount)],
      ['Approved on', fmtDateTime(r.approved_at)], ['Paid to date', money(r.amount_paid)], ['Outstanding', money(r.outstanding_amount)]])) : null,
    pays?.length ? pdSection('Payments', pdTable(['Date', 'Amount', 'Method', 'Reference', 'Status'],
      pays.map((p) => [fmtYMD(p.paid_on), money(p.amount), p.method || '', p.reference || '', p.voided_at ? `Voided: ${p.void_reason}` : 'Paid']))) : null,
    snap.notes?.length ? pdSection('Notes', ...snap.notes.map((n) => h('p', {}, h('strong', {}, `${n.title}: `), n.body))) : null,
    snap.employee_note ? pdSection('Employee note', h('p', {}, snap.employee_note)) : null,
    r.changed_after_submission ? h('p', { class: 'pd-warn' }, 'Hours were corrected after this report was submitted. The submitted snapshot above is unchanged; see the audit history for corrections.') : null,
    pdSection(null, h('div', { class: 'pd-sign' }, h('div', {}, 'Employee signature'), h('div', {}, 'Approved by'))));
  rpc('log_export', { p_export_type: S.mode === 'admin' ? 'report_pdf' : 'my_report_pdf', p_format: 'pdf', p_filters: { report_id: r.id }, p_row_count: snap.shifts.length }).catch(() => {});
}

// ---------------------------------------------------------------- data loading for exports
async function shiftsFor({ from, to, employee = '', site = '' }) {
  let q = S.sb.from('shift_details').select('*').eq('is_active', false).gte('work_date', from).lte('work_date', to);
  if (employee) q = q.eq('employee_id', employee);
  if (site) q = q.ilike('worksite_label', `%${site}%`);
  return db(q.order('employee_number').order('clock_in_at').limit(20000));
}
const SHIFT_COLS = [
  ['shift_id', 'shift_id'], ['employee_number', 'employee_number'], ['employee_id', 'employee_id'], ['employee_name', 'full_name'],
  ['work_date', 'work_date'], ['worksite', 'worksite_label'], ['worksite_source', 'worksite_source'], ['clock_in_method', 'clock_in_method'],
  ['clock_in_utc', 'clock_in_at'], ['clock_out_utc', 'clock_out_at'],
  ['clock_in_local', (r) => toLocalInput(r.clock_in_at).replace('T', ' ')], ['clock_out_local', (r) => toLocalInput(r.clock_out_at).replace('T', ' ')],
  ['gross_minutes', 'gross_minutes'], ['lunch_minutes', 'lunch_minutes'], ['net_minutes', 'net_minutes'], ['net_hours', (r) => hoursDec(r.net_minutes)],
  ['hourly_rate', 'hourly_rate'], ['estimated_amount', 'estimated_amount'], ['currency', 'currency_code'],
  ['work_group_id', 'work_group_id'], ['cycle_number', 'cycle_number'], ['report_id', 'report_id'], ['report_status', 'report_status'],
  ['payment_status', 'payment_status'], ['corrections', 'revision_count'], ['source', 'source'], ['needs_review', 'needs_review'], ['time_zone', 'time_zone'],
];

function dailyBySite(rows) {
  const m = new Map();
  for (const r of rows) {
    const k = `${r.employee_id}|${r.work_date}|${r.worksite_id}`;
    if (!m.has(k)) m.set(k, { employee_number: r.employee_number, employee_id: r.employee_id, employee_name: r.full_name, work_date: r.work_date,
      worksite: r.worksite_label, worksite_source: r.worksite_source, shift_count: 0, first: r.clock_in_at, last: r.clock_out_at, gross: 0, lunch: 0, net: 0, shift_ids: [] });
    const x = m.get(k);
    x.shift_count++; x.gross += Number(r.gross_minutes); x.lunch += Number(r.lunch_minutes); x.net += Number(r.net_minutes); x.shift_ids.push(r.shift_id);
    if (r.clock_in_at < x.first) x.first = r.clock_in_at;
    if (r.clock_out_at > x.last) x.last = r.clock_out_at;
  }
  return [...m.values()];
}

async function reportsFor({ from, to, employee = '', status = '' }) {
  let q = S.sb.from('report_details').select('*').lte('period_start', to).gte('period_end', from);
  if (employee) q = q.eq('employee_id', employee);
  if (status === 'balances') q = q.eq('status', 'approved').in('payment_status', ['unpaid', 'partially_paid']);
  else if (status) q = q.eq('status', status);
  return db(q.order('employee_number').order('period_start').limit(20000));
}

async function runExport(type, format, f) {
  const cs = S.settings, name = (x) => `${(cs.company_name || 'company').replace(/[^\w]+/g, '-').toLowerCase()}_${x}_${f.from}_to_${f.to}`;
  let rows = 0;
  const range = `${fmtYMD(f.from)} – ${fmtYMD(f.to)}`;
  const empName = f.employee ? (f.employeeName || '') : 'All employees';

  if (type === 'timesheet') {
    const data = await shiftsFor(f); rows = data.length;
    if (format === 'csv') downloadFile(`${name('timesheet')}.csv`, toCSV(SHIFT_COLS, data), 'text/csv');
    else {
      const byEmp = new Map(); data.forEach((r) => { if (!byEmp.has(r.employee_id)) byEmp.set(r.employee_id, []); byEmp.get(r.employee_id).push(r); });
      printDoc('Employee timesheet', range, ...[...byEmp.values()].map((list) => pdSection(`${list[0].full_name} (#${list[0].employee_number})`,
        pdTable(['Date', 'Worksite', 'In', 'Out', 'Lunch', 'Net h', 'Rate', 'Estimate'],
          list.map((r) => [`${weekday(r.work_date)} ${fmtYMD(r.work_date)}`, r.worksite_label + (r.clock_in_method === 'manual' ? ' *' : ''), fmtTime(r.clock_in_at), fmtTime(r.clock_out_at),
            `${r.lunch_minutes}m`, hoursDec(r.net_minutes), r.hourly_rate ? money(r.hourly_rate) : '—', r.estimated_amount ? money(r.estimated_amount) : '—']),
          ['Total', '', '', '', `${list.reduce((a, r) => a + Number(r.lunch_minutes), 0)}m`, hoursDec(list.reduce((a, r) => a + Number(r.net_minutes), 0)), '',
            money(list.reduce((a, r) => a + Number(r.estimated_amount || 0), 0))]),
        h('p', { class: 'pd-small' }, '* manually selected worksite (unverified)'),
        h('div', { class: 'pd-sign' }, h('div', {}, 'Employee signature'), h('div', {}, 'Supervisor signature')))),
        data.length ? null : h('p', {}, 'No shifts in this range.'));
    }
  } else if (type === 'daily_site') {
    const data = dailyBySite(await shiftsFor(f)); rows = data.length;
    const cols = [['employee_number', 'employee_number'], ['employee_id', 'employee_id'], ['employee_name', 'employee_name'], ['work_date', 'work_date'],
      ['worksite', 'worksite'], ['worksite_source', 'worksite_source'], ['shift_count', 'shift_count'], ['first_clock_in_local', (r) => toLocalInput(r.first).replace('T', ' ')],
      ['last_clock_out_local', (r) => toLocalInput(r.last).replace('T', ' ')], ['gross_minutes', (r) => r.gross.toFixed(2)], ['lunch_minutes', 'lunch'],
      ['net_minutes', (r) => r.net.toFixed(2)], ['net_hours', (r) => hoursDec(r.net)], ['shift_ids', (r) => r.shift_ids.join(' ')], ['time_zone', () => tz()]];
    if (format === 'csv') downloadFile(`${name('daily_hours_by_site')}.csv`, toCSV(cols, data), 'text/csv');
    else printDoc('Daily hours by employee and worksite', `${range}. ${empName}`, pdTable(['Date', 'Employee', 'Worksite', 'Shifts', 'First in', 'Last out', 'Lunch', 'Net h'],
      data.map((r) => [fmtYMD(r.work_date), r.employee_name, r.worksite, r.shift_count, fmtTime(r.first), fmtTime(r.last), `${r.lunch}m`, hoursDec(r.net)]),
      ['Total', '', '', data.reduce((a, r) => a + r.shift_count, 0), '', '', '', hoursDec(data.reduce((a, r) => a + r.net, 0))]));
  } else if (type === 'daily_all' || type === 'pay_period') {
    const data = await rpc('daily_hours', { p_from: f.from, p_to: f.to, p_employee_id: f.employee || null }); rows = data.length;
    const otNote = cs.overtime_enabled ? `Overtime estimated: after ${cs.daily_ot_after_hours} h/day (×${cs.ot_multiplier}), after ${cs.daily_dt_after_hours} h/day (×${cs.dt_multiplier}), after ${cs.weekly_ot_after_hours} regular h/week (×${cs.ot_multiplier}).`
      : 'Overtime not estimated (turned off in settings); all hours shown as regular.';
    if (type === 'daily_all') {
      const cols = [['employee_number', 'employee_number'], ['employee_id', 'employee_id'], ['employee_name', 'full_name'], ['work_date', 'work_date'], ['week_start', 'week_start'],
        ['shift_count', 'shift_count'], ['worksites', 'worksites'], ['first_clock_in_local', (r) => toLocalInput(r.first_clock_in).replace('T', ' ')],
        ['last_clock_out_local', (r) => toLocalInput(r.last_clock_out).replace('T', ' ')], ['lunch_minutes', 'lunch_minutes'], ['net_minutes', 'net_minutes'],
        ['regular_minutes', 'regular_minutes'], ['overtime_minutes', 'overtime_minutes'], ['double_time_minutes', 'double_time_minutes'], ['hourly_rate', 'hourly_rate'],
        ['estimated_amount', 'estimated_amount'], ['rate_missing', 'missing_rate'], ['currency', () => cs.currency_code], ['time_zone', () => tz()], ['overtime_rule', () => otNote]];
      if (format === 'csv') downloadFile(`${name('daily_hours_all')}.csv`, toCSV(cols, data), 'text/csv');
      else printDoc('Daily hours summary', `${range}. ${empName}`, h('p', { class: 'pd-small' }, otNote),

// ---------------------------------------------------------------- backup function calls
async function backupFn(body) {
  const { data, error } = await S.sb.functions.invoke(BACKUP_FUNCTION, { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch { /* ignore */ }
    if (/Failed to send|fetch/i.test(msg)) msg = 'Couldn’t reach the backup service. Is the drive-backup function deployed? (See Setup below.)';
    throw new Error(msg);
  }
  return data;
}

function restoreSummaryTable(res) {
  const rows = Object.entries(res.tables).filter(([, t]) => t.in_file > 0);
  const restoring = res.mode === 'restored';
  return h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
    h('thead', {}, h('tr', {}, ['Records', 'In file', 'Already here', restoring ? 'Added' : 'Would add', 'Kept current version', 'Not restored'].map((x) => h('th', {}, x)))),
    h('tbody', {}, rows.map(([k, t]) => h('tr', {}, h('td', {}, k.replace(/_/g, ' ')), h('td', {}, t.in_file), h('td', {}, t.already_present),
      h('td', {}, t.added), h('td', {}, t.present_but_different_kept_current), h('td', { title: (t.errors || []).join('\n') }, t.not_restored || ''))))));
}

async function restoreFlow(text, source, fileName) {
  const sheet = openSheet({ title: 'Restore from backup', wide: true, onClose: () => route() });
  add(sheet.body, h('div', { class: 'center-block' }, h('div', { class: 'spinner' }), h('p', {}, 'Checking the backup…')));
  let v;
  try { v = await rpc('admin_validate_backup', { p_backup: text }); }
  catch (e) { put(sheet.body, h('div', { class: 'notice bad' }, `This backup can’t be used: ${e.message}`), h('p', { class: 'muted' }, 'Nothing was changed.')); return; }
  const toAdd = Object.values(v.tables).reduce((a, t) => a + t.added, 0);
  const confirm = h('input', { type: 'text', placeholder: 'Type RESTORE', autocapitalize: 'characters', 'aria-label': 'Type RESTORE to confirm' });
  const btn = h('button', { class: 'btn btn-danger-solid', onclick: async () => {
    if (confirm.value.trim() !== 'RESTORE') return toast('Type RESTORE to confirm.', 'bad');
    btn.disabled = true;
    try {
      const r = await rpc('admin_restore_backup', { p_backup: text, p_confirm: 'RESTORE', p_source: source, p_file_name: fileName || null });
      put(sheet.body, h('div', { class: 'notice ok' }, `Restore finished: ${Object.values(r.tables).reduce((a, t) => a + t.added, 0)} missing records added. Nothing existing was changed.`), restoreSummaryTable(r));
    } catch (e) { btn.disabled = false; toast(`Restore failed — nothing was changed. ${e.message}`, 'bad'); }
  } }, 'Restore missing records');
  put(sheet.body, 
    h('div', { class: 'notice ok' }, `Backup is valid (checksum verified). Created ${fmtDateTime(v.backup_created_at)}.`),
    h('div', { class: 'notice info' }, 'Restoring only ADDS records that are missing. Records that already exist are never overwritten or deleted, so newer data always wins. A restore can’t create duplicates.'),
    restoreSummaryTable(v),
    toAdd === 0 ? h('p', { class: 'strong' }, 'Everything in this backup is already here. There is nothing to restore.')
      : h('div', { class: 'stack' }, h('label', { class: 'field' }, h('span', {}, `To add ${toAdd} missing record${toAdd === 1 ? '' : 's'}, type RESTORE`), confirm), h('div', { class: 'sheet-actions' }, btn)));
}

      ? 'Google Drive connected. A folder named “Employee Time Tracker Backups” was created in your Drive.' : `Google Drive was not connected: ${flash.reason || 'cancelled'}`) : null,
    st.drive_connected
      ? kv([['Google account', st.drive_account_email || '—'], ['Folder', 'Employee Time Tracker Backups (private to that account)'],
            ['Last successful backup', last ? `${fmtDateTime(last.finished_at)}, ${(Number(last.size_bytes) / 1024).toFixed(1)} KB, verified` : 'None yet'],
            ['Last attempt', st.last_run ? `${fmtDateTime(st.last_run.started_at)}: ${st.last_run.status}${st.last_run.error ? ` — ${st.last_run.error}` : ''}` : '—'],
            ['Changes since last backup', String(st.pending_changes)],
            ['Automatic backups', S.settings.backups_enabled ? `On: after changes (at most every ${S.settings.backup_after_change_minutes} min) and daily after ${String(S.settings.backup_daily_hour).padStart(2, '0')}:00` : 'Off (Admin settings)']])
      : h('div', { class: 'notice warn' }, 'Not connected. Connect the Google account whose Drive should hold the backups. Employees never need access to it.'),
    st.last_run?.status === 'failed' ? h('div', { class: 'notice bad' }, `The last backup failed: ${st.last_run.error}`) : null,
    h('div', { class: 'row gap-sm wrap-row' }, connectBtn, nowBtn, listBtn, disconnectBtn), filesBox);

  const fileIn = h('input', { type: 'file', accept: '.json,application/json' });
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; if (!f) return;
    if (f.size > 50 * 1024 * 1024) return toast('That file is too large to be a backup from this app.', 'bad');
    restoreFlow(await f.text(), 'upload', f.name);
    fileIn.value = '';
  });

  return [
    pageHead('Data & backups'),
    card({}, cardHead('Google Drive backups', 'Timestamped, versioned copies of all records. Each upload is read back and checked before it counts as a success.'), drive),
    h('div', { class: 'grid-2' },
      card({}, cardHead('Export records', 'CSV, printable PDF, or a complete JSON backup'),
        h('div', { class: 'stack' },
          h('button', { class: 'btn btn-primary', onclick: () => adminExportSheet() }, icon('download'), 'Export CSV or PDF…'),
          h('button', { class: 'btn', onclick: (e) => act(e.currentTarget, async () => {
            const text = await rpc('admin_export_backup');
            downloadFile(`employee-time-tracker-backup_${stamp()}.json`, text, 'application/json');
            await rpc('log_export', { p_export_type: 'full_backup', p_format: 'json', p_filters: {}, p_row_count: null });
          }, 'Complete JSON backup downloaded') }, icon('download'), 'Complete JSON backup'))),
      card({}, cardHead('Restore from a file', 'Use a JSON backup from this app'),
        h('label', { class: 'field' }, h('span', {}, 'Choose backup file'), fileIn),
        h('p', { class: 'muted small' }, 'The file is checked first (format and checksum). You’ll see exactly what would be added before anything changes.'))),
    card({}, cardHead('British Columbia record keeping'),
      h('div', { class: 'stack small' },
        h('p', {}, `Records are kept for at least ${S.settings.retention_years} years and are never deleted automatically — including when an employee is deactivated. Official shifts, reports, payments, rates, notes and the audit log can’t be deleted, even by an administrator.`),
        h('p', {}, h('strong', {}, 'Recorded by this app: '), 'employee names and IDs, job title, start/end dates, phone, address, date of birth (optional), daily clock-in/out times, lunch deductions, net hours, worksites, wage rates with effective dates, estimated regular/overtime hours (if you configure overtime), approved amounts, actual payments with dates and references, corrections and full audit history.'),
        h('p', {}, h('strong', {}, 'Not recorded — keep in your payroll system: '), 'deductions and their reasons, net wages, vacation pay and entitlement, statutory holiday pay, time banks, allowances, and official wage statements.'),
        h('p', { class: 'muted' }, 'Exports support your record keeping but don’t make the business automatically compliant. Check current BC Employment Standards requirements (and with your accountant) for overtime, wage statements and payroll.'))),
    h('div', { class: 'grid-2' },
      card({}, cardHead('Backup history'), runs.length ? h('div', { class: 'list' }, runs.map((b) => h('div', { class: 'rev' },
        h('div', { class: 'row' }, chip(b.status === 'succeeded' ? 'approved' : b.status === 'failed' ? 'disabled' : 'open', b.status), h('span', { class: 'spacer' }), h('span', { class: 'muted small' }, fmtDateTime(b.started_at))),
        h('div', { class: 'small' }, `${{ manual: 'Manual', auto_change: 'After changes', scheduled: 'Daily' }[b.trigger]}${b.file_name ? `: ${b.file_name}` : ''}`),
        b.error ? h('div', { class: 'small muted' }, b.error) : null))) : empty('No backups yet.')),
      card({}, cardHead('Export and restore history'), h('div', { class: 'list' },
        restores.map((r) => h('div', { class: 'rev' }, h('strong', {}, 'Restore'), ` ${fmtDateTime(r.restored_at)} by ${names[r.restored_by] || '—'} from ${r.source === 'google_drive' ? 'Google Drive' : 'file'}`)),
        exportsLog.map((x) => h('div', { class: 'rev small' }, `${fmtDateTime(x.exported_at)}: ${x.export_type.replace(/_/g, ' ')} (${x.format.toUpperCase()})${x.row_count !== null ? `, ${x.row_count} rows` : ''} by ${names[x.exported_by] || '—'}`)),
        !restores.length && !exportsLog.length ? empty('Nothing exported yet.') : null))),
    card({}, cardHead('Setup and server code', 'The database scripts and the backup function, ready to copy into Supabase'), setupCodeBlocks()),
  ];
};

// =====================================================================
//  Setup guide, server code to copy, live permission check
// =====================================================================
const CODE = [
  ['sql-foundation', 'Database step A — secure foundation (Part 1)', 'Run once. Skip if you already ran Part 1.'],
  ['sql-part2', 'Database step B — Part 2 upgrade', 'Run once, after step A.'],
  ['sql-admin', 'Make yourself the first administrator', 'Edit the two values, then run once.'],
  ['fn-drive-backup', 'Backup function (drive-backup)', 'Paste into a new Supabase Edge Function named drive-backup.'],
  ['sql-schedule', 'Automatic backup schedule', 'Run after Google Drive is connected.'],
];
const codeText = (id) => document.getElementById(id)?.textContent.replace(/^\n/, '') || '';

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
  }
  if (btn) { const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = old; }, 1800); }
}

function setupCodeBlocks() {
  return h('div', { class: 'code-list' }, CODE.map(([id, title, sub]) => {
    const text = codeText(id);
    const pre = h('pre', { class: 'code', hidden: true }, text);
    return h('div', { class: 'code-item' },
      h('div', { class: 'code-head' }, h('div', {}, h('div', { class: 'strong' }, title), h('div', { class: 'muted small' }, `${sub} ${Math.round(text.length / 1024)} KB.`)),
        h('div', { class: 'row gap-sm' },
          h('button', { class: 'btn btn-sm btn-primary', onclick: (e) => copyText(text, e.currentTarget) }, 'Copy'),
          h('button', { class: 'btn btn-sm btn-ghost', onclick: () => { pre.hidden = !pre.hidden; } }, 'View'))),
      pre);
  }));
}

const step = (title, ...kids) => h('li', { class: 'setup-step' }, h('h3', {}, title), ...kids);
const p = (...k) => h('p', {}, ...k);
const code = (t) => h('code', {}, t);
const bullet = (...items) => h('ul', {}, items.map((i) => h('li', {}, i)));

        h('span', {}, 'Supabase → Authentication → URL Configuration: Site URL and Redirect URL = your site address, e.g. ', code('https://YOURNAME.github.io/employee-timeclock/'), '.'))),
    step('Put your two values in this file and publish it',

        h('span', {}, 'Edge Functions → Secrets → add ', code('GOOGLE_CLIENT_ID'), ' and ', code('GOOGLE_CLIENT_SECRET'), ' (the same Google client as sign-in). Type the secret only into Supabase — never into this file or a chat.'),
        'In this app: Data & backups → Connect Google Drive → choose your Google account → Allow. A folder named “Employee Time Tracker Backups” appears in your Drive.',
        'SQL Editor → run “Automatic backup schedule” below.')),
    step('Check it works',
      bullet('Sign in, run the Permission check in Settings — every line should be ✓.',

function renderSetupScreen(problem) {
  document.title = 'Set up · Time Clock';
  setScreen(h('div', { class: 'setup' },
    h('header', { class: 'setup-head' }, brandMark(48), h('div', {}, h('h1', {}, problem === 'danger' ? 'Unsafe key in this file' : 'Set up your Time Clock'),
      h('p', { class: 'muted' }, 'This one file is the whole app. The steps below connect it to your own Supabase project and Google account.'))),
    problem === 'danger' ? h('div', { class: 'notice bad' }, 'The config block in this file contains a SECRET key. Remove it now, rotate (roll) that key in Supabase → API Keys, and use the publishable key instead. The app will not start with a secret key.') : null,
    card({}, cardHead('Steps'), setupGuide()),
    card({}, cardHead('Code to copy into Supabase'), setupCodeBlocks())));

// ---------------------------------------------------------------- permission check (runs real requests as the signed-in user)
function permissionCheckCard() {
  const out = h('div', { class: 'checks' });
  const btn = h('button', { class: 'btn', onclick: async () => {
    btn.disabled = true; put(out, h('div', { class: 'spinner' }));
    let res;
    try { res = await runPermissionChecks(); } catch (e) { res = [{ title: 'Check could not run', pass: false, detail: friendlyError(e) }]; }
    put(out, ...res.map((r) => h('div', { class: `check ${r.pass ? 'pass' : 'fail'}` }, h('span', { class: 'dot' }, r.pass ? '✓' : '✕'),
      h('div', {}, h('div', {}, r.title), h('div', { class: 'muted small' }, r.detail)))),
    h('p', { class: 'muted small' }, `${res.filter((r) => r.pass).length} of ${res.length} passed, ${new Date().toLocaleString()}`));
    btn.disabled = false;
  } }, icon('shield'), 'Run permission check');
  return card({}, cardHead('Permission check', 'Tries forbidden actions directly against the live database, as you. Every attempt should be refused. Nothing is changed.'), btn, out);
}

async function runPermissionChecks() {
  const R = [], addCheck = (title, pass, detail) => R.push({ title, pass: !!pass, detail });
  const refused = (r) => !!r.error;
  const why = (r) => (r.error ? `Refused: ${r.error.message}` : 'NOT refused');
  const me = S.me.employee_id;
  const anon = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'tc-anon-check' } });
  for (const t of ['employees', 'shifts', 'payments', 'notes']) {
    const r = await anon.from(t).select('*').limit(1);
    addCheck(`Visitors who aren’t signed in can’t read ${t}`, refused(r) || (r.data || []).length === 0, why(r));
  }
  const ra = await anon.rpc('clock_in', { p_request_id: uuid(), p_method: 'manual' });
  addCheck('Visitors who aren’t signed in can’t clock in', refused(ra), why(ra));

  const w = [
    ['You can’t change your own role by editing the table', S.sb.from('employee_access').update({ role: 'admin' }).eq('employee_id', me).select()],
    ['You can’t edit official hours directly', S.sb.from('shifts').update({ lunch_minutes: 0 }).eq('employee_id', me).select()],
    ['You can’t insert a shift directly (bypassing the clock)', S.sb.from('shifts').insert({ employee_id: me, clock_in_method: 'manual' }).select()],
    ['You can’t change your own wage rate', S.sb.from('wage_rates').insert({ employee_id: me, hourly_rate: 999, effective_from: '2000-01-01' }).select()],
    ['You can’t mark a report approved or paid', S.sb.from('reports').update({ status: 'approved', payment_status: 'paid' }).eq('employee_id', me).select()],
    ['You can’t add a payment', S.sb.from('payments').insert({ employee_id: me, amount: 1 }).select()],
    ['You can’t delete audit history', S.sb.from('audit_log').delete().gt('id', 0).select()],
    ['You can’t delete notes', S.sb.from('notes').delete().eq('employee_id', me).select()],
  ];
  for (const [title, q] of w) { const r = await q; addCheck(title, refused(r), why(r)); }
  const r1 = await S.sb.rpc('admin_set_role', { p_employee_id: me, p_role: S.me.role === 'admin' ? 'employee' : 'admin' });
  addCheck('You can’t change your own role through the admin function', refused(r1), why(r1));

  if (S.me.role === 'admin') {
    const rep = await S.sb.rpc('admin_security_report');
    const bad = (rep.data || []).filter((x) => !x.ok);
    addCheck('Every table and view: Row Level Security on, no anonymous access, no browser writes', !rep.error && rep.data?.length && !bad.length,
      rep.error ? rep.error.message : bad.length ? `Problems: ${bad.map((b) => b.table_name).join(', ')}` : `${rep.data.length} checked`);
    const sv = await S.sb.rpc('svc_drive_get_config');
    addCheck('The website can’t read the Google Drive token (server-only function)', refused(sv), why(sv));
  } else {
    for (const t of ['employee_directory', 'shifts', 'notes', 'payments', 'wage_rates', 'reports']) {
      const r = await S.sb.from(t).select('employee_id');
      addCheck(`You see only your own ${t.replace(/_/g, ' ')}`, !r.error && r.data.every((x) => x.employee_id === me), r.error ? r.error.message : `Visible rows: ${r.data.length}, all yours`);
    }
    const al = await S.sb.from('audit_log').select('id').limit(3);
    addCheck('You can’t read the audit log', !al.error && al.data.length === 0, al.error ? al.error.message : `Visible: ${al.data.length}`);
    for (const [fn, args] of [['admin_record_payment', { p_report_id: uuid(), p_amount: 1, p_paid_on: todayYMD(), p_method: null, p_reference: null, p_note: null, p_request_id: uuid() }],
      ['admin_update_shift', { p_shift_id: uuid(), p_clock_in_local: '2026-01-01T08:00', p_clock_out_local: '2026-01-01T09:00', p_lunch_minutes: 0, p_worksite_id: null, p_reason: 'test', p_correction_id: null }],
      ['admin_export_backup', {}]]) {
      const r = await S.sb.rpc(fn, args);
      addCheck(`You can’t run the administrator function ${fn}`, refused(r), why(r));
    }
  }
  const after = await S.sb.rpc('resolve_my_access');
  addCheck('Your role and status are unchanged afterwards', !after.error && after.data.state === 'active' && after.data.role === S.me.role,
    after.error ? after.error.message : `Role ${after.data.role}, ${after.data.state}`);
  return R;
}

// ---------------------------------------------------------------- start
// Permission check lives in Settings (everyone) and Data & backups (admins).
{
  const empSettings = PAGES.settings;
  PAGES.settings = async () => [...(await empSettings()), permissionCheckCard()];
  const data = PAGES['admin/data'];
  PAGES['admin/data'] = async () => { const n = await data(); n.splice(n.length - 1, 0, permissionCheckCard()); return n; };
}
boot().catch((e) => renderProblem(friendlyError(e)));
