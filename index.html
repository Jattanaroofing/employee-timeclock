<style>/* Employee Time Clock — slate job-board design.
   Tokens are grouped here so the look can be aligned with IncAtor in one place. */
:root {
  --slate: #1E2A33;      /* roof slate: ink, clock board */
  --slate-2: #2B3A45;
  --steel: #5B6B78;      /* secondary text */
  --mist: #EEF1F3;       /* page background */
  --surface: #FFFFFF;
  --surface-2: #F6F8F9;
  --line: #DCE2E6;
  --ink: #1E2A33;
  --on: #1E8C5A;         /* on the clock */
  --on-soft: #E3F3EA;
  --signal: #E8A317;     /* needs attention */
  --signal-soft: #FBF1DA;
  --bad: #B4351F;
  --bad-soft: #FBE6E1;
  --info: #2D5F8B;
  --info-soft: #E3EEF7;
  --focus: #2D7FF9;
  --r-hero: 24px; --r-card: 16px; --r-input: 12px;
  --font: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-cond: 'Barlow Condensed', 'Barlow', -apple-system, 'Arial Narrow', sans-serif;
  --shadow: 0 1px 2px rgba(30, 42, 51, .06), 0 6px 18px rgba(30, 42, 51, .05);
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mist: #0F151A; --surface: #172028; --surface-2: #1C2731; --line: #2A3743; --ink: #E7ECEF; --steel: #93A3AF;
    --slate: #0B1116; --slate-2: #16212A; --on-soft: #13281E; --signal-soft: #2C2512; --bad-soft: #301A16; --info-soft: #14222F;
    --info: #8DB8E0; --bad: #F08A73; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mist: #0F151A; --surface: #172028; --surface-2: #1C2731; --line: #2A3743; --ink: #E7ECEF; --steel: #93A3AF;
  --slate: #0B1116; --slate-2: #16212A; --on-soft: #13281E; --signal-soft: #2C2512; --bad-soft: #301A16; --info-soft: #14222F;
  --info: #8DB8E0; --bad: #F08A73; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--mist); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; font-weight: 650; }
h1 { font-size: 28px; letter-spacing: -0.01em; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 0; }
a { color: var(--info); }
.muted { color: var(--steel); }
.small { font-size: 14px; }
.strong { font-weight: 650; }
.wrap { overflow-wrap: anywhere; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.icon { flex: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- layout primitives ---------- */
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.gap-sm { gap: 8px; } .gap { gap: 16px; }
.wrap-row { flex-wrap: wrap; }
.spacer { flex: 1; }
.grid-2, .grid-3 { display: grid; gap: 14px; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: repeat(3, 1fr); } }
.center-screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.center-block, .done-block { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 18px 0; }
.loading-block { display: grid; place-items: center; min-height: 40vh; }
.signin-bg { background: linear-gradient(180deg, var(--slate) 0 38%, var(--mist) 38%); }

/* ---------- cards & text blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-head p { margin-top: 2px; }
.signin-card { width: 100%; max-width: 420px; text-align: center; padding: 32px 24px; }
.signin-card .brand-mark { margin: 0 auto 16px; }
.signin-card h1 { margin-bottom: 6px; }
.attn-card { border-color: var(--signal); }
.page { padding: 20px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)); display: grid; gap: 18px; max-width: 1080px; margin: 0 auto; outline: none; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head p { margin-top: 4px; max-width: 64ch; }
.section-title { font-size: 15px; color: var(--steel); font-weight: 600; margin-top: 4px; }
.greet h1 { font-size: 30px; }
.greet p { margin-top: 2px; }
.empty { padding: 22px; text-align: center; color: var(--steel); border: 1px dashed var(--line); border-radius: 14px; display: grid; gap: 10px; justify-items: center; }
.kv { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 8px 16px; margin: 0; font-size: 15px; }
.kv dt { color: var(--steel); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.notice { border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.notice.info { background: var(--info-soft); color: var(--info); }
.notice.ok { background: var(--on-soft); color: var(--on); }
.notice.warn { background: var(--signal-soft); color: #8A5D00; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
:root[data-theme="dark"] .notice.warn { color: var(--signal); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .notice.warn { color: var(--signal); } }
.disclosure { align-items: center; }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; touch-action: manipulation; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--slate); border-color: var(--slate); color: #fff; }
.btn-primary:hover { background: var(--slate-2); }
:root[data-theme="dark"] .btn-primary { background: #E7ECEF; color: #11181D; border-color: #E7ECEF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { background: #E7ECEF; color: #11181D; border-color: #E7ECEF; } }
.btn-in { background: var(--on); border-color: var(--on); color: #fff; }
.btn-in:hover { background: #197A4E; }
.btn-out { background: var(--signal); border-color: var(--signal); color: #1E2A33; }
.btn-danger { color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn-lg { min-height: 56px; font-size: 18px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn-google { background: #fff; color: #1f1f1f; border-color: #cfd6db; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--steel); }
.field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--steel); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=datetime-local], input[type=search], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r-input); border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink); font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--steel) 50%), linear-gradient(135deg, var(--steel) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { min-height: 90px; resize: vertical; }
input:disabled, textarea:disabled, select:disabled { opacity: .7; }
.check-row { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check-row input { width: 22px; height: 22px; accent-color: var(--slate); flex: none; }
.field-error { color: var(--bad); font-size: 14px; min-height: 1.2em; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters > * { flex: 1 1 160px; width: auto; }
.filter-range { display: grid; gap: 8px; flex: 2 1 260px; }
.filter-range .row input { flex: 1; }

/* ---------- chips & tags ---------- */
.chip, .tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.neutral, .tag { background: var(--surface-2); color: var(--steel); border: 1px solid var(--line); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.ok { background: var(--on-soft); color: var(--on); }
.chip.warn, .tag.warn { background: var(--signal-soft); color: #8A5D00; border-color: transparent; }
.chip.bad, .tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.gold { background: var(--signal-soft); color: #8A5D00; border-color: transparent; }

/* ---------- shell ---------- */
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--slate); color: #fff; flex: none; }
.brand-name { font-weight: 700; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--mist); background: color-mix(in srgb, var(--mist) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-email { font-size: 13px; color: var(--steel); max-width: 46vw; }
.sidebar { display: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; min-height: var(--tabbar-h); font-size: 12px; font-weight: 600; color: var(--steel);
  text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab.active { color: var(--ink); }
.tab.active .icon { color: var(--on); }
.more-list { display: grid; gap: 4px; }
.more-item { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 600;
  background: none; border: 0; text-align: left; cursor: pointer; font-size: 16px; }
.more-item.active, .more-item:hover { background: var(--surface-2); }
.pending-banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 16px 0; padding: 12px 14px; border-radius: 12px;
  background: var(--signal-soft); color: #6B4800; font-size: 15px; }
.mobile-only { display: inline-flex; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
  .sidebar { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 12px; background: var(--surface); border-right: 1px solid var(--line); }
  .side-brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
  .side-nav { display: grid; gap: 2px; overflow-y: auto; }
  .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--steel); font-weight: 600;
    background: none; border: 0; width: 100%; text-align: left; cursor: pointer; font-size: 15px; }
  .nav-link:hover { background: var(--surface-2); color: var(--ink); }
  .nav-link.active { background: var(--mist); color: var(--ink); }
  .nav-link.active .icon { color: var(--on); }
  .nav-link.switch { color: var(--info); }
  .side-foot { margin-top: auto; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
  .who { display: flex; gap: 10px; align-items: center; padding: 8px 12px; min-width: 0; }
  .who-text { min-width: 0; }
  .topbar, .tabbar, .mobile-only { display: none; }
  .page { padding: 28px 32px 48px; }
}

/* ---------- live clock (the one bold element) ---------- */
.hero { position: relative; border-radius: var(--r-hero); padding: 22px 18px 18px; color: #fff; display: grid; gap: 16px; justify-items: center; overflow: hidden;
  background-color: var(--slate);
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 22px 22px; }
.clock { position: relative; width: min(300px, 80vw); aspect-ratio: 1; }
.clock-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.tick { stroke: rgba(255,255,255,.16); stroke-width: 2; stroke-linecap: round; transition: stroke .25s; }
.tick.major { stroke-width: 3.2; stroke: rgba(255,255,255,.3); }
.tick.lit { stroke: rgba(255,255,255,.62); }
.clock.on .tick.lit { stroke: #5FD39A; }
.tick.now { stroke: var(--signal) !important; stroke-width: 4.5; }
.clock-face { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 2px; }
.clock-time { font-family: var(--font-cond); font-weight: 600; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; line-height: 1; display: flex; align-items: baseline; }
.clock-hm { font-size: clamp(54px, 17vw, 76px); letter-spacing: -0.01em; }
.clock-sec { font-size: clamp(22px, 7vw, 30px); color: rgba(255,255,255,.7); margin-left: 2px; min-width: 1.6em; text-align: left; }
.clock-ampm { font-size: 16px; color: rgba(255,255,255,.7); margin-left: 4px; font-family: var(--font); font-weight: 600; }
.clock-date { font-size: 15px; color: rgba(255,255,255,.86); margin-top: 6px; }
.clock-tz { font-size: 12px; color: rgba(255,255,255,.5); }
.hero-status { text-align: center; display: grid; gap: 4px; }
.hero-status-row { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: rgba(255,255,255,.75); }
.hero-status.on .hero-status-row { color: #7DE0AE; }
.hero-site { font-size: 22px; font-weight: 650; }
.hero-meta { color: rgba(255,255,255,.7); font-size: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.hero-meta .sep::before { content: '|'; opacity: .4; }
.hero-elapsed { font-family: var(--font-cond); font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: #5FD39A; box-shadow: 0 0 0 0 rgba(95,211,154,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(95,211,154,0); } 100% { box-shadow: 0 0 0 0 rgba(95,211,154,0); } }
.btn-clock { width: 100%; max-width: 420px; min-height: 64px; border-radius: 18px; border: 0; display: inline-flex; align-items: center; justify-content: center;
  gap: 10px; font-size: 21px; font-weight: 700; cursor: pointer; touch-action: manipulation; transition: transform .08s; }
.btn-clock:active { transform: scale(.98); }
.btn-clock.in { background: var(--on); color: #fff; box-shadow: 0 8px 24px rgba(30,140,90,.35); }
.btn-clock.out { background: var(--signal); color: #1E2A33; }
@media (min-width: 760px) {
  .hero { grid-template-columns: auto 1fr; grid-template-areas: 'clock status' 'clock button'; align-items: center; justify-items: start; padding: 26px 32px; column-gap: 36px; }
  .hero .clock { grid-area: clock; width: 300px; }
  .hero-status { grid-area: status; text-align: left; align-self: end; }
  .hero-status-row, .hero-meta { justify-content: flex-start; }
  .btn-clock { grid-area: button; align-self: start; }
}

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 760px) { .stat-grid { grid-template-columns: repeat(5, 1fr); } .stat-grid.three { grid-template-columns: repeat(3, 1fr); } .stat-grid.four { grid-template-columns: repeat(4, 1fr); } }
.stat-grid.three { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat-label { font-size: 13px; color: var(--steel); font-weight: 600; }
.stat-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-sub { font-size: 12.5px; color: var(--steel); }
.stat.link { text-decoration: none; color: inherit; }
.stat.link:hover { border-color: var(--steel); }
.stat.attn { border-color: var(--signal); background: linear-gradient(var(--signal-soft), var(--signal-soft)) top / 100% 4px no-repeat, var(--surface); }

/* ---------- lists ---------- */
.list { display: grid; gap: 8px; }
.row-item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  text-align: left; cursor: pointer; text-decoration: none; color: inherit; }
.row-item:hover { border-color: var(--steel); }
.row-item.static { cursor: default; }
.row-item.static:hover { border-color: var(--line); }
.row-item.live { border-color: var(--on); box-shadow: inset 4px 0 0 var(--on); }
.row-item.flagged { box-shadow: inset 4px 0 0 var(--bad); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-title { font-weight: 650; overflow-wrap: anywhere; }
.row-sub { font-size: 14px; color: var(--steel); }
.row-side { display: grid; justify-items: end; gap: 4px; flex: none; }
.row-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.row-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.day-group { display: grid; gap: 8px; }
.day-head { display: flex; justify-content: space-between; font-weight: 650; padding: 4px 2px 0; font-size: 15px; }
.cards { display: grid; gap: 12px; }
@media (min-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } }
.group-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.group-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rev { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; font-size: 15px; }
.rev.voided, tr.voided { opacity: .6; }
.rev.voided strong { text-decoration: line-through; }

<!-- Server code to copy into Supabase (shown on the Setup screen). Not run by the browser. -->
<script type="text/plain" id="sql-foundation">
-- =====================================================================
--  EMPLOYEE TIME CLOCK — PART 1: SECURE FOUNDATION
--  Run this ONCE in Supabase:  SQL Editor  ->  New query  ->  paste  ->  Run
--
--  What this creates
--    * employees                 one row per person (stable UUID id + employee number)
--    * employee_access           role (admin / employee) and status (active / suspended / disabled)
--    * employee_google_accounts  the ONE approved Google account linked to each employee
--    * access_requests           Google accounts that signed in but are not approved (yet)
--    * company_settings          one row of company-wide settings
--    * audit_log                 append-only history of every change to the tables above
--
--  Security model (short version)
--    * Row Level Security is ON for every table. The browser can only READ rows the
--      signed-in person is allowed to see, and can never write to any table directly.
--    * Every change goes through a database function (RPC) that checks, on the
--      server, who the caller is and what they are allowed to do.
--    * "Who is the caller" comes only from the Supabase-signed login token
--      (auth.uid()) and the database tables — never from anything the browser sends.
--    * Access is re-checked on every single request, so suspending someone
--      takes effect immediately, and signing out kills the session server-side.
-- =====================================================================

begin;

-- ---------------------------------------------------------------------
-- 0. Private schema for helper functions (NOT exposed through the API)
-- ---------------------------------------------------------------------
create schema if not exists private;
revoke all on schema private from public;
grant usage on schema private to authenticated;   -- needed so RLS policies can call the helpers

-- Harden defaults for tables/functions created later (Part 2) by the dashboard/SQL editor:
-- new tables are NOT automatically readable/writable by browser roles, and new functions
-- are NOT automatically callable by anonymous visitors. Part 2 grants access explicitly.
alter default privileges in schema public revoke all on tables    from anon, authenticated;
alter default privileges in schema public revoke all on sequences from anon, authenticated;
alter default privileges in schema public revoke execute on functions from public, anon, authenticated;
alter default privileges in schema private revoke execute on functions from public;

-- ---------------------------------------------------------------------
-- 1. Types
-- ---------------------------------------------------------------------
create type public.app_role       as enum ('admin', 'employee');
create type public.account_status as enum ('active', 'suspended', 'disabled');
--   active    = may use the app
--   suspended = temporarily blocked (e.g. on leave); history kept
--   disabled  = access revoked (e.g. no longer employed); history kept

-- ---------------------------------------------------------------------
-- 2. Tables
-- ---------------------------------------------------------------------

-- 2a. Employee profile. "id" is the permanent identifier every Part 2 table points to.
create table public.employees (
  id               uuid primary key default gen_random_uuid(),
  employee_number  integer generated always as identity unique,   -- friendly number: 1, 2, 3 ...
  full_name        text not null check (length(btrim(full_name)) between 1 and 120),
  preferred_name   text check (preferred_name is null or length(btrim(preferred_name)) between 1 and 60),
  created_at       timestamptz not null default now(),
  created_by       uuid references public.employees(id) on delete restrict,
  updated_at       timestamptz not null default now()
);
comment on table public.employees is 'One row per person. Never deleted; access is revoked via employee_access.status.';

-- 2b. Role and status (separate table so nobody can change it by editing a profile).
create table public.employee_access (
  employee_id        uuid primary key references public.employees(id) on delete restrict,
  role               public.app_role not null default 'employee',
  status             public.account_status not null default 'active',
  status_reason      text check (status_reason is null or length(status_reason) <= 300),
  status_changed_at  timestamptz not null default now(),
  status_changed_by  uuid references public.employees(id) on delete restrict,
  approved_at        timestamptz not null default now(),
  approved_by        uuid references public.employees(id) on delete restrict,  -- null only for the first admin
  updated_at         timestamptz not null default now()
);
create index employee_access_role_status_idx on public.employee_access (role, status);

-- 2c. The approved Google account for each employee.
--     The admin approves an EMAIL; on first sign-in it is permanently bound to that
--     person's Supabase user id AND Google's unchangeable account id ("subject").
create table public.employee_google_accounts (
  id              uuid primary key default gen_random_uuid(),
  employee_id     uuid not null references public.employees(id) on delete restrict,
  google_email    text not null
                  check (google_email = lower(btrim(google_email))
                         and google_email ~ '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'),
  auth_user_id    uuid references auth.users(id) on delete set null,
  google_subject  text,
  linked_at       timestamptz,
  created_at      timestamptz not null default now(),
  created_by      uuid references public.employees(id) on delete restrict,
  revoked_at      timestamptz,
  revoked_by      uuid references public.employees(id) on delete restrict
);
-- At most ONE active Google account per employee, and each Google account belongs to ONE employee.
create unique index employee_google_accounts_one_active_per_employee on public.employee_google_accounts (employee_id)    where revoked_at is null;
create unique index employee_google_accounts_email_active         on public.employee_google_accounts (google_email)   where revoked_at is null;
create unique index employee_google_accounts_user_active          on public.employee_google_accounts (auth_user_id)   where revoked_at is null;
create unique index employee_google_accounts_subject_active       on public.employee_google_accounts (google_subject) where revoked_at is null;

-- 2d. People who signed in with Google but are not approved. Lets the admin approve
--     them with one tap. Creating a request grants NOTHING.
create table public.access_requests (
  id              uuid primary key default gen_random_uuid(),
  auth_user_id    uuid not null unique references auth.users(id) on delete cascade,
  google_email    text not null,
  google_subject  text not null,
  display_name    text,
  status          text not null default 'pending' check (status in ('pending', 'approved', 'dismissed')),
  requested_at    timestamptz not null default now(),
  last_seen_at    timestamptz not null default now(),
  resolved_at     timestamptz,
  resolved_by     uuid references public.employees(id) on delete restrict,
  employee_id     uuid references public.employees(id) on delete restrict
);
create index access_requests_pending_idx on public.access_requests (requested_at desc) where status = 'pending';

-- 2e. Company-wide settings (exactly one row).
create table public.company_settings (
  id              boolean primary key default true check (id),
  company_name    text not null default 'My Company' check (length(btrim(company_name)) between 1 and 120),
  time_zone       text not null default 'America/Vancouver',
  week_starts_on  smallint not null default 0 check (week_starts_on between 0 and 6),  -- 0 = Sunday
  currency_code   text not null default 'CAD' check (currency_code ~ '^[A-Z]{3}$'),
  updated_at      timestamptz not null default now(),
  updated_by      uuid references public.employees(id) on delete restrict
);
insert into public.company_settings default values;

-- 2f. Audit log — append-only, cannot be edited or deleted by anyone.
create table public.audit_log (
  id                  bigint generated always as identity primary key,
  occurred_at         timestamptz not null default now(),
  actor_employee_id   uuid references public.employees(id) on delete restrict,
  actor_auth_user_id  uuid,
  actor_kind          text not null,                -- 'authenticated' (app user) or 'database' (SQL editor / owner)
  action              text not null,                -- e.g. 'admin_set_status'
  target_table        text not null,
  target_id           text,
  operation           text not null check (operation in ('INSERT', 'UPDATE', 'DELETE')),
  old_data            jsonb,
  new_data            jsonb
);
create index audit_log_occurred_idx on public.audit_log (occurred_at desc);
create index audit_log_target_idx   on public.audit_log (target_table, target_id);
create index audit_log_actor_idx    on public.audit_log (actor_employee_id);

-- ---------------------------------------------------------------------
-- 3. Private helper functions (used by RLS policies and RPCs)
-- ---------------------------------------------------------------------

-- Is the caller's login session still alive on the server?
-- (Signing out deletes the session, so a copied token stops working immediately.)
create or replace function private.session_is_live()
returns boolean
language sql stable security definer set search_path = ''
as $$
  select exists (
    select 1 from auth.sessions s
    where s.id = nullif(auth.jwt() ->> 'session_id', '')::uuid
      and s.user_id = auth.uid()
  );
$$;

-- The caller's employee id — ONLY if their linked Google account is active,
-- their status is 'active', and their session is live. Otherwise NULL.
create or replace function private.current_employee_id()
returns uuid
language sql stable security definer set search_path = ''
as $$
  select g.employee_id
  from public.employee_google_accounts g
  join public.employee_access a on a.employee_id = g.employee_id
  where g.auth_user_id = auth.uid()
    and g.revoked_at is null
    and a.status = 'active'
    and private.session_is_live()
  limit 1;
$$;

create or replace function private.is_admin()
returns boolean
language sql stable security definer set search_path = ''
as $$
  select exists (
    select 1
    from public.employee_google_accounts g
    join public.employee_access a on a.employee_id = g.employee_id
    where g.auth_user_id = auth.uid()
      and g.revoked_at is null
      and a.status = 'active'
      and a.role = 'admin'
      and private.session_is_live()
  );
$$;

create or replace function private.is_active_member()
returns boolean
language sql stable security definer set search_path = ''
as $$ select private.current_employee_id() is not null; $$;

create or replace function private.require_admin()
returns uuid
language plpgsql stable security definer set search_path = ''
as $$
declare v_id uuid;
begin
  if not private.is_admin() then
    raise exception 'Administrator access required' using errcode = '42501';
  end if;
  v_id := private.current_employee_id();
  return v_id;
end;
$$;

-- Generic "updated_at" trigger.
create or replace function private.touch_updated_at()
returns trigger language plpgsql set search_path = ''
as $$ begin new.updated_at := now(); return new; end; $$;

-- Generic audit trigger. Attach it to any table (Part 2 tables too).
-- RPCs label the change with set_config('app.audit_action', '<name>', true).
create or replace function private.audit_row_change()
returns trigger
language plpgsql security definer set search_path = ''
as $$
declare
  v_uid   uuid := auth.uid();
  v_emp   uuid;
  v_id    text;
  v_old   jsonb := case when tg_op in ('UPDATE', 'DELETE') then to_jsonb(old) end;
  v_new   jsonb := case when tg_op in ('INSERT', 'UPDATE') then to_jsonb(new) end;
begin
  if v_uid is not null then
    select g.employee_id into v_emp
    from public.employee_google_accounts g
    where g.auth_user_id = v_uid and g.revoked_at is null
    limit 1;
  end if;
  v_id := coalesce(v_new, v_old) ->> coalesce(nullif(tg_argv[0], ''), 'id');
  insert into public.audit_log (actor_employee_id, actor_auth_user_id, actor_kind, action,
                                target_table, target_id, operation, old_data, new_data)
  values (v_emp, v_uid,
          case when v_uid is null then 'database' else 'authenticated' end,
          coalesce(nullif(current_setting('app.audit_action', true), ''), lower(tg_table_name) || '.' || lower(tg_op)),
          tg_table_name, v_id, tg_op, v_old, v_new);
  return null;
end;
$$;

-- Audit log is append-only for everyone, including the database owner.
create or replace function private.block_audit_changes()
returns trigger language plpgsql set search_path = ''
as $$ begin raise exception 'audit_log is append-only' using errcode = '42501'; end; $$;

create or replace function private.validate_company_settings()
returns trigger language plpgsql set search_path = ''
as $$
begin
  if not exists (select 1 from pg_catalog.pg_timezone_names where name = new.time_zone) then
    raise exception 'Unknown time zone: %', new.time_zone using errcode = '22023';
  end if;
  return new;
end;
$$;

-- ---------------------------------------------------------------------
-- 4. Triggers
-- ---------------------------------------------------------------------
create trigger employees_touch        before update on public.employees        for each row execute function private.touch_updated_at();
create trigger employee_access_touch  before update on public.employee_access  for each row execute function private.touch_updated_at();
create trigger company_settings_touch before update on public.company_settings for each row execute function private.touch_updated_at();
create trigger company_settings_check before insert or update on public.company_settings for each row execute function private.validate_company_settings();

create trigger employees_audit                after insert or update or delete on public.employees                for each row execute function private.audit_row_change('id');
create trigger employee_access_audit          after insert or update or delete on public.employee_access          for each row execute function private.audit_row_change('employee_id');
create trigger employee_google_accounts_audit after insert or update or delete on public.employee_google_accounts for each row execute function private.audit_row_change('id');
create trigger access_requests_audit          after insert or update or delete on public.access_requests          for each row execute function private.audit_row_change('id');
create trigger company_settings_audit         after insert or update or delete on public.company_settings         for each row execute function private.audit_row_change('id');

create trigger audit_log_no_update   before update or delete on public.audit_log for each row execute function private.block_audit_changes();
create trigger audit_log_no_truncate before truncate on public.audit_log for each statement execute function private.block_audit_changes();

-- ---------------------------------------------------------------------
-- 5. Row Level Security — browser roles may only READ, and only what they're allowed
-- ---------------------------------------------------------------------
alter table public.employees                enable row level security;
alter table public.employee_access          enable row level security;
alter table public.employee_google_accounts enable row level security;
alter table public.access_requests          enable row level security;
alter table public.company_settings         enable row level security;
alter table public.audit_log                enable row level security;

-- Remove every default privilege, then grant SELECT only. No INSERT/UPDATE/DELETE for anyone.
revoke all on all tables    in schema public from anon, authenticated;
revoke all on all sequences in schema public from anon, authenticated;
grant select on public.employees, public.employee_access, public.employee_google_accounts,
                public.access_requests, public.company_settings, public.audit_log
  to authenticated;

create policy employees_read on public.employees
  for select to authenticated
  using (id = (select private.current_employee_id()) or (select private.is_admin()));

create policy employee_access_read on public.employee_access
  for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));

create policy employee_google_accounts_read on public.employee_google_accounts
  for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));

create policy access_requests_read on public.access_requests
  for select to authenticated
  using ((select private.is_admin()) or (auth_user_id = (select auth.uid()) and (select private.session_is_live())));

create policy company_settings_read on public.company_settings
  for select to authenticated
  using ((select private.is_active_member()));

create policy audit_log_read on public.audit_log
  for select to authenticated
  using ((select private.is_admin()));

-- A convenient read-only view. security_invoker = true means the RLS rules
-- above still apply to whoever is reading it.
create view public.employee_directory with (security_invoker = true) as
select e.id               as employee_id,
       e.employee_number,
       e.full_name,
       e.preferred_name,
       a.role,
       a.status,
       a.status_reason,
       a.status_changed_at,
       g.google_email,
       (g.auth_user_id is not null) as is_linked,
       g.linked_at,
       e.created_at
from public.employees e
join public.employee_access a on a.employee_id = e.id
left join public.employee_google_accounts g on g.employee_id = e.id and g.revoked_at is null;

revoke all on public.employee_directory from anon, authenticated;
grant select on public.employee_directory to authenticated;

-- ---------------------------------------------------------------------
-- 6. App functions (RPCs) — the ONLY way to change data
-- ---------------------------------------------------------------------

-- Called by the app right after Google sign-in, and whenever it re-checks access.
-- Links an admin-approved email to the signed-in Google identity (first time only),
-- records an access request for unknown accounts, and reports the caller's state.
create or replace function public.resolve_my_access()
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_uid       uuid := auth.uid();
  v_email     text;
  v_sub       text;
  v_verified  boolean;
  v_name      text;
  v_acct      public.employee_google_accounts%rowtype;
  v_access    public.employee_access%rowtype;
  v_emp       public.employees%rowtype;
  v_company   text;
  v_req       text;
begin
  if v_uid is null then
    raise exception 'Not signed in' using errcode = '42501';
  end if;
  if not private.session_is_live() then
    return jsonb_build_object('state', 'session_invalid');
  end if;

  -- The Google identity, as recorded by Supabase Auth (trusted; not supplied by the browser).
  select lower(i.identity_data ->> 'email'),
         i.provider_id,
         coalesce((i.identity_data ->> 'email_verified')::boolean, false),
         left(coalesce(i.identity_data ->> 'full_name', i.identity_data ->> 'name'), 120)
    into v_email, v_sub, v_verified, v_name
  from auth.identities i
  where i.user_id = v_uid and i.provider = 'google'
  order by i.created_at nulls last
  limit 1;

  if v_sub is null then
    return jsonb_build_object('state', 'not_approved', 'email', auth.jwt() ->> 'email',
                              'reason', 'Please sign in with Google.');
  end if;

  -- Already linked?
  select * into v_acct from public.employee_google_accounts
  where auth_user_id = v_uid and revoked_at is null;

  if not found then
    -- Is this email approved and waiting to be linked?
    select * into v_acct from public.employee_google_accounts
    where google_email = v_email and revoked_at is null and auth_user_id is null
    for update;

    if found and v_verified and (v_acct.google_subject is null or v_acct.google_subject = v_sub) then
      perform set_config('app.audit_action', 'link_google_account', true);
      update public.employee_google_accounts
         set auth_user_id = v_uid, google_subject = v_sub, linked_at = now()
       where id = v_acct.id
      returning * into v_acct;
      update public.access_requests
         set status = 'approved', resolved_at = now(), employee_id = v_acct.employee_id
       where auth_user_id = v_uid and status = 'pending';
    else
      -- Unknown (or mismatched) account: record a request. This grants nothing.
      perform set_config('app.audit_action', 'access_request', true);
      insert into public.access_requests (auth_user_id, google_email, google_subject, display_name)
      values (v_uid, coalesce(v_email, ''), v_sub, v_name)
      on conflict (auth_user_id) do update
        set last_seen_at = now(),
            -- an old 'approved' request whose access was later replaced goes back to the queue
            status      = case when public.access_requests.status = 'approved' then 'pending' else public.access_requests.status end,
            resolved_at = case when public.access_requests.status = 'approved' then null else public.access_requests.resolved_at end
      returning status into v_req;
      return jsonb_build_object('state', 'not_approved', 'email', v_email, 'request_status', v_req);
    end if;
  end if;

  select * into v_access from public.employee_access where employee_id = v_acct.employee_id;
  select * into v_emp    from public.employees       where id          = v_acct.employee_id;

  if v_access.status <> 'active' then
    return jsonb_build_object('state', v_access.status::text, 'email', v_email);
  end if;

  select company_name into v_company from public.company_settings where id;

  return jsonb_build_object(
    'state',           'active',
    'email',           v_email,
    'employee_id',     v_emp.id,
    'employee_number', v_emp.employee_number,
    'full_name',       v_emp.full_name,
    'preferred_name',  v_emp.preferred_name,
    'role',            v_access.role::text,
    'company_name',    v_company
  );
end;
$$;

-- An active employee may change their own preferred (display) name. Nothing else.
create or replace function public.update_my_profile(p_preferred_name text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_me uuid := private.current_employee_id();
begin
  if v_me is null then
    raise exception 'Access denied' using errcode = '42501';
  end if;
  perform set_config('app.audit_action', 'update_my_profile', true);
  update public.employees
     set preferred_name = nullif(btrim(p_preferred_name), '')
   where id = v_me;
end;
$$;

-- ADMIN: add an employee by their Google email. They become active as soon as they sign in.
create or replace function public.admin_create_employee(
  p_full_name    text,
  p_google_email text,
  p_role         public.app_role default 'employee'
)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin uuid := private.require_admin();
  v_email text := lower(btrim(p_google_email));
  v_emp   uuid;
begin
  if exists (select 1 from public.employee_google_accounts where google_email = v_email and revoked_at is null) then
    raise exception 'That Google account is already assigned to an employee' using errcode = '23505';
  end if;
  perform set_config('app.audit_action', 'admin_create_employee', true);
  insert into public.employees (full_name, created_by) values (btrim(p_full_name), v_admin) returning id into v_emp;
  insert into public.employee_access (employee_id, role, status, approved_by, status_changed_by)
  values (v_emp, coalesce(p_role, 'employee'), 'active', v_admin, v_admin);
  insert into public.employee_google_accounts (employee_id, google_email, created_by)
  values (v_emp, v_email, v_admin);
  return v_emp;
end;
$$;

-- ADMIN: approve someone who already signed in (from the Requests list).
create or replace function public.admin_approve_request(
  p_request_id uuid,
  p_full_name  text default null,
  p_role       public.app_role default 'employee'
)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin uuid := private.require_admin();
  v_req   public.access_requests%rowtype;
  v_ok    boolean;
  v_emp   uuid;
begin
  select * into v_req from public.access_requests where id = p_request_id and status = 'pending' for update;
  if not found then
    raise exception 'Request not found or already handled' using errcode = 'P0002';
  end if;
  -- Re-confirm the Google identity still exists and is verified.
  select coalesce((i.identity_data ->> 'email_verified')::boolean, false) into v_ok
  from auth.identities i
  where i.user_id = v_req.auth_user_id and i.provider = 'google' and i.provider_id = v_req.google_subject;
  if not coalesce(v_ok, false) then
    raise exception 'This Google account is no longer valid' using errcode = '22023';
  end if;
  if exists (select 1 from public.employee_google_accounts
             where revoked_at is null
               and (google_email = v_req.google_email or auth_user_id = v_req.auth_user_id or google_subject = v_req.google_subject)) then
    raise exception 'That Google account is already assigned to an employee' using errcode = '23505';
  end if;

  perform set_config('app.audit_action', 'admin_approve_request', true);
  insert into public.employees (full_name, created_by)
  values (coalesce(nullif(btrim(p_full_name), ''), nullif(btrim(v_req.display_name), ''), v_req.google_email), v_admin)
  returning id into v_emp;
  insert into public.employee_access (employee_id, role, status, approved_by, status_changed_by)
  values (v_emp, coalesce(p_role, 'employee'), 'active', v_admin, v_admin);
  insert into public.employee_google_accounts (employee_id, google_email, auth_user_id, google_subject, linked_at, created_by)
  values (v_emp, v_req.google_email, v_req.auth_user_id, v_req.google_subject, now(), v_admin);
  update public.access_requests
     set status = 'approved', resolved_at = now(), resolved_by = v_admin, employee_id = v_emp
   where id = v_req.id;
  return v_emp;
end;
$$;

-- ADMIN: dismiss a request (the person still has no access).
create or replace function public.admin_dismiss_request(p_request_id uuid)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  perform set_config('app.audit_action', 'admin_dismiss_request', true);
  update public.access_requests
     set status = 'dismissed', resolved_at = now(), resolved_by = v_admin
   where id = p_request_id and status = 'pending';
  if not found then
    raise exception 'Request not found or already handled' using errcode = 'P0002';
  end if;
end;
$$;

-- ADMIN: activate / suspend / disable an employee. History is always kept.
create or replace function public.admin_set_status(
  p_employee_id uuid,
  p_status      public.account_status,
  p_reason      text default null
)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  if p_employee_id = v_admin then
    raise exception 'You cannot change your own status' using errcode = '42501';
  end if;
  if p_status is null then
    raise exception 'Status is required' using errcode = '22023';
  end if;
  perform set_config('app.audit_action', 'admin_set_status', true);
  update public.employee_access
     set status = p_status,
         status_reason = nullif(btrim(p_reason), ''),
         status_changed_at = now(),
         status_changed_by = v_admin
   where employee_id = p_employee_id;
  if not found then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
end;
$$;

-- ADMIN: make someone an admin or an employee. Admins cannot change their own role,
-- so there is always at least one active admin.
create or replace function public.admin_set_role(p_employee_id uuid, p_role public.app_role)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  if p_employee_id = v_admin then
    raise exception 'You cannot change your own role' using errcode = '42501';
  end if;
  if p_role is null then
    raise exception 'Role is required' using errcode = '22023';
  end if;
  perform set_config('app.audit_action', 'admin_set_role', true);
  update public.employee_access set role = p_role where employee_id = p_employee_id;
  if not found then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
end;
$$;

-- ADMIN: correct an employee's name.
create or replace function public.admin_update_employee(
  p_employee_id    uuid,
  p_full_name      text,
  p_preferred_name text default null
)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  perform set_config('app.audit_action', 'admin_update_employee', true);
  update public.employees
     set full_name = btrim(p_full_name),
         preferred_name = nullif(btrim(p_preferred_name), '')
   where id = p_employee_id;
  if not found then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
end;
$$;

-- ADMIN: move an employee to a different Google account (e.g. they lost the old one).
-- The old link is revoked (kept for history); the employee id and all records stay the same.
create or replace function public.admin_replace_google_account(p_employee_id uuid, p_new_google_email text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin uuid := private.require_admin();
  v_email text := lower(btrim(p_new_google_email));
begin
  if p_employee_id = v_admin then
    raise exception 'You cannot replace your own Google account; ask another administrator' using errcode = '42501';
  end if;
  if not exists (select 1 from public.employees where id = p_employee_id) then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
  if exists (select 1 from public.employee_google_accounts where google_email = v_email and revoked_at is null) then
    raise exception 'That Google account is already assigned to an employee' using errcode = '23505';
  end if;
  perform set_config('app.audit_action', 'admin_replace_google_account', true);
  update public.employee_google_accounts
     set revoked_at = now(), revoked_by = v_admin
   where employee_id = p_employee_id and revoked_at is null;
  insert into public.employee_google_accounts (employee_id, google_email, created_by)
  values (p_employee_id, v_email, v_admin);
end;
$$;

-- ADMIN: company settings.
create or replace function public.admin_update_company_settings(
  p_company_name   text,
  p_time_zone      text,
  p_week_starts_on smallint,
  p_currency_code  text
)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  perform set_config('app.audit_action', 'admin_update_company_settings', true);
  update public.company_settings
     set company_name   = btrim(p_company_name),
         time_zone      = btrim(p_time_zone),
         week_starts_on = p_week_starts_on,
         currency_code  = upper(btrim(p_currency_code)),
         updated_by     = v_admin
   where id;
end;
$$;

-- ADMIN: live security report — checks every table in the public schema.
create or replace function public.admin_security_report()
returns table (
  table_name               text,
  rls_enabled              boolean,
  anon_privileges          text,
  browser_write_privileges text,
  ok                       boolean
)
language plpgsql stable security definer set search_path = ''
as $$
begin
  perform private.require_admin();
  return query
  select c.relname::text,
         c.relrowsecurity,
         coalesce((select string_agg(p, ', ') from unnest(array['SELECT','INSERT','UPDATE','DELETE']) p
                   where has_table_privilege('anon', c.oid, p)), ''),
         coalesce((select string_agg(p, ', ') from unnest(array['INSERT','UPDATE','DELETE','TRUNCATE']) p
                   where has_table_privilege('authenticated', c.oid, p)), ''),
         (c.relkind = 'v' or c.relrowsecurity)
           and not has_table_privilege('anon', c.oid, 'SELECT')
           and not has_table_privilege('authenticated', c.oid, 'INSERT')
           and not has_table_privilege('authenticated', c.oid, 'UPDATE')
           and not has_table_privilege('authenticated', c.oid, 'DELETE')
  from pg_catalog.pg_class c
  join pg_catalog.pg_namespace n on n.oid = c.relnamespace
  where n.nspname = 'public' and c.relkind in ('r', 'p', 'v')
  order by 1;
end;
$$;

-- ---------------------------------------------------------------------
-- 7. First administrator — can ONLY be run by the project owner in the
--    Supabase SQL Editor. It is not reachable from the website or API,
--    and it refuses to run if an active administrator already exists.
-- ---------------------------------------------------------------------
create or replace function private.bootstrap_first_admin(p_google_email text, p_full_name text)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_email text := lower(btrim(p_google_email));
  v_emp   uuid;
begin
  if exists (select 1 from public.employee_access where role = 'admin' and status = 'active') then
    raise exception 'An active administrator already exists. Add more administrators from inside the app.';
  end if;
  if exists (select 1 from public.employee_google_accounts where google_email = v_email and revoked_at is null) then
    raise exception 'That Google account is already assigned to an employee.';
  end if;
  perform set_config('app.audit_action', 'bootstrap_first_admin', true);
  insert into public.employees (full_name) values (btrim(p_full_name)) returning id into v_emp;
  insert into public.employee_access (employee_id, role, status, status_reason)
  values (v_emp, 'admin', 'active', 'Initial administrator');
  insert into public.employee_google_accounts (employee_id, google_email) values (v_emp, v_email);
  return v_emp;
end;
$$;

-- ---------------------------------------------------------------------
-- 8. Function permissions — lock everything down, then open only what the app needs
-- ---------------------------------------------------------------------
revoke all on all functions in schema public  from public, anon, authenticated;
revoke all on all functions in schema private from public, anon, authenticated;

-- Helpers that RLS policies call (they only ever describe the caller themselves):
grant execute on function private.session_is_live(), private.current_employee_id(),
                          private.is_admin(), private.is_active_member()
  to authenticated;

-- RPCs callable by signed-in users (each one checks permissions itself):
grant execute on function
  public.resolve_my_access(),
  public.update_my_profile(text),
  public.admin_create_employee(text, text, public.app_role),
  public.admin_approve_request(uuid, text, public.app_role),
  public.admin_dismiss_request(uuid),
  public.admin_set_status(uuid, public.account_status, text),
  public.admin_set_role(uuid, public.app_role),
  public.admin_update_employee(uuid, text, text),
  public.admin_replace_google_account(uuid, text),
  public.admin_update_company_settings(text, text, smallint, text),
  public.admin_security_report()
  to authenticated;

-- private.bootstrap_first_admin: deliberately NOT granted to anyone (owner only).

commit;
</script>
<script type="text/plain" id="sql-part2">
-- =====================================================================
--  EMPLOYEE TIME CLOCK — PART 2 UPGRADE
--  Run AFTER the Part 1 foundation. SQL Editor -> New query -> paste -> Run.
--
--  Adds: worksites, work groups (per street + reporting cycle), shifts with
--  server timestamps, lunch, reports with immutable snapshots, corrections,
--  shift revision history, notes, effective-dated wage rates, payments,
--  preferences, export/backup/restore history, and backup/restore functions.
--
--  Same security model as Part 1:
--    * RLS on every table; the browser can only READ what it is allowed to.
--    * Every change goes through a checked database function.
--    * Official times come from the database clock (now()), never the phone.
-- =====================================================================
begin;

create extension if not exists btree_gist with schema extensions;

-- ---------------------------------------------------------------------
-- 1. Company settings (extends the Part 1 row)
-- ---------------------------------------------------------------------
alter table public.company_settings
  add column contact_email               text check (contact_email is null or contact_email ~ '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'),
  add column contact_phone               text check (contact_phone is null or length(contact_phone) <= 40),
  add column company_address             text check (company_address is null or length(company_address) <= 300),
  add column date_format                 text not null default 'MMM d, yyyy'
                                         check (date_format in ('MMM d, yyyy', 'yyyy-MM-dd', 'dd/MM/yyyy', 'MM/dd/yyyy')),
  add column time_format                 text not null default '12h' check (time_format in ('12h', '24h')),
  add column default_lunch_minutes       integer not null default 30  check (default_lunch_minutes between 0 and 240),
  add column max_lunch_minutes           integer not null default 120 check (max_lunch_minutes between 0 and 480),
  add column location_mode               text not null default 'device_with_manual_fallback'
                                         check (location_mode in ('device_with_manual_fallback', 'device_only', 'manual_only')),
  add column allow_custom_manual_sites   boolean not null default false,
  add column grouping_mode               text not null default 'street_locality'
                                         check (grouping_mode in ('street_locality', 'street_only')),
  add column max_shift_hours             integer not null default 16 check (max_shift_hours between 4 and 36),
  add column pay_period_type             text not null default 'biweekly'
                                         check (pay_period_type in ('weekly', 'biweekly', 'semimonthly', 'monthly')),
  add column pay_period_anchor           date not null default date '2026-01-04',
  add column default_hourly_rate         numeric(10,2) check (default_hourly_rate is null or default_hourly_rate between 0 and 9999),
  add column overtime_enabled            boolean not null default false,
  add column daily_ot_after_hours        numeric(5,2) not null default 8  check (daily_ot_after_hours between 1 and 24),
  add column daily_dt_after_hours        numeric(5,2) not null default 12 check (daily_dt_after_hours between 1 and 24),
  add column weekly_ot_after_hours       numeric(5,2) not null default 40 check (weekly_ot_after_hours between 1 and 168),
  add column ot_multiplier               numeric(4,2) not null default 1.5 check (ot_multiplier between 1 and 5),
  add column dt_multiplier               numeric(4,2) not null default 2.0 check (dt_multiplier between 1 and 5),
  add column require_report_approval     boolean not null default true,
  add column payment_methods             text not null default 'Direct deposit, e-Transfer, Cheque, Cash'
                                         check (length(payment_methods) <= 300),
  add column backups_enabled             boolean not null default true,
  add column backup_after_change_minutes integer not null default 10 check (backup_after_change_minutes between 5 and 1440),
  add column backup_daily_hour           smallint not null default 2 check (backup_daily_hour between 0 and 23),
  add column retention_years             integer not null default 4 check (retention_years between 4 and 50),
  add column notes_employee_can_edit_days integer check (notes_employee_can_edit_days is null or notes_employee_can_edit_days between 0 and 3650),
  add constraint company_settings_dt_after_ot check (daily_dt_after_hours > daily_ot_after_hours),
  add constraint company_settings_lunch_max check (default_lunch_minutes <= max_lunch_minutes);

-- ---------------------------------------------------------------------
-- 2. Employee profile additions (BC employment-record fields; all optional)
-- ---------------------------------------------------------------------
alter table public.employees
  add column display_name          text check (display_name is null or length(btrim(display_name)) between 1 and 60),
  add column job_title             text check (job_title is null or length(job_title) <= 80),
  add column employment_start_date date,
  add column employment_end_date   date,
  add column phone                 text check (phone is null or length(phone) <= 40),
  add column residential_address   text check (residential_address is null or length(residential_address) <= 300),
  add column date_of_birth         date,      -- BC requires it only for employees under 19
  add column payroll_id            text check (payroll_id is null or length(payroll_id) <= 40),
  add constraint employees_end_after_start check (employment_end_date is null or employment_start_date is null
                                                  or employment_end_date >= employment_start_date);
-- Allows restore to give a clashing friendly number a new value (browser roles still cannot write).
alter table public.employees alter column employee_number set generated by default;
create unique index employees_payroll_id_unique on public.employees (payroll_id) where payroll_id is not null;

create table public.employee_preferences (
  employee_id    uuid primary key references public.employees(id) on delete restrict,
  theme          text not null default 'system' check (theme in ('system', 'light', 'dark')),
  clock_format   text not null default 'company' check (clock_format in ('company', '12h', '24h')),
  show_seconds   boolean not null default true,
  reduce_motion  boolean not null default false,
  updated_at     timestamptz not null default now()
);

-- ---------------------------------------------------------------------
-- 3. Worksites and work groups
-- ---------------------------------------------------------------------
create table public.worksites (
  id                   uuid primary key default gen_random_uuid(),
  site_key             text not null unique,          -- normalised street|locality, or admin:/manual: key
  label                text not null check (length(btrim(label)) between 1 and 160),
  street               text check (street is null or length(street) <= 120),
  locality             text check (locality is null or length(locality) <= 120),
  region               text check (region is null or length(region) <= 80),
  postal_code          text check (postal_code is null or length(postal_code) <= 20),
  country              text check (country is null or length(country) <= 80),
  latitude             numeric(9,6) check (latitude between -90 and 90),
  longitude            numeric(9,6) check (longitude between -180 and 180),
  source               text not null check (source in ('device', 'admin', 'employee_manual')),
  -- device          = street found by reverse-geocoding the phone's reported location
  -- admin           = created by an administrator
  -- employee_manual = typed by an employee: UNVERIFIED
  available_for_manual boolean not null default false,
  is_active            boolean not null default true,
  created_by           uuid references public.employees(id) on delete restrict,
  created_at           timestamptz not null default now(),
  updated_at           timestamptz not null default now()
);

create table public.work_groups (
  id            uuid primary key default gen_random_uuid(),
  employee_id   uuid not null references public.employees(id) on delete restrict,
  worksite_id   uuid not null references public.worksites(id) on delete restrict,
  cycle_number  integer not null check (cycle_number > 0),
  status        text not null default 'open' check (status in ('open', 'submitted', 'returned', 'approved')),
  opened_at     timestamptz not null default now(),
  closed_at     timestamptz,
  unique (employee_id, worksite_id, cycle_number),
  unique (id, employee_id),
  unique (id, employee_id, worksite_id)
);
-- Only ONE open group per employee per worksite (no duplicate groups).
create unique index work_groups_one_open on public.work_groups (employee_id, worksite_id) where status = 'open';
create index work_groups_worksite_idx on public.work_groups (worksite_id);
create index work_groups_status_idx   on public.work_groups (status);

-- ---------------------------------------------------------------------
-- 4. Shifts (official clock records)
-- ---------------------------------------------------------------------
create table public.shifts (
  id                   uuid primary key default gen_random_uuid(),
  employee_id          uuid not null references public.employees(id) on delete restrict,
  work_group_id        uuid not null,
  worksite_id          uuid not null references public.worksites(id) on delete restrict,
  clock_in_at          timestamptz not null default now(),
  clock_out_at         timestamptz,
  lunch_minutes        integer not null default 0 check (lunch_minutes between 0 and 480),
  gross_minutes        numeric generated always as (
                         case when clock_out_at is null then null
                              else round(extract(epoch from (clock_out_at - clock_in_at)) / 60.0, 2) end) stored,
  net_minutes          numeric generated always as (
                         case when clock_out_at is null then null
                              else greatest(0, round(extract(epoch from (clock_out_at - clock_in_at)) / 60.0, 2) - lunch_minutes) end) stored,
  clock_in_method      text not null check (clock_in_method in ('device', 'manual', 'admin')),
  clock_in_latitude    numeric(9,6) check (clock_in_latitude between -90 and 90),
  clock_in_longitude   numeric(9,6) check (clock_in_longitude between -180 and 180),
  clock_in_accuracy_m  numeric(9,1) check (clock_in_accuracy_m >= 0),
  clock_in_request_id  uuid unique,
  clock_out_request_id uuid unique,
  source               text not null default 'employee' check (source in ('employee', 'admin_added')),
  needs_review         boolean not null default false,
  review_reason        text,
  created_at           timestamptz not null default now(),
  updated_at           timestamptz not null default now(),
  unique (id, employee_id),
  -- a shift always belongs to a group of the SAME employee and the SAME worksite
  foreign key (work_group_id, employee_id, worksite_id) references public.work_groups (id, employee_id, worksite_id),
  check (clock_out_at is null or clock_out_at > clock_in_at),
  check (clock_out_at is null or lunch_minutes = 0 or lunch_minutes * 60 < extract(epoch from (clock_out_at - clock_in_at))),
  check (clock_out_at is not null or lunch_minutes = 0),
  -- no overlapping shifts for one employee (also prevents duplicates)
  constraint shifts_no_overlap exclude using gist (
    employee_id with =,
    tstzrange(clock_in_at, coalesce(clock_out_at, 'infinity'::timestamptz), '[)') with &&)
);
create unique index shifts_one_active on public.shifts (employee_id) where clock_out_at is null;
create index shifts_group_idx    on public.shifts (work_group_id);
create index shifts_clock_in_idx on public.shifts (clock_in_at);
create index shifts_worksite_idx on public.shifts (worksite_id);

-- ---------------------------------------------------------------------
-- 5. Wage rates (effective-dated; history never overwritten silently)
-- ---------------------------------------------------------------------
create table public.wage_rates (
  id             uuid primary key default gen_random_uuid(),
  employee_id    uuid not null references public.employees(id) on delete restrict,
  hourly_rate    numeric(10,2) not null check (hourly_rate between 0 and 9999),
  effective_from date not null,
  note           text check (note is null or length(note) <= 300),
  created_by     uuid references public.employees(id) on delete restrict,
  created_at     timestamptz not null default now(),
  updated_at     timestamptz not null default now(),
  unique (employee_id, effective_from)
);

-- ---------------------------------------------------------------------
-- 6. Reports, immutable snapshots, payments
-- ---------------------------------------------------------------------
create table public.reports (
  id                        uuid primary key default gen_random_uuid(),
  employee_id               uuid not null references public.employees(id) on delete restrict,
  work_group_id             uuid not null unique,
  status                    text not null check (status in ('submitted', 'under_review', 'returned', 'approved')),
  submitted_at              timestamptz not null default now(),
  submitted_by              uuid not null references public.employees(id) on delete restrict,
  submit_request_id         uuid unique,
  submission_count          integer not null default 1 check (submission_count >= 1),
  employee_note             text check (employee_note is null or length(employee_note) <= 2000),
  period_start              date,
  period_end                date,
  snapshot_net_minutes      numeric,
  snapshot_estimated_amount numeric(12,2),
  reviewed_at               timestamptz,
  reviewed_by               uuid references public.employees(id) on delete restrict,
  review_note               text check (review_note is null or length(review_note) <= 2000),
  flagged                   boolean not null default false,
  flag_note                 text check (flag_note is null or length(flag_note) <= 2000),
  changed_after_submission  boolean not null default false,
  approved_at               timestamptz,
  approved_by               uuid references public.employees(id) on delete restrict,
  approved_net_minutes      numeric,
  approved_amount           numeric(12,2) check (approved_amount is null or approved_amount >= 0),
  amount_paid               numeric(12,2) not null default 0 check (amount_paid >= 0),
  payment_status            text not null default 'unpaid' check (payment_status in ('unpaid', 'partially_paid', 'paid')),
  currency_code             text not null,
  created_at                timestamptz not null default now(),
  updated_at                timestamptz not null default now(),
  unique (id, employee_id),
  foreign key (work_group_id, employee_id) references public.work_groups (id, employee_id)
);
create index reports_status_idx on public.reports (status);
create index reports_payment_idx on public.reports (payment_status);

create table public.report_snapshots (
  id          uuid primary key default gen_random_uuid(),
  report_id   uuid not null references public.reports(id) on delete restrict,
  version     integer not null check (version >= 1),
  snapshot    jsonb not null,
  sha256      text not null,
  created_at  timestamptz not null default now(),
  created_by  uuid not null references public.employees(id) on delete restrict,
  unique (report_id, version)
);

create table public.payments (
  id           uuid primary key default gen_random_uuid(),
  report_id    uuid not null,
  employee_id  uuid not null references public.employees(id) on delete restrict,
  amount       numeric(12,2) not null check (amount > 0),
  paid_on      date not null,
  method       text check (method is null or length(method) <= 60),
  reference    text check (reference is null or length(reference) <= 80),
  note         text check (note is null or length(note) <= 500),
  request_id   uuid not null unique,
  created_by   uuid not null references public.employees(id) on delete restrict,
  created_at   timestamptz not null default now(),
  voided_at    timestamptz,
  voided_by    uuid references public.employees(id) on delete restrict,
  void_reason  text check (void_reason is null or length(void_reason) <= 500),
  foreign key (report_id, employee_id) references public.reports (id, employee_id)
);
create unique index payments_reference_unique on public.payments (employee_id, lower(reference))
  where reference is not null and voided_at is null;
create index payments_report_idx on public.payments (report_id);

-- ---------------------------------------------------------------------
-- 7. Corrections, revision history, notes
-- ---------------------------------------------------------------------
create table public.correction_requests (
  id                      uuid primary key default gen_random_uuid(),
  employee_id             uuid not null references public.employees(id) on delete restrict,
  shift_id                uuid,
  work_group_id           uuid,
  report_id               uuid,
  message                 text not null check (length(btrim(message)) between 1 and 2000),
  proposed_clock_in_at    timestamptz,
  proposed_clock_out_at   timestamptz,
  proposed_lunch_minutes  integer check (proposed_lunch_minutes is null or proposed_lunch_minutes between 0 and 480),
  status                  text not null default 'open' check (status in ('open', 'resolved', 'rejected')),
  resolution_note         text check (resolution_note is null or length(resolution_note) <= 2000),
  resolved_by             uuid references public.employees(id) on delete restrict,
  resolved_at             timestamptz,
  request_id              uuid unique,
  created_at              timestamptz not null default now(),
  foreign key (shift_id, employee_id)      references public.shifts (id, employee_id),
  foreign key (work_group_id, employee_id) references public.work_groups (id, employee_id),
  foreign key (report_id, employee_id)     references public.reports (id, employee_id)
);
create index correction_requests_status_idx on public.correction_requests (status);

create table public.shift_revisions (
  id                     bigint generated always as identity primary key,
  shift_id               uuid not null references public.shifts(id) on delete restrict,
  revision_no            integer not null,
  change_kind            text not null check (change_kind in ('admin_edit', 'admin_add', 'worksite_change')),
  old_values             jsonb,
  new_values             jsonb not null,
  reason                 text not null check (length(btrim(reason)) between 3 and 1000),
  correction_request_id  uuid references public.correction_requests(id) on delete restrict,
  changed_by             uuid not null references public.employees(id) on delete restrict,
  changed_at             timestamptz not null default now(),
  unique (shift_id, revision_no)
);

create table public.notes (
  id             uuid primary key default gen_random_uuid(),
  employee_id    uuid not null references public.employees(id) on delete restrict,
  title          text not null check (length(btrim(title)) between 1 and 150),
  body           text not null default '' check (length(body) <= 20000),
  note_date      date,
  shift_id       uuid,
  work_group_id  uuid,
  pinned         boolean not null default false,
  archived       boolean not null default false,
  request_id     uuid unique,
  created_at     timestamptz not null default now(),
  updated_at     timestamptz not null default now(),
  foreign key (shift_id, employee_id)      references public.shifts (id, employee_id),
  foreign key (work_group_id, employee_id) references public.work_groups (id, employee_id)
);
create index notes_employee_idx on public.notes (employee_id, updated_at desc);

-- ---------------------------------------------------------------------
-- 8. Export, backup and restore history
-- ---------------------------------------------------------------------
create table public.export_log (
  id           bigint generated always as identity primary key,
  exported_at  timestamptz not null default now(),
  exported_by  uuid references public.employees(id) on delete restrict,
  export_type  text not null check (length(export_type) <= 60),
  format       text not null check (format in ('csv', 'pdf', 'json')),
  filters      jsonb not null default '{}'::jsonb,
  row_count    integer
);

create table public.backup_runs (
  id            uuid primary key default gen_random_uuid(),
  trigger       text not null check (trigger in ('manual', 'auto_change', 'scheduled')),
  status        text not null check (status in ('running', 'succeeded', 'failed', 'skipped')),
  started_at    timestamptz not null default now(),
  finished_at   timestamptz,
  requested_by  uuid references public.employees(id) on delete restrict,
  data_version  bigint,
  file_name     text,
  drive_file_id text,
  size_bytes    bigint,
  sha256        text,
  attempts      integer,
  error         text
);
create unique index backup_runs_one_running on public.backup_runs ((true)) where status = 'running';
create index backup_runs_started_idx on public.backup_runs (started_at desc);

create table public.restore_runs (
  id          uuid primary key default gen_random_uuid(),
  restored_at timestamptz not null default now(),
  restored_by uuid references public.employees(id) on delete restrict,
  source      text not null check (source in ('upload', 'google_drive')),
  file_name   text,
  checksum    text,
  summary     jsonb not null
);

-- Private backup configuration: Google Drive refresh token etc.
-- Lives in the private schema: never readable through the website/API.
create table private.backup_config (
  id                 boolean primary key default true check (id),
  cron_token         text not null default replace(gen_random_uuid()::text || gen_random_uuid()::text, '-', ''),
  function_url       text,
  function_apikey    text,
  drive_refresh_token text,
  drive_account_email text,
  drive_folder_id    text,
  drive_connected_at timestamptz,
  drive_connected_by uuid references public.employees(id) on delete restrict
);
insert into private.backup_config default values;

create table private.drive_oauth_states (
  state        text primary key,
  employee_id  uuid not null references public.employees(id) on delete cascade,
  return_url   text not null,
  expires_at   timestamptz not null
);

create trigger employee_preferences_audit after insert or update or delete on public.employee_preferences for each row execute function private.audit_row_change('employee_id');
create trigger worksites_audit        after insert or update or delete on public.worksites        for each row execute function private.audit_row_change('id');
create trigger work_groups_audit      after insert or update or delete on public.work_groups      for each row execute function private.audit_row_change('id');
create trigger shifts_audit           after insert or update or delete on public.shifts           for each row execute function private.audit_row_change('id');
create trigger wage_rates_audit       after insert or update or delete on public.wage_rates       for each row execute function private.audit_row_change('id');
create trigger reports_audit          after insert or update or delete on public.reports          for each row execute function private.audit_row_change('id');
create trigger report_snapshots_audit after insert or update or delete on public.report_snapshots for each row execute function private.audit_row_change('id');
create trigger payments_audit         after insert or update or delete on public.payments         for each row execute function private.audit_row_change('id');
create trigger corrections_audit      after insert or update or delete on public.correction_requests for each row execute function private.audit_row_change('id');
create trigger shift_revisions_audit  after insert or update or delete on public.shift_revisions  for each row execute function private.audit_row_change('id');
create trigger notes_audit            after insert or update or delete on public.notes            for each row execute function private.audit_row_change('id');
