create trigger restore_runs_audit     after insert or update or delete on public.restore_runs     for each row execute function private.audit_row_change('id');

-- Immutable / append-only records.
create or replace function private.block_changes()
returns trigger language plpgsql set search_path = ''
as $$ begin raise exception '% records cannot be changed or deleted', tg_table_name using errcode = '42501'; end; $$;

create trigger report_snapshots_immutable before update or delete on public.report_snapshots for each row execute function private.block_changes();
create trigger shift_revisions_immutable  before update or delete on public.shift_revisions  for each row execute function private.block_changes();
create trigger restore_runs_immutable     before update or delete on public.restore_runs     for each row execute function private.block_changes();
create trigger export_log_immutable       before update or delete on public.export_log       for each row execute function private.block_changes();
-- Official records are never deleted (retention: at least 4 years; nothing is auto-deleted).
create trigger shifts_no_delete       before delete on public.shifts       for each row execute function private.block_changes();
create trigger reports_no_delete      before delete on public.reports      for each row execute function private.block_changes();
create trigger payments_no_delete     before delete on public.payments     for each row execute function private.block_changes();
create trigger wage_rates_no_delete   before delete on public.wage_rates   for each row execute function private.block_changes();
create trigger work_groups_no_delete  before delete on public.work_groups  for each row execute function private.block_changes();
create trigger notes_no_delete        before delete on public.notes        for each row execute function private.block_changes();
create trigger employees_no_delete    before delete on public.employees    for each row execute function private.block_changes();
create trigger corrections_no_delete  before delete on public.correction_requests for each row execute function private.block_changes();

-- ---------------------------------------------------------------------
-- 10. Row Level Security
-- ---------------------------------------------------------------------
alter table public.employee_preferences enable row level security;
alter table public.worksites            enable row level security;
alter table public.work_groups          enable row level security;
alter table public.shifts               enable row level security;
alter table public.wage_rates           enable row level security;
alter table public.reports              enable row level security;
alter table public.report_snapshots     enable row level security;
alter table public.payments             enable row level security;
alter table public.correction_requests  enable row level security;
alter table public.shift_revisions      enable row level security;
alter table public.notes                enable row level security;
alter table public.export_log           enable row level security;
alter table public.backup_runs          enable row level security;
alter table public.restore_runs         enable row level security;

revoke all on public.employee_preferences, public.worksites, public.work_groups, public.shifts, public.wage_rates,
              public.reports, public.report_snapshots, public.payments, public.correction_requests,
              public.shift_revisions, public.notes, public.export_log, public.backup_runs, public.restore_runs
  from anon, authenticated;
grant select on public.employee_preferences, public.worksites, public.work_groups, public.shifts, public.wage_rates,
                public.reports, public.report_snapshots, public.payments, public.correction_requests,
                public.shift_revisions, public.notes, public.export_log, public.backup_runs, public.restore_runs
  to authenticated;

-- Own rows, or administrator.
create policy employee_preferences_read on public.employee_preferences for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy work_groups_read on public.work_groups for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy shifts_read on public.shifts for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy wage_rates_read on public.wage_rates for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy reports_read on public.reports for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy report_snapshots_read on public.report_snapshots for select to authenticated
  using ((select private.is_admin()) or exists (select 1 from public.reports r where r.id = report_id
                                                 and r.employee_id = (select private.current_employee_id())));
create policy payments_read on public.payments for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy correction_requests_read on public.correction_requests for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
create policy shift_revisions_read on public.shift_revisions for select to authenticated
  using ((select private.is_admin()) or exists (select 1 from public.shifts s where s.id = shift_id
                                                 and s.employee_id = (select private.current_employee_id())));
-- Notes: the employee's own notes; administrators can read all notes (disclosed in the app).
create policy notes_read on public.notes for select to authenticated
  using (employee_id = (select private.current_employee_id()) or (select private.is_admin()));
-- Worksites: admins see all; employees see manual-selection sites and sites they have worked at.
create policy worksites_read on public.worksites for select to authenticated
  using ((select private.is_admin())
         or ((select private.is_active_member()) and (available_for_manual and is_active
              or exists (select 1 from public.work_groups g where g.worksite_id = worksites.id
                         and g.employee_id = (select private.current_employee_id())))));
-- Admin-only history tables (employees can see their own exports).
create policy export_log_read on public.export_log for select to authenticated
  using ((select private.is_admin()) or exported_by = (select private.current_employee_id()));
create policy backup_runs_read  on public.backup_runs  for select to authenticated using ((select private.is_admin()));
create policy restore_runs_read on public.restore_runs for select to authenticated using ((select private.is_admin()));

-- ---------------------------------------------------------------------
-- 11. Read-only views (security_invoker: RLS of the caller applies)
-- ---------------------------------------------------------------------
create view public.shift_details with (security_invoker = true) as
select s.id                         as shift_id,
       s.employee_id,
       e.employee_number,
       e.full_name,
       coalesce(e.display_name, e.full_name) as display_name,
       s.work_group_id,
       g.cycle_number,
       g.status                     as group_status,
       s.worksite_id,
       w.label                      as worksite_label,
       w.street,
       w.locality,
       w.source                     as worksite_source,
       s.clock_in_method,
       s.clock_in_at,
       s.clock_out_at,
       (s.clock_out_at is null)     as is_active,
       (s.clock_in_at at time zone cs.time_zone)::date as work_date,
       s.lunch_minutes,
       s.gross_minutes,
       s.net_minutes,
       r.hourly_rate,
       round(s.net_minutes / 60.0 * r.hourly_rate, 2) as estimated_amount,
       rep.id                       as report_id,
       rep.status                   as report_status,
       rep.payment_status,
       s.needs_review,
       s.review_reason,
       s.source,
       s.clock_in_latitude,
       s.clock_in_longitude,
       s.clock_in_accuracy_m,
       (select count(*) from public.shift_revisions sr where sr.shift_id = s.id) as revision_count,
       cs.time_zone,
       cs.currency_code
from public.shifts s
join public.employees e   on e.id = s.employee_id
join public.work_groups g on g.id = s.work_group_id
join public.worksites w   on w.id = s.worksite_id
cross join public.company_settings cs
left join public.reports rep on rep.work_group_id = s.work_group_id
left join lateral (
  select wr.hourly_rate from public.wage_rates wr
  where wr.employee_id = s.employee_id
    and wr.effective_from <= (s.clock_in_at at time zone cs.time_zone)::date
  order by wr.effective_from desc limit 1) r on true;

create view public.group_summaries with (security_invoker = true) as
select g.id as work_group_id,
       g.employee_id,
       e.employee_number,
       e.full_name,
       coalesce(e.display_name, e.full_name) as display_name,
       g.worksite_id,
       w.label  as worksite_label,
       w.source as worksite_source,
       g.cycle_number,
       g.status,
       g.opened_at,
       g.closed_at,
       count(s.id)                                         as shift_count,
       count(s.id) filter (where s.clock_out_at is null)   as active_count,
       coalesce(sum(s.net_minutes), 0)                     as net_minutes,
       coalesce(sum(s.lunch_minutes) filter (where s.clock_out_at is not null), 0) as lunch_minutes,
       min((s.clock_in_at at time zone cs.time_zone)::date) as first_date,
       max((s.clock_in_at at time zone cs.time_zone)::date) as last_date,
       coalesce(sum(round(s.net_minutes / 60.0 * r.hourly_rate, 2)), 0) as estimated_amount,
       coalesce(bool_or(r.hourly_rate is null and s.clock_out_at is not null), false) as missing_rate,
       rep.id as report_id,
       rep.status as report_status,
       rep.payment_status,
       rep.submitted_at,
       rep.approved_amount,
       rep.amount_paid,
       rep.flagged,
       rep.changed_after_submission,
       cs.currency_code,
       cs.time_zone
from public.work_groups g
join public.employees e on e.id = g.employee_id
join public.worksites w on w.id = g.worksite_id
cross join public.company_settings cs
left join public.shifts s on s.work_group_id = g.id
left join lateral (
  select wr.hourly_rate from public.wage_rates wr
  where wr.employee_id = s.employee_id
    and wr.effective_from <= (s.clock_in_at at time zone cs.time_zone)::date
  order by wr.effective_from desc limit 1) r on true
left join public.reports rep on rep.work_group_id = g.id
group by g.id, e.id, w.id, cs.id, rep.id;

create view public.report_details with (security_invoker = true) as
select r.*,
       e.employee_number,
       e.full_name,
       coalesce(e.display_name, e.full_name) as display_name,
       gs.worksite_id,
       gs.worksite_label,
       gs.worksite_source,
       gs.cycle_number,
       gs.shift_count      as current_shift_count,
       gs.net_minutes      as current_net_minutes,
       gs.estimated_amount as current_estimated_amount,
       coalesce(r.approved_amount, r.snapshot_estimated_amount) as amount_due,
       greatest(coalesce(r.approved_amount, r.snapshot_estimated_amount, 0) - r.amount_paid, 0) as outstanding_amount
from public.reports r
join public.employees e on e.id = r.employee_id
join public.group_summaries gs on gs.work_group_id = r.work_group_id;

create view public.employee_overview with (security_invoker = true) as
select d.*,
       e.display_name,
       e.job_title,
       e.employment_start_date,
       e.employment_end_date,
       e.phone,
       e.residential_address,
       e.date_of_birth,
       e.payroll_id,
       a.shift_id      as active_shift_id,
       a.clock_in_at   as active_since,
       a.worksite_label as active_worksite,
       cr.hourly_rate  as current_rate,
       cr.effective_from as current_rate_from
from public.employee_directory d
join public.employees e on e.id = d.employee_id
left join lateral (
  select s.id as shift_id, s.clock_in_at, w.label as worksite_label
  from public.shifts s join public.worksites w on w.id = s.worksite_id
  where s.employee_id = d.employee_id and s.clock_out_at is null) a on true
left join lateral (
  select wr.hourly_rate, wr.effective_from from public.wage_rates wr
  where wr.employee_id = d.employee_id
    and wr.effective_from <= (now() at time zone (select c.time_zone from public.company_settings c where c.id))::date
  order by wr.effective_from desc limit 1) cr on true;

revoke all on public.shift_details, public.group_summaries, public.report_details, public.employee_overview from anon, authenticated;
grant select on public.shift_details, public.group_summaries, public.report_details, public.employee_overview to authenticated;

-- ---------------------------------------------------------------------
-- 12. Private helpers
-- ---------------------------------------------------------------------
create or replace function private.settings()
returns public.company_settings
language sql stable security definer set search_path = ''
as $$ select * from public.company_settings where id; $$;

create or replace function private.local_date(p_ts timestamptz)
returns date
language sql stable security definer set search_path = ''
as $$ select (p_ts at time zone (select time_zone from public.company_settings where id))::date; $$;

create or replace function private.rate_on(p_employee_id uuid, p_date date)
returns numeric
language sql stable security definer set search_path = ''
as $$
  select hourly_rate from public.wage_rates
  where employee_id = p_employee_id and effective_from <= p_date
  order by effective_from desc limit 1;
$$;

create or replace function private.shift_json(p_shift_id uuid)
returns jsonb
language sql stable security definer set search_path = ''
as $$
  select jsonb_build_object(
    'shift_id', s.id, 'employee_id', s.employee_id, 'work_group_id', s.work_group_id,
    'cycle_number', g.cycle_number, 'worksite_id', w.id, 'worksite_label', w.label,
    'worksite_source', w.source, 'clock_in_method', s.clock_in_method,
    'clock_in_at', s.clock_in_at, 'clock_out_at', s.clock_out_at,
    'lunch_minutes', s.lunch_minutes, 'gross_minutes', s.gross_minutes, 'net_minutes', s.net_minutes,
    'needs_review', s.needs_review, 'review_reason', s.review_reason, 'server_now', now())
  from public.shifts s
  join public.work_groups g on g.id = s.work_group_id
  join public.worksites w on w.id = s.worksite_id
  where s.id = p_shift_id;
$$;

-- Find (or create) the open work group for an employee at a worksite.
create or replace function private.open_group_for(p_employee_id uuid, p_worksite_id uuid)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare v_id uuid;
begin
  select id into v_id from public.work_groups
  where employee_id = p_employee_id and worksite_id = p_worksite_id and status = 'open';
  if found then return v_id; end if;
  insert into public.work_groups (employee_id, worksite_id, cycle_number)
  values (p_employee_id, p_worksite_id,
          coalesce((select max(cycle_number) from public.work_groups
                    where employee_id = p_employee_id and worksite_id = p_worksite_id), 0) + 1)
  on conflict (employee_id, worksite_id) where status = 'open' do nothing
  returning id into v_id;
  if v_id is null then
    select id into v_id from public.work_groups
    where employee_id = p_employee_id and worksite_id = p_worksite_id and status = 'open';
  end if;
  return v_id;
end;
$$;

-- Current totals of a work group, using the rate in effect on each shift's date.
create or replace function private.group_totals(p_group_id uuid)
returns jsonb
language sql stable security definer set search_path = ''
as $$
  select jsonb_build_object(
    'shift_count',      count(*),
    'net_minutes',      coalesce(sum(s.net_minutes), 0),
    'gross_minutes',    coalesce(sum(s.gross_minutes), 0),
    'lunch_minutes',    coalesce(sum(s.lunch_minutes), 0),
    'estimated_amount', coalesce(sum(round(s.net_minutes / 60.0 * private.rate_on(s.employee_id, private.local_date(s.clock_in_at)), 2)), 0),
    'missing_rate',     coalesce(bool_or(private.rate_on(s.employee_id, private.local_date(s.clock_in_at)) is null), false),
    'period_start',     min(private.local_date(s.clock_in_at)),
    'period_end',       max(private.local_date(s.clock_in_at)))
  from public.shifts s
  where s.work_group_id = p_group_id and s.clock_out_at is not null;
$$;

create or replace function private.build_report_snapshot(p_group_id uuid, p_note text)
returns jsonb
language plpgsql stable security definer set search_path = ''
as $$
declare
  v_cs     public.company_settings := private.settings();
  v_group  public.work_groups;
  v_totals jsonb := private.group_totals(p_group_id);
begin
  select * into v_group from public.work_groups where id = p_group_id;
  return jsonb_build_object(
    'schema', 'report-snapshot/1',
    'generated_at', now(),
    'time_zone', v_cs.time_zone,
    'currency_code', v_cs.currency_code,
    'company_name', v_cs.company_name,
    'employee', (select jsonb_build_object('employee_id', e.id, 'employee_number', e.employee_number,
                          'full_name', e.full_name, 'display_name', coalesce(e.display_name, e.full_name),
                          'email', g.google_email)
                 from public.employees e
                 left join public.employee_google_accounts g on g.employee_id = e.id and g.revoked_at is null
                 where e.id = v_group.employee_id),
    'worksite', (select jsonb_build_object('worksite_id', w.id, 'label', w.label, 'street', w.street,
                          'locality', w.locality, 'source', w.source)
                 from public.worksites w where w.id = v_group.worksite_id),
    'work_group', jsonb_build_object('work_group_id', v_group.id, 'cycle_number', v_group.cycle_number),
    'period', jsonb_build_object('start', v_totals ->> 'period_start', 'end', v_totals ->> 'period_end'),
    'shifts', coalesce((select jsonb_agg(jsonb_build_object(
                  'shift_id', s.id,
                  'work_date', private.local_date(s.clock_in_at),
                  'clock_in_at', s.clock_in_at,
                  'clock_out_at', s.clock_out_at,
                  'clock_in_local', to_char(s.clock_in_at at time zone v_cs.time_zone, 'YYYY-MM-DD HH24:MI'),
                  'clock_out_local', to_char(s.clock_out_at at time zone v_cs.time_zone, 'YYYY-MM-DD HH24:MI'),
                  'lunch_minutes', s.lunch_minutes,
                  'gross_minutes', s.gross_minutes,
                  'net_minutes', s.net_minutes,
                  'hourly_rate', private.rate_on(s.employee_id, private.local_date(s.clock_in_at)),
                  'estimated_amount', round(s.net_minutes / 60.0 * private.rate_on(s.employee_id, private.local_date(s.clock_in_at)), 2),
                  'clock_in_method', s.clock_in_method,
                  'source', s.source) order by s.clock_in_at)
                from public.shifts s where s.work_group_id = p_group_id and s.clock_out_at is not null), '[]'::jsonb),
    'totals', v_totals - 'period_start' - 'period_end',
    'notes', coalesce((select jsonb_agg(jsonb_build_object('note_id', n.id, 'title', n.title, 'body', n.body,
                                 'note_date', n.note_date, 'updated_at', n.updated_at) order by n.created_at)
                from public.notes n
                where n.employee_id = v_group.employee_id and not n.archived
                  and (n.work_group_id = p_group_id
                       or n.shift_id in (select id from public.shifts where work_group_id = p_group_id))), '[]'::jsonb),
    'employee_note', nullif(btrim(p_note), ''),
    'estimate_notice', 'Estimated earnings = net hours x hourly rate in effect on each shift date. Not an official payroll result; no deductions or overtime premiums applied.'
  );
end;
$$;

create or replace function private.recompute_report_payment(p_report_id uuid)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_paid numeric; v_due numeric;
begin
  select coalesce(sum(amount), 0) into v_paid from public.payments where report_id = p_report_id and voided_at is null;
  select coalesce(approved_amount, snapshot_estimated_amount) into v_due from public.reports where id = p_report_id;
  update public.reports
     set amount_paid = v_paid,
         payment_status = case when v_paid <= 0 then 'unpaid'
                               when v_due is not null and v_paid >= v_due then 'paid'
                               else 'partially_paid' end
   where id = p_report_id;
end;
$$;

create or replace function private.flag_reports_changed(p_group_id uuid)
returns void
language sql volatile security definer set search_path = ''
as $$
  update public.reports set changed_after_submission = true
  where work_group_id = p_group_id and not changed_after_submission;
$$;

create or replace function private.require_reason(p_reason text)
returns text
language plpgsql immutable set search_path = ''
as $$
begin
  if p_reason is null or length(btrim(p_reason)) < 3 then
    raise exception 'A reason (at least 3 characters) is required for this change' using errcode = '22023';
  end if;
  return btrim(p_reason);
end;
$$;

-- ---------------------------------------------------------------------
-- 13. Part 1 refinement: unapproved users' repeated checks no longer flood the audit log
-- ---------------------------------------------------------------------
create or replace function public.resolve_my_access()
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_uid       uuid := auth.uid();
  v_email     text;
  v_sub       text;
  v_verified  boolean;
  v_name      text;
  v_acct      public.employee_google_accounts%rowtype;
  v_access    public.employee_access%rowtype;
  v_emp       public.employees%rowtype;
  v_company   text;
  v_req       text;
begin
  if v_uid is null then
    raise exception 'Not signed in' using errcode = '42501';
  end if;
  if not private.session_is_live() then
    return jsonb_build_object('state', 'session_invalid');
  end if;

  select lower(i.identity_data ->> 'email'), i.provider_id,
         coalesce((i.identity_data ->> 'email_verified')::boolean, false),
         left(coalesce(i.identity_data ->> 'full_name', i.identity_data ->> 'name'), 120)
    into v_email, v_sub, v_verified, v_name
  from auth.identities i
  where i.user_id = v_uid and i.provider = 'google'
  order by i.created_at nulls last
  limit 1;

  if v_sub is null then
    return jsonb_build_object('state', 'not_approved', 'email', auth.jwt() ->> 'email',
                              'reason', 'Please sign in with Google.');
  end if;

  select * into v_acct from public.employee_google_accounts
  where auth_user_id = v_uid and revoked_at is null;

  if not found then
    select * into v_acct from public.employee_google_accounts
    where google_email = v_email and revoked_at is null and auth_user_id is null
    for update;

    if found and v_verified and (v_acct.google_subject is null or v_acct.google_subject = v_sub) then
      perform set_config('app.audit_action', 'link_google_account', true);
      update public.employee_google_accounts
         set auth_user_id = v_uid, google_subject = v_sub, linked_at = now()
       where id = v_acct.id
      returning * into v_acct;
      update public.access_requests
         set status = 'approved', resolved_at = now(), employee_id = v_acct.employee_id
       where auth_user_id = v_uid and status = 'pending';
    else
      perform set_config('app.audit_action', 'access_request', true);
      insert into public.access_requests (auth_user_id, google_email, google_subject, display_name)
      values (v_uid, coalesce(v_email, ''), v_sub, v_name)
      on conflict (auth_user_id) do update
        set last_seen_at = now(),
            status      = case when public.access_requests.status = 'approved' then 'pending' else public.access_requests.status end,
            resolved_at = case when public.access_requests.status = 'approved' then null else public.access_requests.resolved_at end
        where public.access_requests.status = 'approved'
           or public.access_requests.last_seen_at < now() - interval '1 hour';
      select status into v_req from public.access_requests where auth_user_id = v_uid;
      return jsonb_build_object('state', 'not_approved', 'email', v_email, 'request_status', v_req);
    end if;
  end if;

  select * into v_access from public.employee_access where employee_id = v_acct.employee_id;
  select * into v_emp    from public.employees       where id          = v_acct.employee_id;

  if v_access.status <> 'active' then
    return jsonb_build_object('state', v_access.status::text, 'email', v_email);
  end if;

  select company_name into v_company from public.company_settings where id;

  return jsonb_build_object(
    'state', 'active', 'email', v_email, 'employee_id', v_emp.id,
    'employee_number', v_emp.employee_number, 'full_name', v_emp.full_name,
    'preferred_name', v_emp.preferred_name, 'display_name', v_emp.display_name,
    'role', v_access.role::text, 'company_name', v_company);
end;
$$;

-- ---------------------------------------------------------------------
-- 14. Employee functions
-- ---------------------------------------------------------------------
create or replace function public.get_my_dashboard()
returns jsonb
language plpgsql stable security definer set search_path = ''
as $$
declare
  v_me    uuid := private.current_employee_id();
  v_cs    public.company_settings := private.settings();
  v_today date;
  v_active jsonb;
  v_group uuid;
begin
  if v_me is null then
    raise exception 'Access denied' using errcode = '42501';
  end if;
  v_today := (now() at time zone v_cs.time_zone)::date;

  select private.shift_json(s.id), s.work_group_id into v_active, v_group
  from public.shifts s where s.employee_id = v_me and s.clock_out_at is null;

  if v_group is null then  -- otherwise: most recently used open group
    select g.id into v_group from public.work_groups g
    where g.employee_id = v_me and g.status = 'open'
    order by (select max(s.clock_in_at) from public.shifts s where s.work_group_id = g.id) desc nulls last
    limit 1;
  end if;

  return jsonb_build_object(
    'server_now', now(),
    'today', v_today,
    'profile', (select jsonb_build_object(
                  'employee_id', e.id, 'employee_number', e.employee_number, 'full_name', e.full_name,
                  'display_name', e.display_name, 'preferred_name', e.preferred_name, 'job_title', e.job_title,
                  'email', g.google_email, 'role', a.role, 'status', a.status,
                  'employment_start_date', e.employment_start_date)
                from public.employees e
                join public.employee_access a on a.employee_id = e.id
                left join public.employee_google_accounts g on g.employee_id = e.id and g.revoked_at is null
                where e.id = v_me),
    'preferences', coalesce((select to_jsonb(p) - 'employee_id' - 'updated_at' from public.employee_preferences p where p.employee_id = v_me),
                            '{"theme":"system","clock_format":"company","show_seconds":true,"reduce_motion":false}'::jsonb),
    'settings', to_jsonb(v_cs) - 'default_hourly_rate' - 'backups_enabled' - 'backup_after_change_minutes' - 'backup_daily_hour' - 'id',
    'active_shift', v_active,
    'today_net_minutes', (select coalesce(sum(net_minutes), 0) from public.shifts
                          where employee_id = v_me and clock_out_at is not null
                            and (clock_in_at at time zone v_cs.time_zone)::date = v_today),
    'current_rate', private.rate_on(v_me, v_today),
    'current_group', case when v_group is null then null else
                       (select jsonb_build_object('work_group_id', g.id, 'worksite_label', w.label, 'cycle_number', g.cycle_number,
                                                  'status', g.status) || private.group_totals(g.id)
                        from public.work_groups g join public.worksites w on w.id = g.worksite_id where g.id = v_group) end,
    'open_groups', (select count(*) from public.work_groups where employee_id = v_me and status in ('open', 'returned')),
    'reports', (select jsonb_build_object(
                  'submitted',    count(*) filter (where status in ('submitted', 'under_review')),
                  'returned',     count(*) filter (where status = 'returned'),
                  'approved',     count(*) filter (where status = 'approved'),
                  'latest_status', (select status from public.reports where employee_id = v_me order by submitted_at desc limit 1),
                  'latest_payment_status', (select payment_status from public.reports where employee_id = v_me order by submitted_at desc limit 1))
                from public.reports where employee_id = v_me),
    'payments', jsonb_build_object(
                  'outstanding', (select coalesce(sum(greatest(coalesce(approved_amount, 0) - amount_paid, 0)), 0)
                                  from public.reports where employee_id = v_me and status = 'approved'),
                  'last_payment', (select jsonb_build_object('amount', amount, 'paid_on', paid_on)
                                   from public.payments where employee_id = v_me and voided_at is null
                                   order by paid_on desc, created_at desc limit 1))
  );
end;
$$;

create or replace function public.update_my_profile_v2(p_display_name text, p_preferred_name text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_me uuid := private.current_employee_id();
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  perform set_config('app.audit_action', 'update_my_profile', true);
  update public.employees
     set display_name = nullif(btrim(p_display_name), ''),
         preferred_name = nullif(btrim(p_preferred_name), '')
   where id = v_me;
end;
$$;

create or replace function public.update_my_preferences(p_theme text, p_clock_format text, p_show_seconds boolean, p_reduce_motion boolean)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_me uuid := private.current_employee_id();
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  perform set_config('app.audit_action', 'update_my_preferences', true);
  insert into public.employee_preferences (employee_id, theme, clock_format, show_seconds, reduce_motion)
  values (v_me, coalesce(p_theme, 'system'), coalesce(p_clock_format, 'company'), coalesce(p_show_seconds, true), coalesce(p_reduce_motion, false))
  on conflict (employee_id) do update
    set theme = excluded.theme, clock_format = excluded.clock_format,
        show_seconds = excluded.show_seconds, reduce_motion = excluded.reduce_motion;
end;
$$;

-- CLOCK IN. Official time = database clock. Location is used once, for the worksite only.
create or replace function public.clock_in(
  p_request_id   uuid,
  p_method       text,
  p_worksite_id  uuid default null,
  p_location     jsonb default null,
  p_custom_label text default null
)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_me    uuid := private.current_employee_id();
  v_cs    public.company_settings := private.settings();
  v_shift public.shifts;
  v_site  uuid;
  v_group uuid;
  v_street text; v_loc text; v_key text; v_label text;
  v_lat numeric; v_lon numeric; v_acc numeric;
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  if p_request_id is null then raise exception 'Missing request id' using errcode = '22023'; end if;

  -- One clock action at a time per employee (double taps, two devices).
  perform pg_advisory_xact_lock(hashtextextended('timeclock:' || v_me::text, 0));

  -- Same request repeated (e.g. network dropped after saving): return the saved shift.
  select * into v_shift from public.shifts where clock_in_request_id = p_request_id;
  if found then
    if v_shift.employee_id <> v_me then raise exception 'Access denied' using errcode = '42501'; end if;
    return private.shift_json(v_shift.id) || jsonb_build_object('repeated_request', true);
  end if;

  if exists (select 1 from public.shifts where employee_id = v_me and clock_out_at is null) then
    raise exception 'You are already clocked in. Clock out first.' using errcode = 'P0001', hint = 'ALREADY_CLOCKED_IN';
  end if;

  if p_method = 'device' then
    if v_cs.location_mode = 'manual_only' then
      raise exception 'Location clock-in is turned off. Please choose a worksite.' using errcode = '22023';
    end if;
    begin
      v_lat := (p_location ->> 'latitude')::numeric;
      v_lon := (p_location ->> 'longitude')::numeric;
      v_acc := nullif(p_location ->> 'accuracy', '')::numeric;
    exception when others then
      raise exception 'Invalid location data' using errcode = '22023';
    end;
    if v_lat is null or v_lon is null or v_lat not between -90 and 90 or v_lon not between -180 and 180 then
      raise exception 'Invalid location data' using errcode = '22023';
    end if;
    v_street := nullif(btrim(regexp_replace(coalesce(p_location ->> 'street', ''), '\s+', ' ', 'g')), '');
    v_loc    := nullif(btrim(regexp_replace(coalesce(p_location ->> 'locality', ''), '\s+', ' ', 'g')), '');
    if v_street is null then
      raise exception 'The street could not be determined from your location.' using errcode = '22023', hint = 'NO_STREET';
    end if;
    if length(v_street) > 120 or length(coalesce(v_loc, '')) > 120 then
      raise exception 'Location text is too long' using errcode = '22023';
    end if;
    v_key := 'street:' || lower(v_street)
             || case when v_cs.grouping_mode = 'street_locality' then '|' || lower(coalesce(v_loc, '')) else '' end;
    v_label := v_street || coalesce(', ' || v_loc, '');
    insert into public.worksites (site_key, label, street, locality, region, postal_code, country, latitude, longitude, source, created_by)
    values (v_key, v_label, v_street, v_loc, left(p_location ->> 'region', 80), left(p_location ->> 'postal_code', 20),
            left(p_location ->> 'country', 80), round(v_lat, 6), round(v_lon, 6), 'device', v_me)
    on conflict (site_key) do nothing;
    select id into v_site from public.worksites where site_key = v_key and is_active;
    if v_site is null then
      raise exception 'This worksite has been deactivated by your administrator.' using errcode = '22023';
    end if;

  elsif p_method = 'manual' then
    if v_cs.location_mode = 'device_only' then
      raise exception 'Manual worksite selection is turned off. Please allow location access.' using errcode = '22023';
    end if;
    if p_worksite_id is not null then
      select id into v_site from public.worksites where id = p_worksite_id and is_active and available_for_manual;
      if v_site is null then
        raise exception 'That worksite is not available for manual selection.' using errcode = '22023';
      end if;
    elsif v_cs.allow_custom_manual_sites and length(btrim(coalesce(p_custom_label, ''))) between 2 and 120 then
      v_label := btrim(regexp_replace(p_custom_label, '\s+', ' ', 'g'));
      v_key := 'manual:' || lower(v_label);
      insert into public.worksites (site_key, label, source, created_by)
      values (v_key, v_label, 'employee_manual', v_me)
      on conflict (site_key) do nothing;
      select id into v_site from public.worksites where site_key = v_key and is_active;
      if v_site is null then
        raise exception 'This worksite has been deactivated by your administrator.' using errcode = '22023';
      end if;
    else
      raise exception 'Please choose a worksite.' using errcode = '22023';
    end if;
  else
    raise exception 'Unknown clock-in method' using errcode = '22023';
  end if;

  perform set_config('app.audit_action', 'clock_in', true);
  v_group := private.open_group_for(v_me, v_site);
  insert into public.shifts (employee_id, work_group_id, worksite_id, clock_in_method,
                             clock_in_latitude, clock_in_longitude, clock_in_accuracy_m, clock_in_request_id, source)
  values (v_me, v_group, v_site, case when p_method = 'device' then 'device' else 'manual' end,
          round(v_lat, 6), round(v_lon, 6), v_acc, p_request_id, 'employee')
  returning * into v_shift;
  return private.shift_json(v_shift.id);
exception
  when exclusion_violation then
    raise exception 'This would overlap another recorded shift. Contact your administrator.' using errcode = '23P01';
end;
$$;

-- CLOCK OUT with lunch deduction.
create or replace function public.clock_out(p_request_id uuid, p_lunch_minutes integer)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_me    uuid := private.current_employee_id();
  v_cs    public.company_settings := private.settings();
  v_shift public.shifts;
  v_now   timestamptz := now();
  v_gross numeric;
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  if p_request_id is null then raise exception 'Missing request id' using errcode = '22023'; end if;
  perform pg_advisory_xact_lock(hashtextextended('timeclock:' || v_me::text, 0));

  select * into v_shift from public.shifts where clock_out_request_id = p_request_id;
  if found then
    if v_shift.employee_id <> v_me then raise exception 'Access denied' using errcode = '42501'; end if;
    return private.shift_json(v_shift.id) || jsonb_build_object('repeated_request', true);
  end if;

  select * into v_shift from public.shifts where employee_id = v_me and clock_out_at is null for update;
  if not found then
    raise exception 'You are not clocked in.' using errcode = 'P0001', hint = 'NOT_CLOCKED_IN';
  end if;

  v_gross := extract(epoch from (v_now - v_shift.clock_in_at)) / 60.0;
  if p_lunch_minutes is null or p_lunch_minutes < 0 or p_lunch_minutes > v_cs.max_lunch_minutes then
    raise exception 'Lunch must be between 0 and % minutes.', v_cs.max_lunch_minutes using errcode = '22023';
  end if;
  if p_lunch_minutes > 0 and p_lunch_minutes >= v_gross then
    raise exception 'The lunch break cannot be as long as the whole shift (% minutes worked).', floor(v_gross) using errcode = '22023';
  end if;

  perform set_config('app.audit_action', 'clock_out', true);
  update public.shifts
     set clock_out_at = v_now,
         lunch_minutes = p_lunch_minutes,
         clock_out_request_id = p_request_id,
         needs_review = needs_review or v_gross > v_cs.max_shift_hours * 60,
         review_reason = case when v_gross > v_cs.max_shift_hours * 60
                              then 'Shift longer than ' || v_cs.max_shift_hours || ' hours' else review_reason end
   where id = v_shift.id;
  return private.shift_json(v_shift.id);
end;
$$;

-- SUBMIT a work group as a report (immutable snapshot; closes the cycle).
create or replace function public.submit_report(p_work_group_id uuid, p_request_id uuid, p_note text default null)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_me      uuid := private.current_employee_id();
  v_cs      public.company_settings := private.settings();
  v_group   public.work_groups;
  v_report  public.reports;
  v_snap    jsonb;
  v_version integer;
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  if p_request_id is null then raise exception 'Missing request id' using errcode = '22023'; end if;
  perform pg_advisory_xact_lock(hashtextextended('timeclock:' || v_me::text, 0));

  select * into v_report from public.reports where submit_request_id = p_request_id;
  if found then
    if v_report.employee_id <> v_me then raise exception 'Access denied' using errcode = '42501'; end if;
    return jsonb_build_object('report_id', v_report.id, 'status', v_report.status, 'repeated_request', true);
  end if;

  select * into v_group from public.work_groups where id = p_work_group_id for update;
  if not found or v_group.employee_id <> v_me then
    raise exception 'Work group not found' using errcode = 'P0002';
  end if;
  if v_group.status not in ('open', 'returned') then
    raise exception 'This work group has already been submitted.' using errcode = 'P0001', hint = 'ALREADY_SUBMITTED';
  end if;
  if exists (select 1 from public.shifts where work_group_id = v_group.id and clock_out_at is null) then
    raise exception 'Clock out before submitting this work group.' using errcode = 'P0001', hint = 'ACTIVE_SHIFT';
  end if;
  if not exists (select 1 from public.shifts where work_group_id = v_group.id and clock_out_at is not null) then
    raise exception 'There are no completed shifts to submit.' using errcode = 'P0001';
  end if;
  if p_note is not null and length(p_note) > 2000 then
    raise exception 'Note is too long (2000 characters max).' using errcode = '22023';
  end if;

  perform set_config('app.audit_action', 'submit_report', true);
  v_snap := private.build_report_snapshot(v_group.id, p_note);

  select * into v_report from public.reports where work_group_id = v_group.id for update;
  if found then   -- resubmission after "Returned for review"
    update public.reports
       set status = 'submitted', submitted_at = now(), submitted_by = v_me, submit_request_id = p_request_id,
           submission_count = submission_count + 1, employee_note = nullif(btrim(p_note), ''),
           period_start = (v_snap #>> '{period,start}')::date, period_end = (v_snap #>> '{period,end}')::date,
           snapshot_net_minutes = (v_snap #>> '{totals,net_minutes}')::numeric,
           snapshot_estimated_amount = (v_snap #>> '{totals,estimated_amount}')::numeric,
           changed_after_submission = false
     where id = v_report.id
    returning * into v_report;
  else
    insert into public.reports (employee_id, work_group_id, status, submitted_by, submit_request_id, employee_note,
                                period_start, period_end, snapshot_net_minutes, snapshot_estimated_amount, currency_code)
    values (v_me, v_group.id, 'submitted', v_me, p_request_id, nullif(btrim(p_note), ''),
            (v_snap #>> '{period,start}')::date, (v_snap #>> '{period,end}')::date,
            (v_snap #>> '{totals,net_minutes}')::numeric, (v_snap #>> '{totals,estimated_amount}')::numeric, v_cs.currency_code)
    returning * into v_report;
  end if;
  v_version := v_report.submission_count;
  v_snap := v_snap || jsonb_build_object('report_id', v_report.id, 'version', v_version, 'submitted_at', v_report.submitted_at);
  insert into public.report_snapshots (report_id, version, snapshot, sha256, created_by)
  values (v_report.id, v_version, v_snap, encode(sha256(convert_to(v_snap::text, 'UTF8')), 'hex'), v_me);

  update public.work_groups set status = 'submitted', closed_at = now() where id = v_group.id;

  return jsonb_build_object('report_id', v_report.id, 'status', v_report.status, 'version', v_version,
                            'net_minutes', v_report.snapshot_net_minutes, 'estimated_amount', v_report.snapshot_estimated_amount);
end;
$$;

create or replace function public.request_correction(
  p_request_id     uuid,
  p_message        text,
  p_shift_id       uuid default null,
  p_work_group_id  uuid default null,
  p_report_id      uuid default null,
  p_proposed_in    timestamp default null,   -- company-local time
  p_proposed_out   timestamp default null,
  p_proposed_lunch integer default null
)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_me uuid := private.current_employee_id();
  v_tz text := (private.settings()).time_zone;
  v_id uuid;
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  select id into v_id from public.correction_requests where request_id = p_request_id and employee_id = v_me;
  if found then return v_id; end if;
  if p_shift_id is not null and not exists (select 1 from public.shifts where id = p_shift_id and employee_id = v_me) then
    raise exception 'Shift not found' using errcode = 'P0002';
  end if;
  if p_work_group_id is not null and not exists (select 1 from public.work_groups where id = p_work_group_id and employee_id = v_me) then
    raise exception 'Work group not found' using errcode = 'P0002';
  end if;
  if p_report_id is not null and not exists (select 1 from public.reports where id = p_report_id and employee_id = v_me) then
    raise exception 'Report not found' using errcode = 'P0002';
  end if;
  perform set_config('app.audit_action', 'request_correction', true);
  insert into public.correction_requests (employee_id, shift_id, work_group_id, report_id, message,
                                          proposed_clock_in_at, proposed_clock_out_at, proposed_lunch_minutes, request_id)
  values (v_me, p_shift_id, p_work_group_id, p_report_id, btrim(p_message),
          p_proposed_in at time zone v_tz, p_proposed_out at time zone v_tz, p_proposed_lunch, p_request_id)
  returning id into v_id;
  return v_id;
end;
$$;

create or replace function public.save_note(
  p_note_id       uuid,
  p_request_id    uuid,
  p_title         text,
  p_body          text,
  p_note_date     date default null,
  p_shift_id      uuid default null,
  p_work_group_id uuid default null,
  p_pinned        boolean default false,
  p_archived      boolean default false
)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_me   uuid := private.current_employee_id();
  v_days integer := (private.settings()).notes_employee_can_edit_days;
  v_note public.notes;
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  if p_shift_id is not null and not exists (select 1 from public.shifts where id = p_shift_id and employee_id = v_me) then
    raise exception 'Shift not found' using errcode = 'P0002';
  end if;
  if p_work_group_id is not null and not exists (select 1 from public.work_groups where id = p_work_group_id and employee_id = v_me) then
    raise exception 'Work group not found' using errcode = 'P0002';
  end if;
  perform set_config('app.audit_action', 'save_note', true);
  if p_note_id is null then
    select * into v_note from public.notes where request_id = p_request_id and employee_id = v_me;
    if found then return v_note.id; end if;
    insert into public.notes (employee_id, title, body, note_date, shift_id, work_group_id, pinned, archived, request_id)
    values (v_me, btrim(p_title), coalesce(p_body, ''), p_note_date, p_shift_id, p_work_group_id,
            coalesce(p_pinned, false), coalesce(p_archived, false), p_request_id)
    returning * into v_note;
    return v_note.id;
  end if;
  select * into v_note from public.notes where id = p_note_id and employee_id = v_me for update;
  if not found then raise exception 'Note not found' using errcode = 'P0002'; end if;
  if v_days is not null and v_note.created_at < now() - make_interval(days => v_days) then
    raise exception 'This note is older than % days and can no longer be edited (company retention policy).', v_days using errcode = '42501';
  end if;
  update public.notes
     set title = btrim(p_title), body = coalesce(p_body, ''), note_date = p_note_date, shift_id = p_shift_id,
         work_group_id = p_work_group_id, pinned = coalesce(p_pinned, false), archived = coalesce(p_archived, false)
   where id = v_note.id;
  return v_note.id;
end;
$$;

create or replace function public.log_export(p_export_type text, p_format text, p_filters jsonb, p_row_count integer)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_me uuid := private.current_employee_id();
begin
  if v_me is null then raise exception 'Access denied' using errcode = '42501'; end if;
  if not private.is_admin() and p_export_type not like 'my\_%' then
    raise exception 'Administrator access required' using errcode = '42501';
  end if;
  insert into public.export_log (exported_by, export_type, format, filters, row_count)
  values (v_me, left(p_export_type, 60), p_format, coalesce(p_filters, '{}'::jsonb), p_row_count);
end;
$$;

-- Daily hours with configurable overtime split (estimates). Runs with the CALLER's
-- permissions, so employees only ever get their own days.
create or replace function public.daily_hours(p_from date, p_to date, p_employee_id uuid default null)
returns table (
  employee_id uuid, employee_number integer, full_name text, work_date date, week_start date,
  shift_count bigint, worksites text, first_clock_in timestamptz, last_clock_out timestamptz,
  lunch_minutes bigint, net_minutes numeric, regular_minutes numeric, overtime_minutes numeric,
  double_time_minutes numeric, hourly_rate numeric, estimated_amount numeric, missing_rate boolean
)
language sql stable security invoker set search_path = ''
as $$
  with cs as (select * from public.company_settings where id),
  d as (
    select sd.employee_id, sd.employee_number, sd.full_name, sd.work_date,
           count(*) as shift_count, string_agg(distinct sd.worksite_label, '; ') as worksites,
           min(sd.clock_in_at) as first_in, max(sd.clock_out_at) as last_out,
           sum(sd.lunch_minutes)::bigint as lunch, sum(sd.net_minutes) as net,
           max(sd.hourly_rate) as rate, bool_or(sd.hourly_rate is null) as missing
    from public.shift_details sd
    where not sd.is_active
      and sd.work_date between p_from - 6 and p_to
      and (p_employee_id is null or sd.employee_id = p_employee_id)
    group by sd.employee_id, sd.employee_number, sd.full_name, sd.work_date),
  t as (
    select d.*, cs.overtime_enabled as oe, cs.daily_ot_after_hours * 60 as dot, cs.daily_dt_after_hours * 60 as ddt,
           cs.weekly_ot_after_hours * 60 as wot, cs.ot_multiplier as om, cs.dt_multiplier as dm,
           d.work_date - ((extract(dow from d.work_date)::int - cs.week_starts_on + 7) % 7) as wk
    from d cross join cs),
  u as (
    select t.*,
           case when oe then least(net, dot) else net end                    as reg0,
           case when oe then greatest(0, least(net, ddt) - dot) else 0 end   as ot0,
           case when oe then greatest(0, net - ddt) else 0 end               as dt0
    from t),
  w as (
    select u.*, sum(reg0) over (partition by u.employee_id, wk order by work_date) as cum from u),
  f as (
    select w.*, case when oe then greatest(0, cum - wot) - greatest(0, cum - reg0 - wot) else 0 end as wex from w)
  select f.employee_id, f.employee_number, f.full_name, f.work_date, f.wk, f.shift_count, f.worksites,
         f.first_in, f.last_out, f.lunch, f.net,
         f.reg0 - f.wex, f.ot0 + f.wex, f.dt0, f.rate,
         round(((f.reg0 - f.wex) * coalesce(f.rate, 0) + (f.ot0 + f.wex) * coalesce(f.rate, 0) * f.om
                + f.dt0 * coalesce(f.rate, 0) * f.dm) / 60.0, 2),
         f.missing
  from f
  where f.work_date between p_from and p_to
  order by f.employee_number, f.work_date;
$$;

create or replace function public.pay_periods(p_from date, p_to date)
returns table (period_start date, period_end date)
language plpgsql stable security invoker set search_path = ''
as $$
declare
  v_type text; v_anchor date; v_len integer; v_start date; v_m date;
begin
  select pay_period_type, pay_period_anchor into v_type, v_anchor from public.company_settings where id;
  if v_type is null then return; end if;
  if p_to < p_from or p_to - p_from > 3700 then raise exception 'Invalid date range' using errcode = '22023'; end if;
  if v_type in ('weekly', 'biweekly') then
    v_len := case when v_type = 'weekly' then 7 else 14 end;
    v_start := v_anchor + (floor((p_from - v_anchor)::numeric / v_len)::integer * v_len);
    while v_start <= p_to loop
      period_start := v_start; period_end := v_start + v_len - 1; return next;
      v_start := v_start + v_len;
    end loop;
  else
    v_m := date_trunc('month', p_from)::date;
    while v_m <= p_to loop
      if v_type = 'monthly' then
        period_start := v_m; period_end := (v_m + interval '1 month')::date - 1;
        if period_end >= p_from then return next; end if;
      else
        period_start := v_m; period_end := v_m + 14;
        if period_end >= p_from and period_start <= p_to then return next; end if;
        period_start := v_m + 15; period_end := (v_m + interval '1 month')::date - 1;
        if period_end >= p_from and period_start <= p_to then return next; end if;
      end if;
      v_m := (v_m + interval '1 month')::date;
    end loop;
  end if;
end;
$$;

-- ---------------------------------------------------------------------
-- 15. Administrator functions
-- ---------------------------------------------------------------------
create or replace function public.admin_update_employee_details(p_employee_id uuid, p jsonb)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin uuid := private.require_admin();
  v_key text;
  v_allowed text[] := array['full_name', 'display_name', 'preferred_name', 'job_title', 'employment_start_date',
                            'employment_end_date', 'phone', 'residential_address', 'date_of_birth', 'payroll_id'];
begin
  for v_key in select jsonb_object_keys(p) loop
    if not v_key = any (v_allowed) then
      raise exception 'Unknown field: %', v_key using errcode = '22023';
    end if;
  end loop;
  perform set_config('app.audit_action', 'admin_update_employee', true);
  update public.employees set
    full_name             = case when p ? 'full_name' then btrim(p ->> 'full_name') else full_name end,
    display_name          = case when p ? 'display_name' then nullif(btrim(p ->> 'display_name'), '') else display_name end,
    preferred_name        = case when p ? 'preferred_name' then nullif(btrim(p ->> 'preferred_name'), '') else preferred_name end,
    job_title             = case when p ? 'job_title' then nullif(btrim(p ->> 'job_title'), '') else job_title end,
    employment_start_date = case when p ? 'employment_start_date' then nullif(p ->> 'employment_start_date', '')::date else employment_start_date end,
    employment_end_date   = case when p ? 'employment_end_date' then nullif(p ->> 'employment_end_date', '')::date else employment_end_date end,
    phone                 = case when p ? 'phone' then nullif(btrim(p ->> 'phone'), '') else phone end,
    residential_address   = case when p ? 'residential_address' then nullif(btrim(p ->> 'residential_address'), '') else residential_address end,
    date_of_birth         = case when p ? 'date_of_birth' then nullif(p ->> 'date_of_birth', '')::date else date_of_birth end,
    payroll_id            = case when p ? 'payroll_id' then nullif(btrim(p ->> 'payroll_id'), '') else payroll_id end
  where id = p_employee_id;
  if not found then raise exception 'Employee not found' using errcode = 'P0002'; end if;
end;
$$;

create or replace function public.admin_set_wage_rate(p_employee_id uuid, p_hourly_rate numeric, p_effective_from date, p_note text default null)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin(); v_id uuid;
begin
  if not exists (select 1 from public.employees where id = p_employee_id) then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
  if p_hourly_rate is null or p_hourly_rate < 0 or p_effective_from is null then
    raise exception 'Enter a valid rate and effective date' using errcode = '22023';
  end if;
  perform set_config('app.audit_action', 'admin_set_wage_rate', true);
  insert into public.wage_rates (employee_id, hourly_rate, effective_from, note, created_by)
  values (p_employee_id, round(p_hourly_rate, 2), p_effective_from, nullif(btrim(p_note), ''), v_admin)
  on conflict (employee_id, effective_from) do update
    set hourly_rate = excluded.hourly_rate, note = excluded.note
  returning id into v_id;
  return v_id;
end;
$$;

create or replace function public.admin_upsert_worksite(
  p_worksite_id uuid, p_label text, p_street text default null, p_locality text default null,
  p_available_for_manual boolean default true, p_is_active boolean default true)
returns uuid
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin(); v_id uuid;
begin
  perform set_config('app.audit_action', 'admin_upsert_worksite', true);
  if p_worksite_id is null then
    insert into public.worksites (site_key, label, street, locality, source, available_for_manual, is_active, created_by)
    values ('admin:' || lower(btrim(regexp_replace(p_label, '\s+', ' ', 'g'))), btrim(p_label), nullif(btrim(p_street), ''),
            nullif(btrim(p_locality), ''), 'admin', coalesce(p_available_for_manual, true), coalesce(p_is_active, true), v_admin)
    returning id into v_id;
  else
    update public.worksites
       set label = btrim(p_label),
           street = case when source = 'admin' then nullif(btrim(p_street), '') else street end,
           locality = case when source = 'admin' then nullif(btrim(p_locality), '') else locality end,
           available_for_manual = coalesce(p_available_for_manual, available_for_manual),
           is_active = coalesce(p_is_active, is_active)
     where id = p_worksite_id
    returning id into v_id;
    if v_id is null then raise exception 'Worksite not found' using errcode = 'P0002'; end if;
  end if;
  return v_id;
exception when unique_violation then
  raise exception 'A worksite with that name already exists' using errcode = '23505';
end;
$$;

-- Edit an official shift. Old and new values, reason and admin are kept in shift_revisions.
create or replace function public.admin_update_shift(
  p_shift_id         uuid,
  p_clock_in_local   timestamp,
  p_clock_out_local  timestamp,
  p_lunch_minutes    integer,
  p_worksite_id      uuid,
  p_reason           text,
  p_correction_id    uuid default null
)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin  uuid := private.require_admin();
  v_cs     public.company_settings := private.settings();
  v_reason text := private.require_reason(p_reason);
  v_old    public.shifts;
  v_in     timestamptz;
  v_out    timestamptz;
  v_group  uuid;
  v_site   uuid;
  v_kind   text := 'admin_edit';
begin
  select * into v_old from public.shifts where id = p_shift_id for update;
  if not found then raise exception 'Shift not found' using errcode = 'P0002'; end if;
  v_in  := p_clock_in_local at time zone v_cs.time_zone;
  v_out := p_clock_out_local at time zone v_cs.time_zone;
  if v_in is null then raise exception 'Clock-in time is required' using errcode = '22023'; end if;
  if v_in > now() + interval '1 minute' or v_out > now() + interval '1 minute' then
    raise exception 'Times cannot be in the future' using errcode = '22023';
  end if;
  if v_out is not null and v_out <= v_in then
    raise exception 'Clock-out must be after clock-in' using errcode = '22023';
  end if;
  if v_out is null and v_old.clock_out_at is not null then
    raise exception 'A completed shift must keep a clock-out time' using errcode = '22023';
  end if;
  if coalesce(p_lunch_minutes, 0) < 0 or coalesce(p_lunch_minutes, 0) > v_cs.max_lunch_minutes then
    raise exception 'Lunch must be between 0 and % minutes', v_cs.max_lunch_minutes using errcode = '22023';
  end if;
  if v_out is null and coalesce(p_lunch_minutes, 0) > 0 then
    raise exception 'Lunch can only be set once the shift has a clock-out time' using errcode = '22023';
  end if;
  if v_out is not null and coalesce(p_lunch_minutes, 0) > 0
     and p_lunch_minutes * 60 >= extract(epoch from (v_out - v_in)) then
    raise exception 'Lunch cannot be as long as the shift' using errcode = '22023';
  end if;
  if p_correction_id is not null and not exists (select 1 from public.correction_requests
                                                 where id = p_correction_id and employee_id = v_old.employee_id) then
    raise exception 'Correction request not found for this employee' using errcode = 'P0002';
  end if;

  v_site := coalesce(p_worksite_id, v_old.worksite_id);
  v_group := v_old.work_group_id;
  if v_site <> v_old.worksite_id then
    if not exists (select 1 from public.worksites where id = v_site) then
      raise exception 'Worksite not found' using errcode = 'P0002';
    end if;
    v_group := private.open_group_for(v_old.employee_id, v_site);
    v_kind := 'worksite_change';
  end if;

  perform set_config('app.audit_action', 'admin_update_shift', true);
  update public.shifts
     set clock_in_at = v_in, clock_out_at = v_out, lunch_minutes = coalesce(p_lunch_minutes, 0),
         worksite_id = v_site, work_group_id = v_group,
         needs_review = case when v_out is not null and extract(epoch from (v_out - v_in)) > v_cs.max_shift_hours * 3600
                             then true else false end,
         review_reason = case when v_out is not null and extract(epoch from (v_out - v_in)) > v_cs.max_shift_hours * 3600
                              then 'Shift longer than ' || v_cs.max_shift_hours || ' hours' else null end
   where id = p_shift_id;

  insert into public.shift_revisions (shift_id, revision_no, change_kind, old_values, new_values, reason, correction_request_id, changed_by)
  values (p_shift_id,
          coalesce((select max(revision_no) from public.shift_revisions where shift_id = p_shift_id), 0) + 1,
          v_kind,
          jsonb_build_object('clock_in_at', v_old.clock_in_at, 'clock_out_at', v_old.clock_out_at,
                             'lunch_minutes', v_old.lunch_minutes, 'worksite_id', v_old.worksite_id,
                             'work_group_id', v_old.work_group_id, 'net_minutes', v_old.net_minutes),
          (select jsonb_build_object('clock_in_at', s.clock_in_at, 'clock_out_at', s.clock_out_at,
                                     'lunch_minutes', s.lunch_minutes, 'worksite_id', s.worksite_id,
                                     'work_group_id', s.work_group_id, 'net_minutes', s.net_minutes)
           from public.shifts s where s.id = p_shift_id),
          v_reason, p_correction_id, v_admin);

  perform private.flag_reports_changed(v_old.work_group_id);
  if v_group <> v_old.work_group_id then perform private.flag_reports_changed(v_group); end if;
  return private.shift_json(p_shift_id);
exception
  when exclusion_violation then
    raise exception 'This would overlap another shift for this employee.' using errcode = '23P01';
  when unique_violation then
    raise exception 'This employee already has an active shift.' using errcode = '23505';
end;
$$;

-- Add a missing shift.
create or replace function public.admin_add_shift(
  p_employee_id     uuid,
  p_worksite_id     uuid,
  p_clock_in_local  timestamp,
  p_clock_out_local timestamp,
  p_lunch_minutes   integer,
  p_reason          text,
  p_request_id      uuid,
  p_correction_id   uuid default null
)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin  uuid := private.require_admin();
  v_cs     public.company_settings := private.settings();
  v_reason text := private.require_reason(p_reason);
  v_in     timestamptz := p_clock_in_local at time zone v_cs.time_zone;
  v_out    timestamptz := p_clock_out_local at time zone v_cs.time_zone;
  v_group  uuid;
  v_id     uuid;
begin
  if p_request_id is null then raise exception 'Missing request id' using errcode = '22023'; end if;
  select id into v_id from public.shifts where clock_in_request_id = p_request_id;
  if found then return private.shift_json(v_id) || jsonb_build_object('repeated_request', true); end if;
  if not exists (select 1 from public.employees where id = p_employee_id) then
    raise exception 'Employee not found' using errcode = 'P0002';
  end if;
  if not exists (select 1 from public.worksites where id = p_worksite_id) then
    raise exception 'Worksite not found' using errcode = 'P0002';
  end if;
  if v_in is null or v_out is null or v_out <= v_in then
    raise exception 'Enter a clock-in and a later clock-out time' using errcode = '22023';
  end if;
  if v_out > now() + interval '1 minute' then
    raise exception 'Times cannot be in the future' using errcode = '22023';
  end if;
  if coalesce(p_lunch_minutes, 0) < 0 or coalesce(p_lunch_minutes, 0) > v_cs.max_lunch_minutes
     or coalesce(p_lunch_minutes, 0) * 60 >= extract(epoch from (v_out - v_in)) and coalesce(p_lunch_minutes, 0) > 0 then
    raise exception 'Invalid lunch duration' using errcode = '22023';
  end if;
  if p_correction_id is not null and not exists (select 1 from public.correction_requests
                                                 where id = p_correction_id and employee_id = p_employee_id) then
    raise exception 'Correction request not found for this employee' using errcode = 'P0002';
  end if;

  perform set_config('app.audit_action', 'admin_add_shift', true);
  v_group := private.open_group_for(p_employee_id, p_worksite_id);
  insert into public.shifts (employee_id, work_group_id, worksite_id, clock_in_at, clock_out_at, lunch_minutes,
                             clock_in_method, clock_in_request_id, source)
  values (p_employee_id, v_group, p_worksite_id, v_in, v_out, coalesce(p_lunch_minutes, 0), 'admin', p_request_id, 'admin_added')
  returning id into v_id;
  insert into public.shift_revisions (shift_id, revision_no, change_kind, old_values, new_values, reason, correction_request_id, changed_by)
  values (v_id, 1, 'admin_add', null,
          jsonb_build_object('clock_in_at', v_in, 'clock_out_at', v_out, 'lunch_minutes', coalesce(p_lunch_minutes, 0),
                             'worksite_id', p_worksite_id, 'work_group_id', v_group),
          v_reason, p_correction_id, v_admin);
  return private.shift_json(v_id);
exception
  when exclusion_violation then
    raise exception 'This would overlap another shift for this employee.' using errcode = '23P01';
end;
$$;

create or replace function public.admin_resolve_correction(p_correction_id uuid, p_status text, p_note text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  if p_status not in ('resolved', 'rejected') then raise exception 'Invalid status' using errcode = '22023'; end if;
  perform private.require_reason(p_note);
  perform set_config('app.audit_action', 'admin_resolve_correction', true);
  update public.correction_requests
     set status = p_status, resolution_note = btrim(p_note), resolved_by = v_admin, resolved_at = now()
   where id = p_correction_id and status = 'open';
  if not found then raise exception 'Correction request not found or already handled' using errcode = 'P0002'; end if;
end;
$$;

create or replace function public.admin_review_report(p_report_id uuid, p_action text, p_note text default null,
                                                      p_approved_amount numeric default null)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin  uuid := private.require_admin();
  v_report public.reports;
  v_totals jsonb;
begin
  select * into v_report from public.reports where id = p_report_id for update;
  if not found then raise exception 'Report not found' using errcode = 'P0002'; end if;
  perform 1 from public.work_groups where id = v_report.work_group_id for update;
  perform set_config('app.audit_action', 'admin_review_report:' || coalesce(p_action, ''), true);

  if p_action = 'under_review' then
    if v_report.status <> 'submitted' then raise exception 'Only submitted reports can be put under review' using errcode = 'P0001'; end if;
    update public.reports set status = 'under_review', reviewed_at = now(), reviewed_by = v_admin,
                              review_note = coalesce(nullif(btrim(p_note), ''), review_note)
     where id = p_report_id;

  elsif p_action = 'approve' then
    if v_report.status not in ('submitted', 'under_review') then
      raise exception 'Only submitted or under-review reports can be approved' using errcode = 'P0001';
    end if;
    v_totals := private.group_totals(v_report.work_group_id);
    if (v_totals ->> 'missing_rate')::boolean and p_approved_amount is null then
      raise exception 'Some shifts have no wage rate. Set a rate for this employee or enter the approved amount.' using errcode = 'P0001';
    end if;
    if p_approved_amount is not null and p_approved_amount < 0 then
      raise exception 'Approved amount cannot be negative' using errcode = '22023';
    end if;
    if p_approved_amount is not null and round(p_approved_amount, 2) <> (v_totals ->> 'estimated_amount')::numeric
       and length(btrim(coalesce(p_note, ''))) < 3 then
      raise exception 'Explain why the approved amount differs from the calculated amount' using errcode = '22023';
    end if;
    update public.reports
       set status = 'approved', approved_at = now(), approved_by = v_admin, reviewed_at = now(), reviewed_by = v_admin,
           approved_net_minutes = (v_totals ->> 'net_minutes')::numeric,
           approved_amount = round(coalesce(p_approved_amount, (v_totals ->> 'estimated_amount')::numeric), 2),
           review_note = coalesce(nullif(btrim(p_note), ''), review_note),
           changed_after_submission = false
     where id = p_report_id;
    update public.work_groups set status = 'approved' where id = v_report.work_group_id;
    perform private.recompute_report_payment(p_report_id);

  elsif p_action = 'return' then
    if v_report.status not in ('submitted', 'under_review', 'approved') then
      raise exception 'This report cannot be returned' using errcode = 'P0001';
    end if;
    if v_report.amount_paid > 0 then
      raise exception 'A report with recorded payments cannot be returned. Void the payments first.' using errcode = 'P0001';
    end if;
    perform private.require_reason(p_note);
    update public.reports
       set status = 'returned', reviewed_at = now(), reviewed_by = v_admin, review_note = btrim(p_note),
           approved_at = null, approved_by = null, approved_net_minutes = null, approved_amount = null
     where id = p_report_id;
    update public.work_groups set status = 'returned', closed_at = null where id = v_report.work_group_id;

  elsif p_action = 'flag' then
    perform private.require_reason(p_note);
    update public.reports set flagged = true, flag_note = btrim(p_note) where id = p_report_id;
  elsif p_action = 'unflag' then
    update public.reports set flagged = false where id = p_report_id;
  else
    raise exception 'Unknown action' using errcode = '22023';
  end if;

  return (select to_jsonb(r) from public.reports r where r.id = p_report_id);
end;
$$;

create or replace function public.admin_record_payment(
  p_report_id uuid, p_amount numeric, p_paid_on date, p_method text, p_reference text, p_note text, p_request_id uuid)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin   uuid := private.require_admin();
  v_cs      public.company_settings := private.settings();
  v_report  public.reports;
  v_due     numeric;
  v_out     numeric;
  v_pay     public.payments;
begin
  if p_request_id is null then raise exception 'Missing request id' using errcode = '22023'; end if;
  select * into v_pay from public.payments where request_id = p_request_id;
  if found then return to_jsonb(v_pay) || jsonb_build_object('repeated_request', true); end if;

  select * into v_report from public.reports where id = p_report_id for update;
  if not found then raise exception 'Report not found' using errcode = 'P0002'; end if;
  if v_cs.require_report_approval and v_report.status <> 'approved' then
    raise exception 'Approve the report before recording a payment.' using errcode = 'P0001';
  end if;
  if v_report.status = 'returned' then
    raise exception 'This report was returned for review.' using errcode = 'P0001';
  end if;
  v_due := coalesce(v_report.approved_amount, v_report.snapshot_estimated_amount);
  if v_due is null then raise exception 'This report has no amount due yet.' using errcode = 'P0001'; end if;
  v_out := v_due - v_report.amount_paid;
  if p_amount is null or p_amount <= 0 then raise exception 'Enter a payment amount greater than zero' using errcode = '22023'; end if;
  if round(p_amount, 2) > round(v_out, 2) then
    raise exception 'This payment (%) is more than the outstanding balance (%). Possible duplicate payment.',
      round(p_amount, 2), round(v_out, 2) using errcode = 'P0001', hint = 'OVERPAYMENT';
  end if;
  if p_paid_on is null or p_paid_on > (now() at time zone v_cs.time_zone)::date then
    raise exception 'Enter the actual payment date (not in the future)' using errcode = '22023';
  end if;

  perform set_config('app.audit_action', 'admin_record_payment', true);
  insert into public.payments (report_id, employee_id, amount, paid_on, method, reference, note, request_id, created_by)
  values (v_report.id, v_report.employee_id, round(p_amount, 2), p_paid_on, nullif(btrim(p_method), ''),
          nullif(btrim(p_reference), ''), nullif(btrim(p_note), ''), p_request_id, v_admin)
  returning * into v_pay;
  perform private.recompute_report_payment(v_report.id);
  return to_jsonb(v_pay);
exception when unique_violation then
  raise exception 'A payment with this reference already exists for this employee (possible duplicate).' using errcode = '23505';
end;
$$;

create or replace function public.admin_void_payment(p_payment_id uuid, p_reason text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin(); v_reason text := private.require_reason(p_reason); v_report uuid;
begin
  perform set_config('app.audit_action', 'admin_void_payment', true);
  update public.payments set voided_at = now(), voided_by = v_admin, void_reason = v_reason
   where id = p_payment_id and voided_at is null
  returning report_id into v_report;
  if v_report is null then raise exception 'Payment not found or already voided' using errcode = 'P0002'; end if;
  perform 1 from public.reports where id = v_report for update;
  perform private.recompute_report_payment(v_report);
end;
$$;

-- Settings: whitelisted keys only, validated by the table's constraints.
create or replace function public.admin_update_settings(p jsonb)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_admin uuid := private.require_admin();
  v_key   text;
  v_type  text;
  v_allowed text[] := array['company_name', 'contact_email', 'contact_phone', 'company_address', 'time_zone',
    'week_starts_on', 'currency_code', 'date_format', 'time_format', 'default_lunch_minutes', 'max_lunch_minutes',
    'location_mode', 'allow_custom_manual_sites', 'grouping_mode', 'max_shift_hours', 'pay_period_type',
    'pay_period_anchor', 'default_hourly_rate', 'overtime_enabled', 'daily_ot_after_hours', 'daily_dt_after_hours',
    'weekly_ot_after_hours', 'ot_multiplier', 'dt_multiplier', 'require_report_approval', 'payment_methods',
    'backups_enabled', 'backup_after_change_minutes', 'backup_daily_hour', 'retention_years',
    'notes_employee_can_edit_days'];
begin
  if jsonb_typeof(p) <> 'object' then raise exception 'Settings must be an object' using errcode = '22023'; end if;
  perform set_config('app.audit_action', 'admin_update_settings', true);
  for v_key in select jsonb_object_keys(p) loop
    if not v_key = any (v_allowed) then
      raise exception 'Unknown setting: %', v_key using errcode = '22023';
    end if;
    select format_type(a.atttypid, a.atttypmod) into v_type
    from pg_catalog.pg_attribute a
    where a.attrelid = 'public.company_settings'::regclass and a.attname = v_key and not a.attisdropped;
    execute format('update public.company_settings set %I = $1::%s, updated_by = $2 where id', v_key, v_type)
      using (case when jsonb_typeof(p -> v_key) = 'null' then null
                  when v_key in ('currency_code') then upper(btrim(p ->> v_key))
                  when jsonb_typeof(p -> v_key) = 'string' then nullif(btrim(p ->> v_key), '')
                  else p ->> v_key end), v_admin;
  end loop;
end;
$$;

-- Admin overview counters.
create or replace function public.admin_dashboard()
returns jsonb
language plpgsql stable security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin(); v_cs public.company_settings := private.settings();
begin
  return jsonb_build_object(
    'server_now', now(),
    'active_employees', (select count(*) from public.employee_access where status = 'active'),
    'clocked_in', (select coalesce(jsonb_agg(jsonb_build_object('employee_id', e.id, 'name', coalesce(e.display_name, e.full_name),
                                   'since', s.clock_in_at, 'worksite', w.label, 'method', s.clock_in_method) order by s.clock_in_at), '[]'::jsonb)
                   from public.shifts s join public.employees e on e.id = s.employee_id join public.worksites w on w.id = s.worksite_id
                   where s.clock_out_at is null),
    'reports_pending', (select count(*) from public.reports where status in ('submitted', 'under_review')),
    'reports_flagged', (select count(*) from public.reports where flagged),
    'reports_changed', (select count(*) from public.reports where changed_after_submission),
    'corrections_open', (select count(*) from public.correction_requests where status = 'open'),
    'access_requests', (select count(*) from public.access_requests where status = 'pending'),
    'shifts_needing_review', (select count(*) from public.shifts where needs_review),
    'outstanding_amount', (select coalesce(sum(greatest(approved_amount - amount_paid, 0)), 0) from public.reports where status = 'approved'),
    'unpaid_reports', (select count(*) from public.reports where status = 'approved' and payment_status <> 'paid'),
    'hours_today', (select coalesce(sum(net_minutes), 0) from public.shifts
                    where clock_out_at is not null and (clock_in_at at time zone v_cs.time_zone)::date = (now() at time zone v_cs.time_zone)::date),
    'missing_rates', (select count(*) from public.employee_access a where a.status = 'active'
                      and not exists (select 1 from public.wage_rates w where w.employee_id = a.employee_id))
  );
end;
$$;
