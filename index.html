create or replace function private.backup_tables()
returns text[]
language sql immutable set search_path = ''
as $$
  select array['employees', 'employee_access', 'employee_google_accounts', 'employee_preferences', 'access_requests',
               'company_settings', 'worksites', 'work_groups', 'wage_rates', 'shifts', 'reports', 'report_snapshots',
               'correction_requests', 'shift_revisions', 'payments', 'notes', 'export_log', 'restore_runs', 'audit_log'];
$$;

-- An account with no work records at all (e.g. the admin created just to run a recovery).
create or replace function private.is_placeholder(p_employee_id uuid)
returns boolean
language sql stable security definer set search_path = ''
as $$
  select not exists (select 1 from public.shifts where employee_id = p_employee_id)
     and not exists (select 1 from public.work_groups where employee_id = p_employee_id)
     and not exists (select 1 from public.notes where employee_id = p_employee_id)
     and not exists (select 1 from public.wage_rates where employee_id = p_employee_id)
     and not exists (select 1 from public.correction_requests where employee_id = p_employee_id);
$$;

create or replace function private.data_version()
returns bigint
language sql stable security definer set search_path = ''
as $$ select coalesce(max(id), 0) from public.audit_log where action <> 'access_request'; $$;

-- Complete structured backup as JSON text (text keeps numbers exactly as stored).
create or replace function private.build_backup()
returns text
language plpgsql stable security definer set search_path = ''
as $$
declare
  v_cs     public.company_settings := private.settings();
  v_data   jsonb := '{}'::jsonb;
  v_counts jsonb := '{}'::jsonb;
  v_tbl    text;
  v_rows   jsonb;
begin
  foreach v_tbl in array private.backup_tables() loop
    execute format('select coalesce(jsonb_agg(to_jsonb(t)), ''[]''::jsonb) from public.%I t', v_tbl) into v_rows;
    v_data := v_data || jsonb_build_object(v_tbl, v_rows);
    v_counts := v_counts || jsonb_build_object(v_tbl, jsonb_array_length(v_rows));
  end loop;
  return jsonb_build_object(
    'format', 'employee-time-tracker-backup',
    'format_version', 1,
    'schema_version', 2,
    'created_at', now(),
    'company_name', v_cs.company_name,
    'time_zone', v_cs.time_zone,
    'currency_code', v_cs.currency_code,
    'data_version', private.data_version(),
    'record_counts', v_counts,
    'notes', 'All timestamps are UTC (ISO 8601). Work dates use the company time zone above. Amounts are in currency_code. Estimated amounts are not payroll results.',
    'checksum_sha256', encode(sha256(convert_to(v_data::text, 'UTF8')), 'hex'),
    'data', v_data)::text;
end;
$$;

create or replace function public.admin_export_backup()
returns text
language plpgsql stable security definer set search_path = ''
as $$
begin
  perform private.require_admin();
  return private.build_backup();
end;
$$;

-- Restore = ADD MISSING RECORDS ONLY. Existing records are never overwritten or deleted.
create or replace function private.restore_backup(p_text text, p_apply boolean, p_admin uuid, p_source text, p_file_name text)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_doc     jsonb;
  v_data    jsonb;
  v_tbl     text;
  v_pk      text;
  v_cols    text;
  v_row     jsonb;
  v_exist   jsonb;
  v_summary jsonb := '{}'::jsonb;
  v_tsum    jsonb;
  v_pending jsonb;
  v_next    jsonb;
  v_pass    integer;
  v_added   integer;
  v_present integer;
  v_diff    integer;
  v_errors  jsonb;
  v_result  jsonb;
  v_seq     text;
  v_col     text;
  v_match   boolean;
  v_other   uuid;
  v_acc     public.employee_google_accounts;
  v_caller  uuid := private.current_employee_id();
begin
  begin
    v_doc := p_text::jsonb;
  exception when others then
    raise exception 'The file is not valid JSON (it may be damaged or incomplete).' using errcode = '22P02';
  end;
  if jsonb_typeof(v_doc) <> 'object' or v_doc ->> 'format' is distinct from 'employee-time-tracker-backup' then
    raise exception 'This is not an Employee Time Tracker backup file.' using errcode = '22023';
  end if;
  if (v_doc ->> 'format_version')::int is distinct from 1 then
    raise exception 'Unsupported backup format version: %', v_doc ->> 'format_version' using errcode = '22023';
  end if;
  v_data := v_doc -> 'data';
  if jsonb_typeof(v_data) <> 'object' then
    raise exception 'Backup has no data section.' using errcode = '22023';
  end if;
  if encode(sha256(convert_to(v_data::text, 'UTF8')), 'hex') is distinct from v_doc ->> 'checksum_sha256' then
    raise exception 'Checksum mismatch: the backup file is corrupted or was edited. Nothing was restored.' using errcode = '22023';
  end if;
  foreach v_tbl in array private.backup_tables() loop
    if jsonb_typeof(v_data -> v_tbl) is distinct from 'array' then
      raise exception 'Backup is missing the "%" table.', v_tbl using errcode = '22023';
    end if;
  end loop;

  perform set_config('app.audit_action', 'restore_backup', true);
  begin  -- everything below is undone at the end when this is only a validation (dry run)
    foreach v_tbl in array private.backup_tables() loop
      select a.attname into v_pk
      from pg_catalog.pg_index i
      join pg_catalog.pg_attribute a on a.attrelid = i.indrelid and a.attnum = i.indkey[0]
      where i.indrelid = ('public.' || v_tbl)::regclass and i.indisprimary;
      select string_agg(format('%I', a.attname), ', ' order by a.attnum) into v_cols
      from pg_catalog.pg_attribute a
      where a.attrelid = ('public.' || v_tbl)::regclass and a.attnum > 0 and not a.attisdropped and a.attgenerated = '';

      v_added := 0; v_present := 0; v_diff := 0; v_errors := '[]'::jsonb; v_pending := '[]'::jsonb;
      -- counters (friendly employee numbers, history ids) move past both current and file values
      if v_tbl in ('employees', 'audit_log', 'export_log', 'shift_revisions') then
        v_col := case when v_tbl = 'employees' then 'employee_number' else 'id' end;
        v_seq := pg_catalog.pg_get_serial_sequence('public.' || v_tbl, v_col);
        execute format('select pg_catalog.setval(%L, greatest((select coalesce(max(%I), 0) from public.%I), '
                       '(select coalesce(max((x ->> %L)::bigint), 0) from jsonb_array_elements($1) x), 1))',
                       v_seq, v_col, v_tbl, v_col) using v_data -> v_tbl;
      end if;
      -- classify rows
      for v_row in select value from jsonb_array_elements(v_data -> v_tbl) loop
        if v_row -> v_pk is null then
          v_errors := v_errors || jsonb_build_array('row without ' || v_pk);
          continue;
        end if;

        -- history tables: matched by content, because their numeric ids are per-project counters
        v_match := null;
        if v_tbl = 'audit_log' then
          v_match := exists (select 1 from public.audit_log a
                             where a.occurred_at = (v_row ->> 'occurred_at')::timestamptz and a.action = v_row ->> 'action'
                               and a.target_table = v_row ->> 'target_table' and a.operation = v_row ->> 'operation'
                               and a.target_id is not distinct from v_row ->> 'target_id');
        elsif v_tbl = 'export_log' then
          v_match := exists (select 1 from public.export_log a
                             where a.exported_at = (v_row ->> 'exported_at')::timestamptz and a.export_type = v_row ->> 'export_type'
                               and a.exported_by is not distinct from (v_row ->> 'exported_by')::uuid);
        elsif v_tbl = 'shift_revisions' then
          v_match := exists (select 1 from public.shift_revisions a
                             where a.shift_id = (v_row ->> 'shift_id')::uuid and a.revision_no = (v_row ->> 'revision_no')::int);
        end if;
        if v_match is not null then
          if v_match then
            v_present := v_present + 1;
            continue;
          end if;
          execute format('select exists (select 1 from public.%I where id = $1)', v_tbl) into v_match using (v_row ->> 'id')::bigint;
          if v_match then
            v_row := jsonb_set(v_row, '{id}', to_jsonb(nextval(pg_catalog.pg_get_serial_sequence('public.' || v_tbl, 'id'))));
          end if;
          v_pending := v_pending || jsonb_build_array(v_row);
          continue;
        end if;

        execute format('select to_jsonb(t) from public.%I t where %I::text = $1', v_tbl, v_pk) into v_exist using v_row ->> v_pk;
        if v_exist is not null then
          v_present := v_present + 1;
          if exists (select 1 from jsonb_each(v_row) r where (v_exist -> r.key) is distinct from r.value) then
            v_diff := v_diff + 1;   -- current version kept
          end if;
        elsif v_tbl = 'company_settings' then
          v_present := v_present + 1;
        else
          if v_tbl = 'employees' then
            -- friendly number already used by someone else in this project
            select id into v_other from public.employees where employee_number = (v_row ->> 'employee_number')::int;
            if v_other is not null then
              if v_other = v_caller and private.is_placeholder(v_caller) then
                update public.employees
                   set employee_number = nextval(pg_catalog.pg_get_serial_sequence('public.employees', 'employee_number'))
                 where id = v_caller;
              else
                v_row := jsonb_set(v_row, '{employee_number}',
                                   to_jsonb(nextval(pg_catalog.pg_get_serial_sequence('public.employees', 'employee_number'))));
              end if;
            end if;
          end if;
          if v_tbl = 'employee_google_accounts' and v_row ->> 'revoked_at' is null then
            select * into v_acc from public.employee_google_accounts
            where google_email = v_row ->> 'google_email' and revoked_at is null;
            if found and v_acc.employee_id <> (v_row ->> 'employee_id')::uuid then
              -- Disaster recovery: the admin who set up this new project signs in with the SAME Google
              -- account as their restored record -> hand the login over to the restored record.
              if v_acc.employee_id = v_caller and private.is_placeholder(v_caller)
                 and (v_acc.google_subject is null or v_row ->> 'google_subject' is null
                      or v_acc.google_subject = v_row ->> 'google_subject') then
                update public.employee_google_accounts set revoked_at = now() where id = v_acc.id;
                update public.employee_access
                   set status = 'disabled', status_changed_at = now(),
                       status_reason = 'Setup placeholder replaced by the restored employee record'
                 where employee_id = v_caller;
                v_row := jsonb_set(v_row, '{auth_user_id}', to_jsonb(v_acc.auth_user_id));
                if v_row ->> 'google_subject' is null then
                  v_row := jsonb_set(v_row, '{google_subject}', to_jsonb(v_acc.google_subject));
                end if;
              else
                v_errors := v_errors || jsonb_build_array('Google account ' || (v_row ->> 'google_email')
                                                          || ' already belongs to a current employee; not restored');
                continue;
              end if;
            end if;
          end if;
          if v_tbl = 'employee_google_accounts' and v_row ->> 'auth_user_id' is not null
             and not exists (select 1 from auth.users u where u.id = (v_row ->> 'auth_user_id')::uuid) then
            v_row := jsonb_set(v_row, '{auth_user_id}', 'null'::jsonb);   -- person re-links on next Google sign-in
          end if;
          if v_tbl = 'access_requests'
             and not exists (select 1 from auth.users u where u.id = (v_row ->> 'auth_user_id')::uuid) then
            v_errors := v_errors || jsonb_build_array('access request skipped: login no longer exists');
            continue;
          end if;
          v_pending := v_pending || jsonb_build_array(v_row);
        end if;
      end loop;
      -- insert missing rows (a few passes so rows that depend on each other can land)
      for v_pass in 1..3 loop
        exit when jsonb_array_length(v_pending) = 0;
        v_next := '[]'::jsonb;
        for v_row in select value from jsonb_array_elements(v_pending) loop
          begin
            execute format('insert into public.%I (%s) overriding system value select %s from jsonb_populate_record(null::public.%I, $1)',
                           v_tbl, v_cols, v_cols, v_tbl) using v_row;
            v_added := v_added + 1;
          exception when others then
            v_next := v_next || jsonb_build_array(v_row || jsonb_build_object('__error', sqlerrm));
          end;
        end loop;
        v_pending := (select coalesce(jsonb_agg(value - '__error'), '[]'::jsonb) from jsonb_array_elements(v_next));
        if v_pass = 3 then
          v_errors := v_errors || (select coalesce(jsonb_agg(value ->> '__error'), '[]'::jsonb)
                                   from (select value from jsonb_array_elements(v_next) limit 5) x);
        end if;
      end loop;
      v_tsum := jsonb_build_object('in_file', jsonb_array_length(v_data -> v_tbl), 'already_present', v_present,
                                   'present_but_different_kept_current', v_diff, 'added', v_added,
                                   'not_restored', jsonb_array_length(v_data -> v_tbl) - v_present - v_added,
                                   'errors', v_errors);
      v_summary := v_summary || jsonb_build_object(v_tbl, v_tsum);
    end loop;

    -- keep identity counters ahead of restored ids
    for v_tbl, v_col in
      select c.relname, a.attname from pg_catalog.pg_attribute a
      join pg_catalog.pg_class c on c.oid = a.attrelid
      join pg_catalog.pg_namespace n on n.oid = c.relnamespace
      where n.nspname = 'public' and a.attidentity <> '' and c.relname = any (private.backup_tables())
    loop
      v_seq := pg_catalog.pg_get_serial_sequence('public.' || v_tbl, v_col);
      execute format('select pg_catalog.setval(%L, greatest((select coalesce(max(%I), 0) from public.%I), 1))', v_seq, v_col, v_tbl);
    end loop;

    v_result := jsonb_build_object('mode', case when p_apply then 'restored' else 'validation_only' end,
                                   'backup_created_at', v_doc ->> 'created_at',
                                   'backup_data_version', v_doc ->> 'data_version',
                                   'checksum_ok', true, 'tables', v_summary);
    if not p_apply then
      raise exception using errcode = 'P0901', message = 'dry run';
    end if;
    insert into public.restore_runs (restored_by, source, file_name, checksum, summary)
    values (p_admin, p_source, left(p_file_name, 200), v_doc ->> 'checksum_sha256', v_result);
  exception when sqlstate 'P0901' then
    null;   -- validation only: all changes rolled back, summary kept
  end;
  return v_result;
end;
$$;

create or replace function public.admin_validate_backup(p_backup text)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  return private.restore_backup(p_backup, false, v_admin, 'upload', null);
end;
$$;

create or replace function public.admin_restore_backup(p_backup text, p_confirm text, p_source text default 'upload', p_file_name text default null)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin();
begin
  if p_confirm is distinct from 'RESTORE' then
    raise exception 'Type RESTORE to confirm' using errcode = '22023';
  end if;
  if p_source not in ('upload', 'google_drive') then raise exception 'Invalid source' using errcode = '22023'; end if;
  return private.restore_backup(p_backup, true, v_admin, p_source, p_file_name);
end;
$$;

create or replace function public.admin_backup_status()
returns jsonb
language plpgsql stable security definer set search_path = ''
as $$
declare v_admin uuid := private.require_admin(); v_cfg private.backup_config; v_last public.backup_runs;
begin
  select * into v_cfg from private.backup_config where id;
  select * into v_last from public.backup_runs where status = 'succeeded' order by finished_at desc limit 1;
  return jsonb_build_object(
    'drive_connected', v_cfg.drive_refresh_token is not null,
    'drive_account_email', v_cfg.drive_account_email,
    'drive_folder_id', v_cfg.drive_folder_id,
    'drive_connected_at', v_cfg.drive_connected_at,
    'schedule_ready', v_cfg.function_url is not null,
    'last_success', case when v_last.id is null then null else to_jsonb(v_last) end,
    'last_run', (select to_jsonb(b) from public.backup_runs b order by started_at desc limit 1),
    'running', exists (select 1 from public.backup_runs where status = 'running'),
    'pending_changes', private.data_version() - coalesce(v_last.data_version, 0),
    'data_version', private.data_version());
end;
$$;

-- ---- Service functions for the Google Drive backup server function ----
-- Callable ONLY with the project's secret (service_role) key, which lives
-- inside the Supabase Edge Function. Never from the website.
create or replace function public.svc_backup_begin(p_trigger text, p_cron_token text default null, p_requested_by uuid default null)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_cfg  private.backup_config;
  v_cs   public.company_settings := private.settings();
  v_last public.backup_runs;
  v_id   uuid;
  v_ver  bigint := private.data_version();
begin
  select * into v_cfg from private.backup_config where id;
  if p_trigger in ('auto_change', 'scheduled') then
    if p_cron_token is null or p_cron_token is distinct from v_cfg.cron_token then
      raise exception 'Invalid scheduler token' using errcode = '42501';
    end if;
    if not v_cs.backups_enabled then return jsonb_build_object('skip', 'Automatic backups are turned off'); end if;
  elsif p_trigger = 'manual' then
    if p_requested_by is null then raise exception 'Requester required' using errcode = '22023'; end if;
  else
    raise exception 'Invalid trigger' using errcode = '22023';
  end if;
  if v_cfg.drive_refresh_token is null then
    return jsonb_build_object('skip', 'Google Drive is not connected');
  end if;
  -- a run stuck for over 15 minutes is marked failed so backups can continue
  update public.backup_runs set status = 'failed', finished_at = now(), error = 'Timed out'
   where status = 'running' and started_at < now() - interval '15 minutes';
  select * into v_last from public.backup_runs where status = 'succeeded' order by finished_at desc limit 1;
  if p_trigger = 'auto_change' and v_last.id is not null and v_last.data_version >= v_ver then
    return jsonb_build_object('skip', 'No changes since the last backup');
  end if;
  if p_trigger = 'scheduled' and v_last.id is not null and v_last.finished_at > now() - interval '20 hours' then
    return jsonb_build_object('skip', 'A backup succeeded recently');
  end if;
  begin
    insert into public.backup_runs (trigger, status, requested_by, data_version, attempts)
    values (p_trigger, 'running', p_requested_by, v_ver, 0)
    returning id into v_id;
  exception when unique_violation then
    return jsonb_build_object('skip', 'Another backup is already running');
  end;
  return jsonb_build_object('run_id', v_id, 'data_version', v_ver);
end;
$$;

create or replace function public.svc_backup_payload(p_run_id uuid)
returns text
language plpgsql stable security definer set search_path = ''
as $$
begin
  if not exists (select 1 from public.backup_runs where id = p_run_id and status = 'running') then
    raise exception 'Backup run not active' using errcode = 'P0002';
  end if;
  return private.build_backup();
end;
$$;

create or replace function public.svc_backup_finish(p_run_id uuid, p_status text, p_file_name text, p_drive_file_id text,
                                                    p_size bigint, p_sha256 text, p_attempts integer, p_error text)
returns void
language plpgsql volatile security definer set search_path = ''
as $$
begin
  if p_status not in ('succeeded', 'failed') then raise exception 'Invalid status' using errcode = '22023'; end if;
  update public.backup_runs
     set status = p_status, finished_at = now(), file_name = p_file_name, drive_file_id = p_drive_file_id,
         size_bytes = p_size, sha256 = p_sha256, attempts = p_attempts, error = left(p_error, 1000)
   where id = p_run_id and status = 'running';
  if not found then raise exception 'Backup run not active' using errcode = 'P0002'; end if;
end;
$$;

create or replace function public.svc_oauth_state_create(p_employee_id uuid, p_return_url text)
returns text
language plpgsql volatile security definer set search_path = ''
as $$
declare v_state text := replace(gen_random_uuid()::text || gen_random_uuid()::text, '-', '');
begin
  if p_return_url !~ '^https://' and p_return_url !~ '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/' then
    raise exception 'Return address must use HTTPS' using errcode = '22023';
  end if;
  delete from private.drive_oauth_states where expires_at < now();
  insert into private.drive_oauth_states (state, employee_id, return_url, expires_at)
  values (v_state, p_employee_id, left(p_return_url, 500), now() + interval '10 minutes');
  return v_state;
end;
$$;

create or replace function public.svc_oauth_state_consume(p_state text)
returns jsonb
language plpgsql volatile security definer set search_path = ''
as $$
declare v_row private.drive_oauth_states;
begin
  delete from private.drive_oauth_states where state = p_state returning * into v_row;
  if v_row.state is null or v_row.expires_at < now() then return null; end if;
  if not exists (select 1 from public.employee_access where employee_id = v_row.employee_id and role = 'admin' and status = 'active') then
    return null;
  end if;
  return jsonb_build_object('employee_id', v_row.employee_id, 'return_url', v_row.return_url);
end;
$$;

-- Called every few minutes by the scheduler (see the optional schedule SQL).
create or replace function private.request_backup_if_needed()
returns text
language plpgsql volatile security definer set search_path = ''
as $$
declare
  v_cs      public.company_settings := private.settings();
  v_cfg     private.backup_config;
  v_last    public.backup_runs;
  v_attempt timestamptz;
  v_trigger text;
begin
  if not v_cs.backups_enabled then return 'disabled'; end if;
  select * into v_cfg from private.backup_config where id;
  if v_cfg.drive_refresh_token is null or v_cfg.function_url is null then return 'not connected'; end if;
  if exists (select 1 from public.backup_runs where status = 'running' and started_at > now() - interval '15 minutes') then
    return 'running';
  end if;
  select * into v_last from public.backup_runs where status = 'succeeded' order by finished_at desc limit 1;
  select max(started_at) into v_attempt from public.backup_runs where trigger <> 'manual';
  if private.data_version() > coalesce(v_last.data_version, 0)
     and (v_attempt is null or v_attempt < now() - make_interval(mins => v_cs.backup_after_change_minutes)) then
    v_trigger := 'auto_change';
  elsif (v_last.id is null or v_last.finished_at < now() - interval '23 hours')
     and extract(hour from now() at time zone v_cs.time_zone) >= v_cs.backup_daily_hour
     and (v_attempt is null or v_attempt < now() - interval '1 hour') then
    v_trigger := 'scheduled';
  else
    return 'nothing to do';
  end if;
  perform net.http_post(
    url := v_cfg.function_url,
    body := jsonb_build_object('trigger', v_trigger),
    headers := jsonb_build_object('Content-Type', 'application/json', 'x-cron-token', v_cfg.cron_token,
                                  'apikey', coalesce(v_cfg.function_apikey, '')),
    timeout_milliseconds := 120000);
  return v_trigger;
end;
$$;

revoke all on all functions in schema public  from public, anon, authenticated;
revoke all on all functions in schema private from public, anon, authenticated;

grant execute on function private.session_is_live(), private.current_employee_id(),
                          private.is_admin(), private.is_active_member()
  to authenticated;

grant execute on function
  -- Part 1
  public.resolve_my_access(), public.update_my_profile(text),
  public.admin_create_employee(text, text, public.app_role), public.admin_approve_request(uuid, text, public.app_role),
  public.admin_dismiss_request(uuid), public.admin_set_status(uuid, public.account_status, text),
  public.admin_set_role(uuid, public.app_role), public.admin_update_employee(uuid, text, text),
  public.admin_replace_google_account(uuid, text), public.admin_update_company_settings(text, text, smallint, text),
  public.admin_security_report(),
  -- Part 2: employee
  public.get_my_dashboard(), public.update_my_profile_v2(text, text),
  public.update_my_preferences(text, text, boolean, boolean),
  public.clock_in(uuid, text, uuid, jsonb, text), public.clock_out(uuid, integer),
  public.submit_report(uuid, uuid, text),
  public.request_correction(uuid, text, uuid, uuid, uuid, timestamp, timestamp, integer),

  public.log_export(text, text, jsonb, integer),

  public.admin_upsert_worksite(uuid, text, text, text, boolean, boolean),

  public.admin_update_settings(jsonb), public.admin_dashboard(),
  public.admin_export_backup(), public.admin_validate_backup(text), public.admin_restore_backup(text, text, text, text),
  public.admin_backup_status()
  to authenticated;

grant execute on function
  public.svc_backup_begin(text, text, uuid), public.svc_backup_payload(uuid),
  public.svc_backup_finish(uuid, text, text, text, bigint, text, integer, text),
  public.svc_drive_get_config(), public.svc_drive_save_connection(text, text, uuid, text, text),
  public.svc_drive_set_folder(text), public.svc_drive_clear(),
  public.svc_oauth_state_create(uuid, text), public.svc_oauth_state_consume(text)
  to service_role;

commit;
</script>

<script type="text/plain" id="sql-schedule">
-- =====================================================================
--  OPTIONAL — AUTOMATIC BACKUP SCHEDULE
--  Run AFTER the Part 2 upgrade and AFTER Google Drive is connected in the app.
--  Uses Supabase's built-in pg_cron (scheduler) and pg_net (web requests).
--
--  Every 5 minutes the database checks, on its own:
--    * were there changes since the last good backup, and has the
--      "minimum gap" (Admin Settings) passed?   -> automatic backup
--    * otherwise, no successful backup in ~23 hours and it's past the
--      daily backup hour?                        -> scheduled backup
--  It only sends a request to the drive-backup function; the function
--  does the actual (verified) upload.
-- =====================================================================
create extension if not exists pg_net;
create extension if not exists pg_cron with schema pg_catalog;

select cron.unschedule(jobid) from cron.job where jobname = 'timeclock-backups';
select cron.schedule('timeclock-backups', '*/5 * * * *', $$ select private.request_backup_if_needed(); $$);

-- Check it: you should see one row named timeclock-backups.
select jobid, jobname, schedule, active from cron.job where jobname = 'timeclock-backups';
</script>
<script type="text/plain" id="fn-drive-backup">
// @ts-nocheck
// =====================================================================
//  Supabase Edge Function: drive-backup
//  Google Drive backups for the Employee Time Clock.
//
//  Runs on Supabase's servers. The Google Client Secret and the Drive
//  refresh token never reach a browser:
//    * GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET  -> Edge Function secrets
//    * Drive refresh token                      -> private database table
//
//  Routes (one function):
//    POST  {action:"connect", return_url}  admin: get the Google consent link
//    GET   /drive-backup/callback          Google returns here after consent
//    POST  {action:"backup_now"}           admin: back up now
//    POST  {action:"list"}                 admin: list backup files
//    POST  {action:"download", file_id}    admin: fetch one backup (for restore)
//    POST  {action:"disconnect"}           admin: forget the Drive connection
//    POST  {trigger:"auto_change"|"scheduled"} + x-cron-token header: scheduler
//
//  Deploy with "Verify JWT" turned OFF (Google's redirect carries no Supabase
//  token); every admin action checks the caller itself.
// =====================================================================

const FOLDER_NAME = 'Employee Time Tracker Backups';
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';   // only files this app creates
const DRIVE = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const MAX_ATTEMPTS = 3;

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
  'Access-Control-Allow-Methods': 'POST, GET, OPTIONS',
};

const env = (k) => (globalThis.Deno?.env.get(k) ?? '');
function pickKey(jsonName, legacyName) {
  try {
    const o = JSON.parse(env(jsonName) || '{}');
    const v = o.default || Object.values(o)[0];
    if (v) return v;
  } catch { /* fall through */ }
  return env(legacyName);
}
const cfg = () => ({
  url: env('SUPABASE_URL').replace(/\/$/, ''),
  secretKey: pickKey('SUPABASE_SECRET_KEYS', 'SUPABASE_SERVICE_ROLE_KEY'),
  publishableKey: pickKey('SUPABASE_PUBLISHABLE_KEYS', 'SUPABASE_ANON_KEY'),
  clientId: env('GOOGLE_CLIENT_ID'),
  clientSecret: env('GOOGLE_CLIENT_SECRET'),
  retryDelayMs: Number(env('BACKUP_RETRY_DELAY_MS') || 1500),
});
const functionUrl = () => `${cfg().url}/functions/v1/drive-backup`;

class HttpError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
const json = (status, body) => new Response(JSON.stringify(body), {
  status, headers: { ...CORS, 'Content-Type': 'application/json' },
});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ---------- Supabase database calls ----------
async function rpc(fn, args = {}, userJwt = null) {
  const c = cfg();
  const key = userJwt ? c.publishableKey : c.secretKey;
  const headers = { 'Content-Type': 'application/json', apikey: key };
  if (userJwt) headers.Authorization = `Bearer ${userJwt}`;
  else if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`;   // legacy service_role key
  const r = await fetch(`${c.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!r.ok) throw new HttpError(r.status === 401 ? 401 : 502, (body && body.message) || `Database error ${r.status}`);
  return body;
}

async function requireAdmin(req) {
  const jwt = (req.headers.get('authorization') || '').replace(/^Bearer\s+/i, '');
  if (!jwt || jwt === cfg().publishableKey) throw new HttpError(401, 'Sign in required');
  let me;
  try { me = await rpc('resolve_my_access', {}, jwt); } catch { throw new HttpError(401, 'Your session has expired. Sign in again.'); }
  if (!me || me.state !== 'active' || me.role !== 'admin') throw new HttpError(403, 'Administrator access required');
  return me;
}

// ---------- Google helpers ----------
async function fetchRetry(url, opts = {}) {
  let last;
  for (let i = 1; i <= MAX_ATTEMPTS; i++) {
    try {
      const r = await fetch(url, opts);
      if (r.status !== 429 && r.status < 500) return r;
      last = new Error(`Google returned ${r.status}`);
    } catch (e) {
      last = e;
    }
    if (i < MAX_ATTEMPTS) await sleep(cfg().retryDelayMs * 3 ** (i - 1));
  }
  throw new Error(`Network problem talking to Google: ${last?.message || 'unknown error'}`);
}

async function readJson(r) {
  const t = await r.text();
  try { return t ? JSON.parse(t) : {}; } catch { return { raw: t }; }
}

async function googleToken(refreshToken) {
  const c = cfg();
  if (!c.clientId || !c.clientSecret) throw new Error('GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are not set in Edge Function secrets');
  if (!refreshToken) throw new Error('Google Drive is not connected');
  const r = await fetchRetry('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: c.clientId, client_secret: c.clientSecret,
                                refresh_token: refreshToken, grant_type: 'refresh_token' }),
  });
  const j = await readJson(r);
  if (!r.ok || !j.access_token) {
    if (j.error === 'invalid_grant') throw new Error('Google Drive access was revoked or has expired. Reconnect Google Drive in Data Management.');
    throw new Error(`Could not get Google access (${j.error || r.status})`);
  }
  return j.access_token;
}

const authz = (token) => ({ Authorization: `Bearer ${token}` });

async function ensureFolder(token, folderId) {
  if (folderId) {
    const r = await fetchRetry(`${DRIVE}/files/${encodeURIComponent(folderId)}?fields=id,trashed,mimeType`, { headers: authz(token) });
    if (r.ok) {
      const f = await readJson(r);
      if (!f.trashed && f.mimeType === FOLDER_MIME) return f.id;
    } else if (r.status !== 404) {
      throw new Error(`Google Drive error ${r.status} while checking the backup folder`);
    }
  }
  const q = `name = '${FOLDER_NAME}' and mimeType = '${FOLDER_MIME}' and trashed = false and 'root' in parents`;
  const r2 = await fetchRetry(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id,name)&spaces=drive`, { headers: authz(token) });
  if (!r2.ok) throw new Error(`Google Drive error ${r2.status} while finding the backup folder`);
  const list = await readJson(r2);
  let id = list.files?.[0]?.id;
  if (!id) {
    const r3 = await fetchRetry(`${DRIVE}/files?fields=id`, {
      method: 'POST',
      headers: { ...authz(token), 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: FOLDER_NAME, mimeType: FOLDER_MIME, parents: ['root'],
                             description: 'Automatic backups from the Employee Time Clock. Private to this Google account.' }),
    });
    if (!r3.ok) throw new Error(`Google Drive error ${r3.status} while creating the backup folder`);
    id = (await readJson(r3)).id;
  }
  await rpc('svc_drive_set_folder', { p_folder_id: id });
  return id;
}

async function findRunFile(token, folderId, runId) {
  const q = `appProperties has { key='tcBackupRun' and value='${runId}' } and trashed = false and '${folderId}' in parents`;
  const r = await fetch(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id,name,size,parents,appProperties)`, { headers: authz(token) })
    .catch(() => null);
  if (!r || !r.ok) return null;
  return (await readJson(r)).files?.[0] || null;
}

// Upload once; on a network failure, check whether the file actually landed before trying again
// (prevents duplicate uploads).
async function upload(token, folderId, name, content, runId) {
  const boundary = `tc${crypto.randomUUID().replace(/-/g, '')}`;
  const meta = { name, parents: [folderId], mimeType: 'application/json', appProperties: { tcBackupRun: runId },
                 description: 'Employee Time Clock backup' };
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`
             + `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${content}\r\n--${boundary}--`;
  let last;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      const r = await fetch(`${UPLOAD}?uploadType=multipart&fields=id,name,size,parents`, {
        method: 'POST',
        headers: { ...authz(token), 'Content-Type': `multipart/related; boundary=${boundary}` },
        body,
      });
      if (r.ok) return { file: await readJson(r), attempts: attempt };
      const j = await readJson(r);
      last = new Error(`Google Drive upload failed (${r.status}${j.error?.message ? ': ' + j.error.message : ''})`);
      if (r.status !== 429 && r.status < 500) { last.permanent = true; throw last; }
    } catch (e) {
      if (e.permanent) throw e;
      last = e;
    }
    const landed = await findRunFile(token, folderId, runId);
    if (landed) return { file: landed, attempts: attempt };
    if (attempt < MAX_ATTEMPTS) await sleep(cfg().retryDelayMs * 3 ** (attempt - 1));
  }
  const err = new Error(`Upload failed after ${MAX_ATTEMPTS} attempts: ${last?.message || 'network error'}`);
  err.attempts = MAX_ATTEMPTS;
  throw err;
}

// Success is only reported after Google confirms the file AND its content matches byte-for-byte.
async function verify(token, folderId, fileId, runId, sha, size) {
  const r = await fetchRetry(`${DRIVE}/files/${encodeURIComponent(fileId)}?fields=id,size,parents,trashed,appProperties`, { headers: authz(token) });
  if (!r.ok) throw new Error(`Could not confirm the uploaded file (${r.status})`);
  const m = await readJson(r);
  if (m.trashed || !(m.parents || []).includes(folderId) || m.appProperties?.tcBackupRun !== runId) {
    throw new Error('Uploaded file is not in the backup folder');
  }
  if (Number(m.size) !== size) throw new Error(`Uploaded size ${m.size} does not match ${size} bytes`);
  const d = await fetchRetry(`${DRIVE}/files/${encodeURIComponent(fileId)}?alt=media`, { headers: authz(token) });
  if (!d.ok) throw new Error(`Could not read back the uploaded file (${d.status})`);
  const back = await d.text();
  if ((await sha256hex(back)) !== sha) throw new Error('Uploaded file content does not match (checksum mismatch)');
}

async function trash(token, fileId) {
  await fetch(`${DRIVE}/files/${encodeURIComponent(fileId)}`, {
    method: 'PATCH', headers: { ...authz(token), 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }),
  }).catch(() => {});
}

// ---------- the backup itself ----------
async function runBackup(trigger, { cronToken = null, requestedBy = null } = {}) {
  const begin = await rpc('svc_backup_begin', { p_trigger: trigger, p_cron_token: cronToken, p_requested_by: requestedBy });
  if (begin?.skip) return { status: 'skipped', reason: begin.skip };
  const runId = begin.run_id;
  let name = null, fileId = null, size = null, sha = null, attempts = 0, token = null;
  try {
    const text = await rpc('svc_backup_payload', { p_run_id: runId });
    const parsed = JSON.parse(text);
    if (parsed.format !== 'employee-time-tracker-backup' || !parsed.checksum_sha256) throw new Error('Backup data is invalid');
    sha = await sha256hex(text);
    size = new TextEncoder().encode(text).length;
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    name = `employee-time-tracker-backup_${stamp}_v${begin.data_version}.json`;
    const conf = await rpc('svc_drive_get_config');
    token = await googleToken(conf?.refresh_token);
    const folderId = await ensureFolder(token, conf?.folder_id);
    const up = await upload(token, folderId, name, text, runId);
    attempts = up.attempts; fileId = up.file.id;
    try {
      await verify(token, folderId, fileId, runId, sha, size);
    } catch (e) {
      await trash(token, fileId);   // never leave an unverified copy looking like a good backup
      throw e;
    }
    await rpc('svc_backup_finish', { p_run_id: runId, p_status: 'succeeded', p_file_name: name, p_drive_file_id: fileId,
                                     p_size: size, p_sha256: sha, p_attempts: attempts, p_error: null });
    return { status: 'succeeded', run_id: runId, file_name: name, drive_file_id: fileId, size_bytes: size };
  } catch (e) {
    const msg = String(e?.message || e).slice(0, 900);
    await rpc('svc_backup_finish', { p_run_id: runId, p_status: 'failed', p_file_name: name, p_drive_file_id: null,
                                     p_size: size, p_sha256: sha, p_attempts: e?.attempts || attempts, p_error: msg }).catch(() => {});
    return { status: 'failed', run_id: runId, error: msg };
  }
}

// ---------- OAuth connect flow ----------
async function connect(req, body) {
  const me = await requireAdmin(req);
  const c = cfg();
  if (!c.clientId || !c.clientSecret) throw new HttpError(500, 'GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are not set in Edge Function secrets');
  let ret;
  try { ret = new URL(String(body.return_url || '')); } catch { throw new HttpError(400, 'Invalid return address'); }
  const state = await rpc('svc_oauth_state_create', { p_employee_id: me.employee_id, p_return_url: ret.toString() });
  const p = new URLSearchParams({
    client_id: c.clientId, redirect_uri: `${functionUrl()}/callback`, response_type: 'code', scope: SCOPE,
    access_type: 'offline', prompt: 'consent', include_granted_scopes: 'false', state,
  });
  return json(200, { auth_url: `https://accounts.google.com/o/oauth2/v2/auth?${p}`, redirect_uri: `${functionUrl()}/callback` });
}

function page(title, text) {
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  return new Response(`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">`
    + `<title>${esc(title)}</title><body style="font-family:system-ui;padding:32px;max-width:520px;margin:auto">`
    + `<h2>${esc(title)}</h2><p>${esc(text)}</p></body>`, { status: 400, headers: { 'Content-Type': 'text/html; charset=utf-8' } });
}

function backTo(returnUrl, params) {
  const u = new URL(returnUrl);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  return new Response(null, { status: 302, headers: { Location: u.toString() } });
}

async function callback(url) {
  const state = url.searchParams.get('state') || '';
  const st = state ? await rpc('svc_oauth_state_consume', { p_state: state }) : null;
  if (!st) return page('Link expired', 'This Google Drive connection link is invalid or has expired. Go back to the app and tap “Connect Google Drive” again.');
  if (url.searchParams.get('error')) return backTo(st.return_url, { drive: 'error', reason: url.searchParams.get('error') });
  const c = cfg();
  try {
    const r = await fetchRetry('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ code: url.searchParams.get('code') || '', client_id: c.clientId, client_secret: c.clientSecret,
                                  redirect_uri: `${functionUrl()}/callback`, grant_type: 'authorization_code' }),
    });
    const tok = await readJson(r);
    if (!r.ok || !tok.access_token) throw new Error(tok.error || `token exchange failed (${r.status})`);
    if (!tok.refresh_token) throw new Error('no_refresh_token');
    if (tok.scope && !String(tok.scope).split(' ').includes(SCOPE)) throw new Error('drive_permission_not_granted');
    const about = await readJson(await fetchRetry(`${DRIVE}/about?fields=user(emailAddress)`, { headers: authz(tok.access_token) }));
    await rpc('svc_drive_save_connection', {
      p_refresh_token: tok.refresh_token, p_account_email: about.user?.emailAddress || null,
      p_employee_id: st.employee_id, p_function_url: functionUrl(), p_function_apikey: c.publishableKey,
    });
    await ensureFolder(tok.access_token, null);
    return backTo(st.return_url, { drive: 'connected' });
  } catch (e) {
    return backTo(st.return_url, { drive: 'error', reason: String(e.message || e).slice(0, 120) });
  }
}

async function disconnect(req) {
  await requireAdmin(req);
  const conf = await rpc('svc_drive_get_config');
  if (conf?.refresh_token) {
    await fetch('https://oauth2.googleapis.com/revoke', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ token: conf.refresh_token }),
    }).catch(() => {});
  }
  await rpc('svc_drive_clear');
  return json(200, { status: 'disconnected', note: 'Existing backup files were kept in your Google Drive.' });
}

async function listFiles(req) {
  await requireAdmin(req);
  const conf = await rpc('svc_drive_get_config');
  const token = await googleToken(conf?.refresh_token);
  const folderId = await ensureFolder(token, conf?.folder_id);
  const q = `'${folderId}' in parents and trashed = false and mimeType = 'application/json'`;
  const r = await fetchRetry(`${DRIVE}/files?q=${encodeURIComponent(q)}&orderBy=createdTime desc&pageSize=50`
    + `&fields=files(id,name,size,createdTime)`, { headers: authz(token) });
  if (!r.ok) throw new HttpError(502, `Google Drive error ${r.status}`);
  return json(200, { folder_id: folderId, files: (await readJson(r)).files || [] });
}

async function download(req, body) {
  await requireAdmin(req);
  const conf = await rpc('svc_drive_get_config');
  const token = await googleToken(conf?.refresh_token);
  const folderId = await ensureFolder(token, conf?.folder_id);
  const id = String(body.file_id || '');
  if (!/^[A-Za-z0-9_-]{5,200}$/.test(id)) throw new HttpError(400, 'Invalid file id');
  const m = await fetchRetry(`${DRIVE}/files/${encodeURIComponent(id)}?fields=id,name,parents,trashed`, { headers: authz(token) });
  const meta = await readJson(m);
  if (!m.ok || meta.trashed || !(meta.parents || []).includes(folderId)) throw new HttpError(403, 'That file is not in the backup folder');
  const d = await fetchRetry(`${DRIVE}/files/${encodeURIComponent(id)}?alt=media`, { headers: authz(token) });
  if (!d.ok) throw new HttpError(502, `Could not download the file (${d.status})`);
  return json(200, { name: meta.name, content: await d.text() });
}

// ---------- entry point ----------
async function handle(req) {
  if (req.method === 'OPTIONS') return new Response(null, { status: 204, headers: CORS });
  const url = new URL(req.url);
  if (req.method === 'GET' && url.pathname.endsWith('/callback')) return callback(url);
  if (req.method !== 'POST') return json(405, { error: 'Method not allowed' });

  const body = await req.json().catch(() => ({}));
  const cronToken = req.headers.get('x-cron-token');
  if (cronToken) {
    const trigger = body.trigger === 'scheduled' ? 'scheduled' : 'auto_change';
    return json(200, await runBackup(trigger, { cronToken }));
  }
  switch (body.action) {
    case 'connect': return connect(req, body);
    case 'backup_now': {
      const me = await requireAdmin(req);
      return json(200, await runBackup('manual', { requestedBy: me.employee_id }));
    }
    case 'list': return listFiles(req);
    case 'download': return download(req, body);
    case 'disconnect': return disconnect(req);
    default: return json(400, { error: 'Unknown action' });
  }
}

export async function handler(req) {
  try {
    return await handle(req);
  } catch (e) {
    return json(e instanceof HttpError ? e.status : 500, { error: String(e?.message || e) });
  }
}

globalThis.Deno?.serve(handler);
</script>

<script type="module">// =====================================================================
//  Employee Time Clock — single-file app
//  Security note: nothing in this script is a security control. The
//  database (Row Level Security + checked functions) decides everything;
//  this code only displays what the database allows.
// =====================================================================
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------------------------------------------------------------- config
const CONFIG = (() => {
  try { return JSON.parse(document.getElementById('tc-config').textContent); } catch { return {}; }
})();
const SUPABASE_URL = String(CONFIG.supabase_url || '').trim().replace(/\/$/, '');
const SUPABASE_KEY = String(CONFIG.supabase_publishable_key || '').trim();
const BACKUP_FUNCTION = 'drive-backup';

// ---------------------------------------------------------------- state
const S = {
  sb: null,
  me: null,            // resolve_my_access()
  dash: null,          // get_my_dashboard()
  settings: null,      // company settings visible to this user
  prefs: null,
  serverOffset: 0,     // server clock - device clock (ms)
  mode: 'employee',    // admins can switch between 'admin' and 'employee'
  onSignIn: false,
  checking: null,
  timers: new Set(),
};

// ---------------------------------------------------------------- DOM

// Safe DOM fill: flattens nested lists and skips null/false (so nothing renders as "null").
const clean = (nodes) => nodes.flat(Infinity).filter((n) => n !== null && n !== undefined && n !== false);
function put(el, ...nodes) { el.replaceChildren(...clean(nodes)); return el; }
function add(el, ...nodes) { el.append(...clean(nodes)); return el; }
const $app = () => document.getElementById('app');
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;               // CSSOM: allowed by the CSP
    else if (k === 'html') throw new Error('innerHTML is not used');
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), (e) => {
      // any failure inside a tap handler is shown, never silently swallowed
      const report = (err) => { console.error(err); toast(friendlyError(err), 'bad'); };
      try { const r = v(e); if (r && typeof r.catch === 'function') r.catch(report); } catch (err) { report(err); }
    });
    else if (k === 'value' && (tag === 'input' || tag === 'textarea' || tag === 'select')) el.value = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  if (tag === 'select' && attrs && attrs.value !== undefined) el.value = attrs.value;
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs = {}, ...children) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) el.setAttribute(k, String(v));
  for (const c of children.flat()) if (c) el.appendChild(c);
  return el;
}
// Simple line icons (24px grid, drawn for this app).

// ---------------------------------------------------------------- time & formatting (company time zone)
const tz = () => S.settings?.time_zone || 'America/Vancouver';
const nowServer = () => new Date(Date.now() + S.serverOffset);
function use24h() {
  const pref = S.prefs?.clock_format;
  if (pref === '24h') return true;
  if (pref === '12h') return false;
  return S.settings?.time_format === '24h';
}
function parts(date, opts = {}) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'long', ...opts });
  const o = {};
  for (const p of f.formatToParts(date)) o[p.type] = p.value;
  return o;
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// ymd: 'YYYY-MM-DD' (a calendar date) → company date format
function fmtYMD(ymd) {
  if (!ymd) return '—';
  const [y, m, d] = String(ymd).slice(0, 10).split('-');
  switch (S.settings?.date_format) {
    case 'yyyy-MM-dd': return `${y}-${m}-${d}`;
    case 'dd/MM/yyyy': return `${d}/${m}/${y}`;
    case 'MM/dd/yyyy': return `${m}/${d}/${y}`;
    default: return `${MONTHS[Number(m) - 1]} ${Number(d)}, ${y}`;
  }
}
const localYMD = (ts) => { const p = parts(new Date(ts)); return `${p.year}-${p.month}-${p.day}`; };
const todayYMD = () => localYMD(nowServer());
function fmtTime(ts) {
  if (!ts) return '—';
  const p = parts(new Date(ts));
  if (use24h()) return `${p.hour}:${p.minute}`;
  const hr = Number(p.hour) % 12 || 12;
  return `${hr}:${p.minute} ${Number(p.hour) < 12 ? 'AM' : 'PM'}`;
}
const fmtDateTime = (ts) => (ts ? `${fmtYMD(localYMD(ts))}, ${fmtTime(ts)}` : '—');
const monthDay = (ymd) => { if (!ymd) return '—'; const [, m, d] = String(ymd).slice(0, 10).split('-'); return `${MONTHS[Number(m) - 1]} ${Number(d)}`; };
const dayRange = (a, b) => (a === b ? monthDay(a) : `${monthDay(a)} – ${monthDay(b)}`);
// 'Fri Oct 16' — compact date for tables on small screens
function shortDay(ymd) {
  if (!ymd) return '—';
  const [, m, d] = String(ymd).slice(0, 10).split('-');
  return `${weekday(ymd)} ${MONTHS[Number(m) - 1]} ${Number(d)}`;
}
function weekday(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-CA', { weekday: 'short', timeZone: 'UTC' });
}
// instant → value for <input type="datetime-local"> in company time
function toLocalInput(ts) {
  if (!ts) return '';
  const p = parts(new Date(ts));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function minutesText(min) {
  if (min === null || min === undefined || Number.isNaN(Number(min))) return '—';
  const m = Math.round(Number(min));
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
}
const hoursDec = (min) => (min === null || min === undefined ? '' : (Number(min) / 60).toFixed(2));
function elapsedText(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60;
  return `${hh}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}
function money(v) {
  if (v === null || v === undefined || v === '') return '—';
  try {
    return new Intl.NumberFormat('en-CA', { style: 'currency', currency: S.settings?.currency_code || 'CAD' }).format(Number(v));
  } catch { return Number(v).toFixed(2); }
}
function addDays(ymd, n) {
  const [y, m, d] = ymd.split('-').map(Number);

}

// ---------------------------------------------------------------- errors
function friendlyError(err) {
  const msg = (err && (err.message || err.error_description || err.error || String(err))) || 'Something went wrong';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return 'No connection — nothing was saved. Check your signal and try again.';
  if (/Administrator access required/i.test(msg)) return 'Only an administrator can do that.';
  if (/permission denied/i.test(msg)) return 'Not allowed — the database refused this action.';
  if (/JWT|token is expired/i.test(msg)) return 'Your session expired. Please sign in again.';
  return msg.replace(/^ERROR:\s*/, '');
}
const isAuthError = (e) => !!e && /PGRST30[0-3]|\b401\b|JWT|token is expired|invalid claim|Not signed in/.test(`${e.code || ''} ${e.status || ''} ${e.message || ''}`);

// Run a database call; throws a readable Error on failure. Never pretends success.
async function db(promise) {
  const { data, error, count } = await promise;
  if (error) {
    if (isAuthError(error)) { handleExpired(); }
    const e = new Error(friendlyError(error)); e.raw = error; throw e;
  }
  return count !== undefined && count !== null && data === null ? count : data;
}
const rpc = (fn, args = {}) => db(S.sb.rpc(fn, args));
async function handleExpired() {
  try { await S.sb.auth.signOut({ scope: 'local' }); } catch { /* ignore */ }
  renderSignIn('Your session expired. Please sign in again.', 'warn');
}

function csvCell(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  let t = String(v);
  // spreadsheet formula-injection guard (numbers like -5.25 are left alone)
  if (/^[=+\-@\t\r]/.test(t) && !/^-?\d+(\.\d+)?$/.test(t)) t = `'${t}`;
  return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}

// ---------------------------------------------------------------- configuration check
function configProblem() {
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) || /YOUR-PROJECT-REF/i.test(SUPABASE_URL)) return 'setup';
  if (/REPLACE_ME/i.test(SUPABASE_KEY)) return 'setup';
  if (/^sb_secret_/i.test(SUPABASE_KEY)) return 'danger';
  if (/^eyJ/.test(SUPABASE_KEY)) {
    try {
      const p = JSON.parse(atob(SUPABASE_KEY.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (p.role === 'service_role') return 'danger';
      if (p.role === 'anon') return null;
    } catch { /* fall through */ }
  }
  if (!/^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(SUPABASE_KEY)) return 'setup';
  return null;
}

// ---------------------------------------------------------------- boot
async function boot() {
  const problem = configProblem();
  if (problem) return renderSetupScreen(problem);
  S.sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  const q = new URLSearchParams(location.search);
  const oauthError = q.get('error_description') || q.get('error');
  const drive = q.get('drive');
  if (drive) { store('tc.driveResult', { drive, reason: q.get('reason') || '' }); }
  if (oauthError || drive || q.get('code')) {
    const hash = drive ? '#/admin/data' : location.hash;
    // keep ?code for the sign-in library; it removes it itself
    if (!q.get('code')) history.replaceState(null, '', location.pathname + hash);
  }

  S.sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === 'SIGNED_OUT') { S.me = null; if (!S.onSignIn) renderSignIn('You are signed out.', 'ok'); return; }
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
        if (session) {
          if (q.get('code')) history.replaceState(null, '', location.pathname + location.hash);
          checkAccess({ initial: true });
        } else {
          renderSignIn(oauthError ? (/access_denied/.test(oauthError) ? 'Google sign-in was cancelled.' : `Sign-in failed: ${oauthError}`) : null,
                       oauthError ? 'bad' : 'info');
        }
      }
    }, 0);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.me) checkAccess({ quiet: true });
  });
  setInterval(() => { if (S.me && document.visibilityState === 'visible') checkAccess({ quiet: true }); }, 5 * 60 * 1000);
  window.addEventListener('hashchange', () => { if (S.me) route(); });
}

async function signIn(e) {
  e.currentTarget.disabled = true;
  const { error } = await S.sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } },
  });
  if (error) renderSignIn(`Could not start Google sign-in: ${error.message}`, 'bad');
}

async function signOut() {
  S.me = null;
  try {
    const { error } = await S.sb.auth.signOut();
    if (error) await S.sb.auth.signOut({ scope: 'local' });
  } catch { try { await S.sb.auth.signOut({ scope: 'local' }); } catch { /* ignore */ } }
  renderSignIn('You are signed out.', 'ok');
}

function checkAccess(opts = {}) {
  if (S.checking) return S.checking;
  S.checking = doCheckAccess(opts).finally(() => { S.checking = null; });
  return S.checking;
}

async function doCheckAccess({ initial = false, quiet = false } = {}) {
  if (initial && !quiet) setScreen(h('div', { class: 'center-screen' }, h('div', { class: 'spinner', 'aria-label': 'Loading' })));
  const { data, error } = await S.sb.rpc('resolve_my_access');
  if (error) {
    if (isAuthError(error)) { await S.sb.auth.signOut({ scope: 'local' }); return renderSignIn('Your session expired. Please sign in again.', 'warn'); }
    if (quiet) return;
    return renderProblem(friendlyError(error));
  }
  const prevKey = S.me ? `${S.me.state}|${S.me.role}|${S.me.employee_id}` : '';
  const key = `${data.state}|${data.role || ''}|${data.employee_id || ''}`;
  if (data.state === 'active') {
    S.me = data;
    if (quiet && prevKey === key) { refreshDash().catch(() => {}); return; }
    if (S.me.role !== 'admin') S.mode = 'employee';
    else if (!quiet) S.mode = (loadStored('tc.mode') === 'employee') ? 'employee' : 'admin';
    try { await refreshDash(); } catch (e) { return renderProblem(e.message); }
    return route();
  }
  S.me = null;
  if (data.state === 'session_invalid') {
    await S.sb.auth.signOut({ scope: 'local' });
    return renderSignIn('Your session has ended. Please sign in again.', 'warn');
  }
  const texts = {
    suspended: ['Your account is suspended', 'Your access has been paused by an administrator. Your records are kept. Please contact your administrator.', 'warn'],
    disabled: ['Your access has been revoked', 'This account no longer has access. Contact your administrator if you think this is a mistake.', 'bad'],
  };
  const [title, text, tone] = texts[data.state] || ['Waiting for approval',
    data.request_status === 'dismissed' ? 'This Google account is not approved for this company.'
      : 'This Google account isn’t approved yet. Your administrator can see your request. Once approved, tap Check again.', 'info'];
  renderBlocked(data.email, title, text, tone);
}

      h('button', { class: 'btn btn-block', onclick: signOut }, 'Sign out')))));

function renderBlocked(email, title, text, tone) {

async function refreshDash() {
  const seq = (S.dashSeq = (S.dashSeq || 0) + 1);
  const t0 = Date.now();
  const d = await rpc('get_my_dashboard');
  const t1 = Date.now();
  if (seq !== S.dashSeq) return S.dash;      // a newer refresh started meanwhile — keep its result
  S.serverOffset = new Date(d.server_now).getTime() - (t0 + t1) / 2;
  S.dash = d;
  S.settings = { ...(S.settings || {}), ...d.settings };
  S.prefs = d.preferences;
  applyPrefs();
  return d;
}
function applyPrefs() {
  const root = document.documentElement;
  if (S.prefs?.theme === 'light' || S.prefs?.theme === 'dark') root.dataset.theme = S.prefs.theme; else delete root.dataset.theme;
  root.classList.toggle('reduce-motion', !!S.prefs?.reduce_motion);
}

  ['home', 'Home', 'home'], ['clock', 'Clock in / out', 'clock'], ['hours', 'My hours', 'hours'],
  ['groups', 'Work groups', 'groups'], ['reports', 'Reports', 'report'], ['notes', 'Notes', 'note'],
  ['earnings', 'Earnings & payments', 'wallet'], ['settings', 'Settings', 'settings'],
];
const NAV_ADMIN = [
  ['admin', 'Admin dashboard', 'dashboard'], ['admin/employees', 'Employees', 'users'],
  ['admin/hours', 'All work hours', 'hours'], ['admin/groups', 'Work groups & worksites', 'map'],
  ['admin/reports', 'Submitted reports', 'report'], ['admin/pay', 'Pay rates & payments', 'wallet'],
  ['admin/notes', 'Employee notes', 'note'], ['admin/data', 'Data & backups', 'database'],
  ['admin/audit', 'Audit log', 'audit'], ['admin/settings', 'Admin settings', 'settings'],
];
const TABBAR = { employee: ['home', 'clock', 'hours', 'notes'], admin: ['admin', 'admin/employees', 'admin/hours', 'admin/reports'] };
const PAGES = {};   // filled in by the page modules: name -> async () => Node[]

function currentRoute() {
  const r = location.hash.replace(/^#\/?/, '').split('?')[0];
  return r || (S.mode === 'admin' ? 'admin' : 'home');
}
function go(r) { if (location.hash === `#/${r}`) route(); else location.hash = `#/${r}`; }

async function route() {
  if (!S.me) return;
  let r = currentRoute();
  let isAdminRoute = r === 'admin' || r.startsWith('admin/');
  if (isAdminRoute && S.me.role !== 'admin') { r = 'home'; isAdminRoute = false; history.replaceState(null, '', '#/home'); }
  if (S.me.role !== 'admin') S.mode = 'employee';
  else if (isAdminRoute) S.mode = 'admin';
  else if (S.me.role === 'admin' && PAGES[r]) S.mode = 'employee';
  if (!PAGES[r]) r = S.mode === 'admin' ? 'admin' : 'home';
  store('tc.mode', S.mode);
  // leaving a page closes any open sheet (without triggering its own page refresh)
  S.closingForRoute = true;
  document.querySelectorAll('dialog.sheet[open]').forEach((d) => d.close());
  S.closingForRoute = false;
  renderShell(r);
  const page = document.getElementById('page');
  put(page, h('div', { class: 'loading-block' }, h('div', { class: 'spinner' })));
  try {
    const nodes = await PAGES[r]();
    if (currentRoute() !== r && location.hash) return;   // user moved on
    put(page, ...[nodes].flat());
    page.focus({ preventScroll: true });
  } catch (e) {
    put(page, h('div', { class: 'notice bad' }, friendlyError(e)),
      h('button', { class: 'btn', style: 'margin-top:12px', onclick: () => route() }, 'Try again'));
  }
}

function renderShell(active) {

  const company = S.settings?.company_name || 'Time Clock';
  document.title = `${(nav.find((n) => n[0] === active) || [, 'Home'])[1]} · ${company}`;
  const link = ([r, label, ic]) => h('a', { href: `#/${r}`, class: `nav-link${r === active ? ' active' : ''}`,
    'aria-current': r === active ? 'page' : null }, icon(ic), h('span', {}, label));
  const switcher = S.me.role === 'admin'
    ? h('button', { class: 'nav-link switch', onclick: () => { S.mode = S.mode === 'admin' ? 'employee' : 'admin'; go(S.mode === 'admin' ? 'admin' : 'home'); } },
        icon('swap'), h('span', {}, S.mode === 'admin' ? 'My time clock' : 'Admin'))
    : null;
  const p = S.dash?.profile || {};
  const sidebar = h('aside', { class: 'sidebar' },
    h('div', { class: 'side-brand' }, brandMark(), h('div', {}, h('div', { class: 'brand-name' }, company),
      h('div', { class: 'muted small' }, S.mode === 'admin' ? 'Administration' : 'Time clock'))),
    h('nav', { class: 'side-nav', 'aria-label': 'Main' }, nav.map(link)),
    h('div', { class: 'side-foot' }, switcher,
      h('div', { class: 'who' }, h('div', { class: 'avatar sm' }, initials(p.display_name || p.full_name)),
        h('div', { class: 'who-text' }, h('div', { class: 'strong ellipsis' }, p.display_name || p.full_name || ''),
          h('div', { class: 'muted small ellipsis', title: p.email }, p.email || ''))),
      h('button', { class: 'nav-link', onclick: signOut }, icon('logout'), h('span', {}, 'Sign out'))));

  const tabs = TABBAR[S.mode].map((r) => nav.find((n) => n[0] === r));
  const tabbar = h('nav', { class: 'tabbar', 'aria-label': 'Main' },
    tabs.map(([r, label, ic]) => h('a', { href: `#/${r}`, class: `tab${r === active ? ' active' : ''}`, 'aria-current': r === active ? 'page' : null },
      icon(ic, 22), h('span', {}, shortLabel(label)))),
    h('button', { class: `tab${tabs.some((t) => t[0] === active) ? '' : ' active'}`, onclick: () => openMoreSheet(nav, active, switcher) },
      icon('more', 22), h('span', {}, 'More')));

  const topbar = h('header', { class: 'topbar' }, brandMark(30), h('div', { class: 'brand-name ellipsis' }, company),
    h('span', { class: 'spacer' }),
    h('span', { class: 'top-email ellipsis', title: p.email }, p.email || ''));

  setScreen(h('div', { class: 'shell' }, sidebar,
    h('div', { class: 'main' }, topbar, pendingBanner(), h('main', { id: 'page', class: 'page', tabindex: '-1' })),
    tabbar));
}
const shortLabel = (l) => ({ 'Clock in / out': 'Clock', 'My hours': 'Hours', 'Admin dashboard': 'Dashboard',
  'All work hours': 'Hours', 'Submitted reports': 'Reports' }[l] || l);
const initials = (n) => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0].toUpperCase()).join('');

function openMoreSheet(nav, active, switcher) {
  const sheet = openSheet({ title: 'Menu' });
  const close = () => sheet.close();
  add(sheet.body, h('div', { class: 'more-list' },
    nav.map(([r, label, ic]) => h('a', { href: `#/${r}`, class: `more-item${r === active ? ' active' : ''}`, onclick: close }, icon(ic), label)),
    S.me.role === 'admin' ? h('button', { class: 'more-item', onclick: () => { close(); S.mode = S.mode === 'admin' ? 'employee' : 'admin'; go(S.mode === 'admin' ? 'admin' : 'home'); } },
      icon('swap'), S.mode === 'admin' ? 'Switch to my time clock' : 'Switch to admin') : null,
    h('button', { class: 'more-item', onclick: () => { close(); signOut(); } }, icon('logout'), 'Sign out')));
}

// A request that did not finish (e.g. lost connection) — offer to finish or discard it.
function pendingBanner() {
  const p = loadStored('tc.pending');
  if (!p || p.employee_id !== S.me?.employee_id) return null;
  const what = p.kind === 'clock_in' ? 'clock-in' : p.kind === 'clock_out' ? 'clock-out' : 'report submission';
  return h('div', { class: 'pending-banner' },
    icon('alert'), h('span', {}, `Your ${what} from ${fmtTime(p.at)} wasn’t confirmed by the server.`),
    h('button', { class: 'btn btn-sm', onclick: async (e) => {
      e.currentTarget.disabled = true;
      try { await finishPending(p); toast('Done — saved.'); } catch (err) { toast(friendlyError(err), 'bad'); }
      route();
    } }, 'Finish now'),
    h('button', { class: 'btn btn-sm btn-ghost', onclick: () => { store('tc.pending', undefined); route(); } }, 'Discard'));
}
async function finishPending(p) {
  const result = await rpc(p.fn, p.args);       // same request id → saved at most once
  store('tc.pending', undefined);
  await refreshDash();
  return result;
}
// Send a request that must not be duplicated. The request id is kept until the server confirms.
async function safeRequest(kind, fn, args) {
  const p = { kind, fn, args, at: new Date().toISOString(), employee_id: S.me.employee_id };
  store('tc.pending', p);
  const result = await rpc(fn, args);            // throws on failure → pending stays for retry
  store('tc.pending', undefined);
  return result;
}

// ---------------------------------------------------------------- sheets (bottom sheet on phones, dialog on desktop)
function openSheet({ title, wide = false, onClose = null } = {}) {
  const dlg = h('dialog', { class: `sheet${wide ? ' wide' : ''}`, 'aria-label': title });
  const body = h('div', { class: 'sheet-body' });
  const closeBtn = h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: () => dlg.close() }, icon('close'));
  add(dlg, h('div', { class: 'sheet-grip', 'aria-hidden': 'true' }), h('div', { class: 'sheet-head' }, h('h2', {}, title), closeBtn), body);
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); if (onClose && !S.closingForRoute) onClose(); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  dlg.showModal();
  return { dlg, body, close: () => dlg.close(), setTitle: (t) => { dlg.querySelector('h2').textContent = t; } };
}

// fields: [{name,label,type,value,options,required,placeholder,max,help,min,step}]
function formSheet({ title, text, fields = [], confirm = 'Save', danger = false, wide = false, notice = null }) {
  return new Promise((resolve) => {
    let done = false;
    const sheet = openSheet({ title, wide, onClose: () => { if (!done) resolve(null); } });
    const inputs = {};
    const form = h('form', { class: 'stack' },
      text ? h('p', { class: 'muted' }, text) : null,
      notice,
      fields.map((f) => {
        let input;
        if (f.type === 'select') input = h('select', { required: !!f.required }, f.options.map(([v, l]) => h('option', { value: v }, l)));
        else if (f.type === 'textarea') input = h('textarea', { rows: f.rows || 4, maxlength: f.max || 2000, placeholder: f.placeholder || '', required: !!f.required });
        else if (f.type === 'checkbox') input = h('input', { type: 'checkbox' });
        else input = h('input', { type: f.type || 'text', placeholder: f.placeholder || '', required: !!f.required,
          maxlength: f.max || null, min: f.min ?? null, max: f.maxValue ?? null, step: f.step ?? null,
          inputmode: f.inputmode || null, autocapitalize: f.type === 'email' ? 'none' : null });
        if (f.type === 'checkbox') input.checked = !!f.value; else if (f.value !== undefined && f.value !== null) input.value = f.value;
        inputs[f.name] = input;
        if (f.type === 'checkbox') return h('label', { class: 'check-row' }, input, h('span', {}, f.label));
        return h('label', { class: 'field' }, h('span', {}, f.label), input, f.help ? h('small', { class: 'muted' }, f.help) : null);
      }),
      h('div', { class: 'sheet-actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => sheet.close() }, 'Cancel'),
        h('button', { class: `btn ${danger ? 'btn-danger-solid' : 'btn-primary'}`, type: 'submit' }, confirm)));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const out = {};
      for (const [k, el] of Object.entries(inputs)) out[k] = el.type === 'checkbox' ? el.checked : el.value;
      done = true; resolve(out); sheet.close();
    });
    add(sheet.body, form);
    // focus the first field right away (desktop only; on phones the keyboard would cover the sheet)
    const first = form.querySelector('input:not([type=checkbox]),textarea,select');
    if (first && !('ontouchstart' in window) && !form.contains(document.activeElement)) first.focus();
  });
}

// Run an action from a button: disables it, shows errors, never reports success unless the server confirmed.
async function act(btn, fn, okMessage) {
  if (btn) btn.disabled = true;
  try {
    const r = await fn();
    if (okMessage) toast(okMessage);
    return r;
  } catch (e) {
    toast(friendlyError(e), 'bad');
    return undefined;
  } finally {
    if (btn && btn.isConnected) btn.disabled = false;
  }
}

// ---------------------------------------------------------------- live clock
function liveClock({ size = 'big' } = {}) {
  const active = !!S.dash?.active_shift;
  const ticks = [];
  const ring = s('svg', { viewBox: '0 0 200 200', class: 'clock-ring', 'aria-hidden': 'true' });
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const major = i % 5 === 0;
    const r1 = major ? 80 : 84, r2 = 92;
    const line = s('line', { x1: 100 + r1 * Math.cos(a), y1: 100 + r1 * Math.sin(a), x2: 100 + r2 * Math.cos(a), y2: 100 + r2 * Math.sin(a),
      class: `tick${major ? ' major' : ''}` });
    ticks.push(line); ring.appendChild(line);
  }
  const hm = h('span', { class: 'clock-hm' });
  const sec = h('span', { class: 'clock-sec' });
  const ampm = h('span', { class: 'clock-ampm' });
  const dateEl = h('div', { class: 'clock-date' });
  const time = h('div', { class: 'clock-time', role: 'timer', 'aria-live': 'off' }, hm, sec, ampm);
  const el = h('div', { class: `clock ${size}${active ? ' on' : ''}` }, ring,
    h('div', { class: 'clock-face' }, time, dateEl,
      h('div', { class: 'clock-tz' }, tz().replace(/_/g, ' '))));
  let lastSec = -1;
  const update = () => {
    const now = nowServer();
    const p = parts(now);
    const hr = Number(p.hour);
    hm.textContent = use24h() ? `${p.hour}:${p.minute}` : `${hr % 12 || 12}:${p.minute}`;
    sec.textContent = S.prefs?.show_seconds === false ? '' : `:${p.second}`;
    ampm.textContent = use24h() ? '' : (hr < 12 ? 'AM' : 'PM');
    dateEl.textContent = `${p.weekday}, ${fmtYMD(`${p.year}-${p.month}-${p.day}`)}`;
    const sNow = Number(p.second);
    if (sNow !== lastSec) {
      ticks.forEach((t, i) => t.classList.toggle('lit', i <= sNow));
      ticks.forEach((t, i) => t.classList.toggle('now', i === sNow));
      lastSec = sNow;
    }
  };
  update();
  const t = setTimeout(() => { update(); every(1000, update); }, 1000 - ((Date.now() + S.serverOffset) % 1000) + 5);
  S.timers.add(t);
  return el;
}

// elapsed counter for the active shift (display only; official times come from the database)
function elapsedNode(since, cls = 'elapsed') {
  const el = h('span', { class: cls });
  const u = () => { el.textContent = elapsedText(nowServer() - new Date(since)); };
  u(); every(1000, u);
  return el;
}
